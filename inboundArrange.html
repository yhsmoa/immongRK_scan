<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입고정리</title>
    <style>
        :root{
            --bg:#f3f4f6; --card:#fff; --ink:#0f172a; --ink-soft:#374151; --muted:#94a3b8;
            --line:#eef2f7; --primary:#4f46e5; --primary-dark:#4338ca; --blue:#2563eb; --hover:#f8fafc;
        }
        *{box-sizing:border-box;}
        body{margin:0;font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink-soft);font-size:13.5px;-webkit-font-smoothing:antialiased;}
        .page{max-width:1720px;width:96%;margin:22px auto;}
        .card{background:var(--card);border:1px solid #edeff3;border-radius:16px;box-shadow:0 1px 3px rgba(15,23,42,.05),0 10px 30px rgba(15,23,42,.035);padding:22px 24px 18px;}
        .head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
        .title-wrap{display:flex;align-items:baseline;gap:12px;}
        .title{font-size:20px;font-weight:700;color:var(--ink);margin:0;letter-spacing:-.3px;}
        .subtitle{font-size:13px;color:var(--muted);font-weight:500;}
        .subtitle b{color:var(--primary);font-weight:600;}
        .actions{display:flex;align-items:center;gap:8px;}
        .btn{height:38px;padding:0 15px;border:1px solid #e2e8f0;background:#fff;color:#334155;border-radius:9px;font-size:13.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s;white-space:nowrap;}
        .btn:hover{background:var(--hover);border-color:#cbd5e1;}
        .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600;box-shadow:0 1px 2px rgba(79,70,229,.25);}
        .btn.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);}
        .btn:disabled{opacity:.45;cursor:not-allowed;}

        .search{position:relative;margin:0 auto 16px;width:66.67%;}
        .search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);}
        .search input{width:100%;height:44px;padding:0 16px 0 46px;border:1px solid #e5e9f0;border-radius:10px;background:#fff;font-size:14px;color:var(--ink);outline:none;transition:border-color .12s,box-shadow .12s;}
        .search input::placeholder{color:var(--muted);}
        .search input:focus{border-color:#c7d2fe;box-shadow:0 0 0 4px rgba(99,102,241,.10);}

        .actions select{height:38px;padding:0 10px;border:1px solid #e2e8f0;border-radius:9px;background:#fff;font-size:13px;color:#334155;cursor:pointer;outline:none;}
        .actions select:focus{border-color:#c7d2fe;box-shadow:0 0 0 3px rgba(99,102,241,.1);}
        .actions .sel-code{min-width:160px;}

        .tabbar{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px;}
        .tabs{display:flex;gap:6px;}
        .tabbar-right{display:flex;align-items:center;gap:8px;}
        .tabbar-right .btn{height:34px;padding:0 14px;}
        #batchFilter{height:34px;padding:0 10px;border:1px solid #e2e8f0;border-radius:9px;background:#fff;font-size:13px;color:#334155;cursor:pointer;outline:none;}
        .batch{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:#eef2ff;color:#4f46e5;white-space:nowrap;}
        .batch.latest{background:#fef3c7;color:#b45309;}
        .newtag{margin-left:5px;font-size:9px;font-weight:800;color:#fff;background:#f59e0b;border-radius:4px;padding:1px 4px;letter-spacing:.03em;vertical-align:middle;}
        tbody tr.latest td{background:#fffbeb;}
        tbody tr.latest:hover td{background:#fef3c7;}
        .tab{height:34px;padding:0 16px;border:1px solid #e2e8f0;background:#fff;color:#475569;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
        .tab:hover{background:var(--hover);}
        .tab.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600;}
        .tab .cnt{font-size:11.5px;opacity:.8;}

        .table-scroll{overflow-x:auto;}
        table{width:100%;border-collapse:collapse;min-width:1000px;}
        thead th{position:sticky;top:0;z-index:2;background:#f1f3f6;text-align:left;font-size:12px;font-weight:600;color:#8b94a3;padding:10px 10px;border:1px solid #dfe3ea;white-space:nowrap;overflow:hidden;}
        thead th.ctr{text-align:center;}
        tbody td{padding:8px 10px;border:1px solid #e8ebf1;color:var(--ink-soft);font-size:12.5px;white-space:nowrap;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;}
        tbody tr:hover td{background:var(--hover);}
        td.ctr{text-align:center;font-variant-numeric:tabular-nums;}
        td.pname{white-space:normal;color:#334155;}
        .name-badge{display:inline-block;background:#dbeafe;color:#2563eb;border:1px solid #bfdbfe;border-radius:6px;padding:0 6px;white-space:nowrap;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
        th.chk,td.chk{width:42px;text-align:center;padding-left:0;padding-right:0;}
        td.code{font-weight:600;color:#1e293b;}
        td.ord{font-weight:600;color:#1e293b;}
        .dash{color:#cbd5e1;}
        /* 박스 열 — 출고스캔에서 가상으로 잡힌 박스 (쉽먼트·발주서 관리와 같은 규칙: 🔀 섞임 연보라 테두리 · 👾 전부 가상 진보라 채움) */
        .vbox{display:inline-block;margin-right:4px;font-size:11.5px;font-weight:700;border-radius:5px;padding:1px 6px;white-space:nowrap;line-height:1.5;font-variant-numeric:tabular-nums;}
        .vbox.virtual-part{background:#EEEDFE;color:#3C3489;border:1.5px solid #7F77DD;}
        .vbox.virtual-all{background:#534AB7;color:#EEEDFE;border:1.5px solid #534AB7;}
        .vbox.virtual-ok{background:#E1F5EE;color:#085041;border:1.5px solid #1D9E75;}   /* 가상확정 — 상품 다 찾아옴 */
        .state-row td{text-align:center;padding:48px 12px;color:var(--muted);}
        .table-scroll::-webkit-scrollbar{width:10px;height:10px;}
        .table-scroll::-webkit-scrollbar-thumb{background:#d7dee8;border-radius:8px;border:2px solid #fff;}
        .table-scroll::-webkit-scrollbar-thumb:hover{background:#c2ccd9;}

        /* 오른쪽 슬라이드 패널 (발주서 선택) */
        .side-back{position:fixed;inset:0;background:rgba(15,23,42,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10001;}
        .side-back.show{opacity:1;pointer-events:auto;}
        .side-panel{position:fixed;top:0;right:0;height:100vh;width:560px;max-width:92vw;background:#fff;box-shadow:-8px 0 30px rgba(15,23,42,.15);transform:translateX(100%);transition:transform .25s ease;z-index:10002;display:flex;flex-direction:column;}
        .side-panel.show{transform:translateX(0);}
        .side-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #eef2f7;font-size:15px;font-weight:600;color:#0f172a;}
        .side-head .sub{font-size:12px;font-weight:500;color:#94a3b8;margin-left:8px;}
        .side-head button.x{border:none;background:transparent;font-size:18px;cursor:pointer;color:#94a3b8;line-height:1;}
        .side-tools{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid #eef2f7;gap:10px;}
        .side-tools label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#334155;cursor:pointer;}
        .side-list{overflow-y:auto;padding:4px 4px 16px;flex:1;}
        .side-date{display:inline-block;background:#2563eb;color:#fff;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:6px;margin:14px 6px 9px;user-select:none;cursor:pointer;}
        .side-date:hover{background:#1d4ed8;}
        .side-date.sel{background:#1e3a8a;box-shadow:0 0 0 2px rgba(37,99,235,.35);}
        .side-orders{display:flex;flex-wrap:wrap;gap:8px;padding:0 8px 8px;}
        .side-order{padding:8px 12px;border:1px solid #e5e9f0;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;}
        .side-order:hover{background:#f8fafc;}
        .side-order.sel{background:#eef2ff;border-color:#c7d2fe;}
        .side-order .so-body{display:flex;flex-direction:column;}
        .so-no{font-size:13px;font-weight:600;color:#1e293b;white-space:nowrap;}
        .so-cnt{color:#94a3b8;font-weight:500;font-size:12px;}
        .so-center{font-size:12px;color:#1e293b;margin-top:2px;}
        .side-foot{padding:12px 18px;border-top:1px solid #eef2f7;display:flex;justify-content:flex-end;gap:8px;}
        input[type="checkbox"]{width:16px;height:16px;cursor:pointer;accent-color:var(--primary);}

        /* 인쇄 (importChina 방식: 화면 테이블만 A4 가로로) */
        @media print {
            body * { visibility: hidden; }
            .card, .card * { visibility: visible; }
            .card { position: absolute; left: 0; top: 0; width: 100%; padding: 0; margin: 0; border: none; box-shadow: none; }
            .head, .search, .selector, .tabbar { display: none !important; }
            .table-scroll { max-height: none !important; overflow: visible !important; }
            table { font-size: 11px !important; min-width: 0 !important; table-layout: auto; }
            thead th, tbody td { border: 1px solid #000 !important; padding: 4px !important; font-size: 11px !important; white-space: nowrap; width: 1%; }
            thead th { background: #f2f2f2 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; position: static !important; }
            th.chk, td.chk { display: none !important; } /* 체크박스 열 인쇄 제외 */
            /* 상품명(6번째) 열만 넓게, 나머지는 내용 너비로 축소 */
            th:nth-child(6), td.pname { white-space: normal !important; width: auto; word-break: break-word; }
            tbody tr.latest td { background: #fff !important; }
            /* 출고번호 그룹 경계 — 발주서(rocket) 인쇄와 같은 2px 검은 선. 다음 행의 출고번호가 바뀌는 행에 붙는다 */
            tbody tr.ge td { border-bottom: 2px solid #000 !important; }
            .batch, .newtag { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            @page { size: A4 landscape; margin: 0.5cm; }
        }

        /* 정렬 버튼 · 모달 */
        .btn.sort-on{background:#eef2ff;border-color:#c7d2fe;color:var(--primary);font-weight:600;}
        .btn .sort-cnt{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--primary);color:#fff;font-size:11px;font-weight:700;}
        th .sort-ind{margin-left:5px;font-size:10.5px;font-weight:700;color:var(--primary);background:#eef2ff;border-radius:5px;padding:1px 4px;}
        .modal-back{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;z-index:10003;padding:16px;}
        .modal-back.show{display:flex;}
        .modal{background:#fff;border-radius:14px;width:540px;max-width:100%;box-shadow:0 20px 50px rgba(15,23,42,.25);}
        .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 4px;font-size:16px;font-weight:700;color:var(--ink);}
        .modal-head button.x{border:none;background:transparent;font-size:18px;cursor:pointer;color:#94a3b8;line-height:1;}
        .modal-desc{padding:0 20px 14px;font-size:12.5px;color:var(--muted);line-height:1.55;}
        .sort-rows{padding:0 20px;display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;}
        .sort-row{display:flex;align-items:center;gap:8px;}
        .sort-rank{flex:0 0 52px;font-size:12px;font-weight:700;color:var(--primary);background:#eef2ff;border-radius:999px;padding:5px 0;text-align:center;}
        .sort-row select{flex:1;min-width:0;height:34px;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;font-size:13px;color:#334155;outline:none;cursor:pointer;}
        .sort-row select:focus{border-color:#c7d2fe;box-shadow:0 0 0 3px rgba(99,102,241,.1);}
        .dir{display:inline-flex;flex:0 0 auto;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;}
        .dir button{height:32px;padding:0 10px;border:none;background:#fff;font-size:12.5px;color:#475569;cursor:pointer;}
        .dir button + button{border-left:1px solid #e2e8f0;}
        .dir button.on{background:var(--primary);color:#fff;font-weight:600;}
        .icon-btn{flex:0 0 30px;height:32px;border:1px solid #e2e8f0;background:#fff;border-radius:8px;cursor:pointer;color:#64748b;font-size:12px;}
        .icon-btn:hover:not(:disabled){background:var(--hover);}
        .icon-btn:disabled{opacity:.35;cursor:default;}
        .add-rule{display:block;margin:10px 20px 0;width:calc(100% - 40px);height:36px;border:1px dashed #c7d2fe;background:#f8faff;color:var(--primary);border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;}
        .add-rule:disabled{opacity:.45;cursor:not-allowed;}
        .modal-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 20px;border-top:1px solid #eef2f7;margin-top:18px;}
        .modal-foot .right{display:flex;gap:8px;}
        .modal-foot .btn{height:36px;}
        @media (max-width:560px){ .dir button{padding:0 7px;} .sort-rank{flex-basis:44px;} }

        /* 일괄 가상스캔 모달 — 옵션 세그먼트는 출고스캔 모달(.vs-seg)과 같은 규칙, 본문은 발주서별 표 */
        .vb-modal{width:900px;max-width:96vw;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;}
        .vb-modal .modal-head{padding:16px 20px 10px;}
        .vb-sub{font-size:12.5px;color:#94a3b8;font-weight:500;margin-left:8px;}
        .vb-opts{display:flex;flex-direction:column;gap:8px;padding:6px 20px 12px;border-bottom:1px solid var(--line);}
        .vb-opt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;}
        .vb-opt .lbl{flex:0 0 64px;font-weight:600;color:#475569;}
        .vb-seg{display:inline-flex;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;}
        .vb-seg button{height:32px;padding:0 12px;border:none;background:#fff;font-size:12.5px;color:#475569;cursor:pointer;}
        .vb-seg button + button{border-left:1px solid #e2e8f0;}
        .vb-seg button.on{background:var(--primary);color:#fff;font-weight:600;}
        .vb-seg button:disabled{opacity:.45;cursor:not-allowed;}
        .vb-opt .hint{font-size:12px;color:#94a3b8;}
        .vb-opt .hint b.need{color:#dc2626;font-weight:700;}
        .vb-opt .code{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:8px;background:#eef2ff;color:var(--primary);font-weight:700;font-size:13px;}
        .vb-body{flex:1 1 auto;overflow:auto;padding:0 20px;min-height:120px;}
        .vb-msg{padding:28px 0;text-align:center;color:#94a3b8;font-size:13.5px;}
        .vb-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0;}
        .vb-tbl th,.vb-tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;}
        .vb-tbl th{position:sticky;top:0;background:#f8fafc;color:#64748b;font-weight:600;font-size:12px;white-space:nowrap;z-index:1;}
        .vb-tbl td.chk,.vb-tbl th.chk{width:28px;text-align:center;}
        .vb-tbl td.ord{white-space:nowrap;font-weight:600;color:#1e293b;}
        .vb-tbl td.ord small{display:block;font-weight:400;color:#94a3b8;}
        .vb-tbl td.num{white-space:nowrap;}
        .vb-tbl tr.skip td{color:#94a3b8;background:#fafafa;}
        .vb-tbl tr.error td{background:#fef2f2;}
        .vb-tbl tr.saved td{background:#f0fdf4;}
        .vb-bx{display:inline-flex;align-items:center;gap:4px;margin:1px 4px 1px 0;padding:1px 7px;border-radius:6px;font-size:11.5px;background:#f1f5f9;color:#334155;white-space:nowrap;}
        .vb-bx.new{background:#eef2ff;color:#3730a3;}
        .vb-bx.up{background:#fff7ed;color:#9a3412;}
        .vb-bx b{font-weight:700;}
        .vb-st{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
        .vb-st.ready{background:#eef2ff;color:#4338ca;}
        .vb-st.saved{background:#dcfce7;color:#166534;}
        .vb-st.skip{background:#f1f5f9;color:#64748b;}
        .vb-st.error{background:#fee2e2;color:#b91c1c;}
        .vb-why{color:#64748b;font-size:12px;}
        .vb-warn{cursor:help;color:#b45309;font-size:12px;margin-left:4px;}
        .vb-note{font-size:12.5px;color:#64748b;flex:1;min-width:0;}
        .vb-note.err{color:#dc2626;}
        .vb-sum{display:flex;gap:14px;flex-wrap:wrap;padding:8px 0 2px;font-size:12.5px;color:#475569;}
        .vb-sum b{color:var(--primary);}

        /* 박스라벨출력 — label-service 임베드 (쉽먼트 페이지와 같은 모달) */
        .label-back{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:10004;}
        .label-back.show{display:flex;}
        .label-modal{background:#fff;border-radius:14px;width:560px;max-width:94vw;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(15,23,42,.3);}
        .label-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #eef2f7;}
        .label-head h3{margin:0;font-size:16px;color:var(--ink);}
        .label-head .sub{font-size:12.5px;color:#94a3b8;font-weight:500;margin-left:8px;}
        .label-head button{border:none;background:transparent;font-size:18px;cursor:pointer;color:#94a3b8;line-height:1;}
        .label-modal iframe{display:block;width:100%;height:480px;min-height:300px;flex:1 1 auto;border:0;background:#fff;}
        .label-status{padding:8px 18px;font-size:13px;color:#15803d;border-top:1px solid #eef2f7;}
        .label-status:empty{display:none;}
        .label-opts{padding:10px 18px;border-bottom:1px solid #eef2f7;font-size:13.5px;color:#1e293b;}
        .label-opts label{display:flex;align-items:center;gap:8px;cursor:pointer;flex-wrap:wrap;}
        .label-opts input{width:16px;height:16px;accent-color:#6366f1;}
        .label-opts small{color:#94a3b8;font-size:12px;}

        #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:13px 20px;border-radius:10px;font-size:13.5px;line-height:1.5;box-shadow:0 8px 24px rgba(15,23,42,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10010;max-width:90vw;white-space:pre-line;text-align:center;}
        #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    </style>
</head>
<body>
    <div id="header-container"></div>

    <div class="page">
        <div class="card">
            <div class="head">
                <div class="title-wrap">
                    <h1 class="title">입고정리</h1>
                    <span class="subtitle">표시 <b id="rowCount">0</b>건</span>
                </div>
                <div class="actions">
                    <select id="yearSel" onchange="onYearChange()"></select>
                    <select id="monthSel" onchange="onMonthChange()"></select>
                    <select id="codeSel" class="sel-code" onchange="onCodeChange()"></select>
                    <button class="btn primary" id="prepareBtn" onclick="openOrderPanel()">출고준비</button>
                    <!-- 일괄 가상스캔: 체크한 행의 출고번호(=발주번호)마다 출고스캔의 [가상스캔]을 같은 옵션으로 돌려 박스를 잡는다 (출고준비 → 가상스캔 → 박스라벨출력 순) -->
                    <button class="btn" id="vbBtn" onclick="openVirtualBatch()">가상스캔</button>
                    <!-- 임시: 체크한 행의 출고번호(=발주번호)로 쉽먼트와 같은 박스 라벨을 찍는다 (표 순서 = 인쇄 순서) -->
                    <button class="btn" id="boxLabelPrintBtn" onclick="openBoxLabelPrint()">박스라벨출력</button>
                </div>
            </div>

            <div class="search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input id="searchInput" type="text" placeholder="입고코드 · 박스명 · 중국번호 · 상품명 · 바코드 · 출고번호 검색 후 Enter" onkeydown="if(event.key==='Enter')render()">
            </div>

            <div class="tabbar">
                <div class="tabs">
                    <button class="tab active" id="tab-shipping" onclick="switchTab('shipping')">출고리스트 <span class="cnt" id="cnt-shipping">0</span></button>
                    <button class="tab" id="tab-stock" onclick="switchTab('stock')">남은상품 <span class="cnt" id="cnt-stock">0</span></button>
                </div>
                <div class="tabbar-right">
                    <select id="batchFilter" onchange="onBatchFilter()"><option value="all">전체 회차</option></select>
                    <button class="btn" id="sortBtn" onclick="openSortModal()">정렬</button>
                    <button class="btn" onclick="window.print()">인쇄</button>
                    <button class="btn" id="cancelBtn" onclick="cancelSelected()" disabled>취소</button>
                </div>
            </div>

            <div class="table-scroll">
                <table id="tbl">
                    <thead id="thead"></thead>
                    <tbody id="tbody"><tr class="state-row"><td colspan="14">데이터를 불러오는 중…</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 발주서 선택 슬라이드 -->
    <div class="side-back" id="sideBack" onclick="closeOrderPanel()"></div>
    <div class="side-panel" id="sidePanel">
        <div class="side-head">
            <span>출고준비 · 발주서 선택 <span class="sub" id="sideCount"></span></span>
            <button class="x" onclick="closeOrderPanel()">✕</button>
        </div>
        <div class="side-tools">
            <label><input type="checkbox" id="selectAllOrders" checked onchange="toggleAllOrders(this)"> 전체선택</label>
            <span class="sub" id="selInfo" style="font-size:12px;color:#94a3b8;"></span>
        </div>
        <div class="side-list" id="sideList"></div>
        <div class="side-foot">
            <button class="btn" onclick="closeOrderPanel()">취소</button>
            <button class="btn primary" onclick="runPrepare()">출고준비 실행</button>
        </div>
    </div>

    <!-- 정렬 모달 -->
    <div class="modal-back" id="sortBack" onclick="if(event.target===this)closeSortModal()">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sortTitle">
            <div class="modal-head"><span id="sortTitle">정렬</span><button class="x" onclick="closeSortModal()" aria-label="닫기">✕</button></div>
            <div class="modal-desc">1순위부터 차례로 정렬합니다. 값이 같으면 다음 순위로, 모든 순위가 같으면 기본 순서(회차 › 출고예정일 › 센터 › 출고번호)를 따릅니다. 빈 값은 항상 맨 아래에 둡니다.</div>
            <div class="sort-rows" id="sortRows"></div>
            <button class="add-rule" id="addRuleBtn" onclick="addSortRule()">+ 순위 추가</button>
            <div class="modal-foot">
                <button class="btn" onclick="resetSort()">기본 정렬로</button>
                <div class="right">
                    <button class="btn" onclick="closeSortModal()">취소</button>
                    <button class="btn primary" onclick="applySort()">적용</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 박스라벨출력 — 체크한 행의 발주서마다 출고 박스 라벨 (label-service 임베드 → QZ Tray). 쉽먼트 페이지와 같은 흐름 -->
    <div class="label-back" id="labelBack" onclick="if(event.target.id==='labelBack')closeLabelPrint()">
        <div class="label-modal">
            <div class="label-head">
                <h3>박스 라벨출력<span class="sub" id="labelPrintSub"></span></h3>
                <button onclick="closeLabelPrint()">✕</button>
            </div>
            <!-- 기본 = 이미 뽑힌 박스(실제 스캔·가상확정)는 빼고 아직 미확정인 가상 박스만. 풀면 전부 (2026-10-15) -->
            <div class="label-opts"><label><input type="checkbox" id="labelSkipPrinted" checked onchange="reloadBoxLabels()"> 이미 뽑힌 박스 라벨 제외 <small>실제 스캔됐거나 가상확정(모바일로 다 찾음)된 박스는 빼고 뽑습니다 · 풀면 전부</small></label></div>
            <!-- allow: 임베드(다른 origin)가 이 PC 의 QZ Tray(wss://localhost)에 붙으려면 크롬 로컬 네트워크 접근(LNA) 권한을
                 부모 페이지가 위임해야 한다. src 를 넣기 전부터 이 속성이 있어야 한다 (iframe 이동 시 적용). -->
            <iframe id="labelPrintFrame" title="박스 라벨 출력"
                    allow="loopback-network; local-network; local-network-access"></iframe>
            <div class="label-status" id="labelPrintStatus"></div>
        </div>
    </div>

    <!-- 일괄 가상스캔 — 옵션(기존 박스 · 대상 · 입고코드 고정) → 발주서별 예상 표 → [확정] → 결과. 계산·반영은 서버 /api/ship-scan/virtual-batch -->
    <div class="modal-back" id="vbBack" onclick="if(event.target===this)closeVirtualBatch()">
        <div class="modal vb-modal">
            <div class="modal-head"><span>가상스캔 · 일괄 <span class="vb-sub" id="vbSub"></span></span><button class="x" onclick="closeVirtualBatch()" aria-label="닫기">✕</button></div>
            <div class="vb-opts" id="vbOpts"></div>
            <div class="vb-body" id="vbBody"></div>
            <div class="modal-foot">
                <span class="vb-note" id="vbNote"></span>
                <div class="right">
                    <button class="btn" id="vbCancelBtn" onclick="closeVirtualBatch()">취소</button>
                    <button class="btn primary" id="vbConfirmBtn" onclick="confirmVirtualBatch()" disabled>확정 · 박스 반영 + 저장</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        fetch('/header').then(r=>r.text()).then(h=>{document.getElementById('header-container').innerHTML=h;}).catch(()=>{});

        let allItems=[], shipments=[], orders=[];
        let shippingRows=[], stockRows=[], prepared=false, activeTab='shipping';
        let selectedOrders=new Set();
        const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        // 상품명: 첫 콤마 앞 단어가 영어+숫자 조합(모델코드)이면 연한 파란 배지
        function modelBadge(name){
            const s=String(name==null?'':name); const ci=s.indexOf(',');
            if(ci>0){ const prefix=s.slice(0,ci), rest=s.slice(ci); const m=prefix.match(/(\S+)(\s*)$/);
                if(m){ const t=m[1];
                    if(/^[A-Za-z0-9]+$/.test(t)&&/[A-Za-z]/.test(t)&&/\d/.test(t)){
                        const before=prefix.slice(0, prefix.length-m[0].length);
                        return esc(before)+'<span class="name-badge">'+esc(t)+'</span>'+esc(m[2])+esc(rest); } } }
            return esc(s);
        }
        const dashCell=v=>(v==null||v===''||v==='-')?'<span class="dash">-</span>':esc(v);

        async function loadData(){
            try{
                const [shipRes,ordRes]=await Promise.all([fetch('/api/inbound/shipments'), fetch('/api/orders')]);
                shipments=await shipRes.json();
                orders=await ordRes.json();
                selectedOrders=new Set(orders.map(o=>o.발주번호)); // 전체선택 기본
                populateYear();
                if(shipments[0]) selectShipment(shipments[0]);   // 처음에는 가장 최근 출고코드를 기본으로 (목록은 created_at 내림차순)
                await loadArranged();
            }catch(e){
                document.getElementById('tbody').innerHTML=`<tr class="state-row"><td colspan="14">데이터를 불러오지 못했습니다: ${esc(e.message||e)}</td></tr>`;
            }
        }

        // ── 연/월/출고코드 드롭박스 ──
        function shipDate(s){ return new Date(s.createdAt); }
        function populateYear(){
            const years=[...new Set(shipments.map(s=>shipDate(s).getFullYear()))].sort((a,b)=>b-a);
            document.getElementById('yearSel').innerHTML='<option value="">연도</option>'+years.map(y=>`<option value="${y}">${y}년</option>`).join('');
            fillMonths(''); fillCodes('','');
        }
        function fillMonths(y){
            const months=y?[...new Set(shipments.filter(s=>String(shipDate(s).getFullYear())===String(y)).map(s=>shipDate(s).getMonth()+1))].sort((a,b)=>a-b):[];
            document.getElementById('monthSel').innerHTML='<option value="">월</option>'+months.map(m=>`<option value="${m}">${m}월</option>`).join('');
        }
        function fillCodes(y,m){
            const list=(y&&m)?shipments.filter(s=>{const d=shipDate(s);return String(d.getFullYear())===String(y)&&String(d.getMonth()+1)===String(m);}):[];
            // 화면 명칭은 "입고코드" (입고된 건이라 '출고코드' 라고 하면 헷갈림, 2026-10-15). 데이터 필드명(출고코드/shipmentCode)은 그대로
            document.getElementById('codeSel').innerHTML='<option value="">입고코드 선택</option>'+list.map(s=>`<option value="${esc(s.shipmentCode)}">${esc(s.shipmentCode)} (${s.itemCount})</option>`).join('');
        }
        // 드롭박스를 특정 출고코드(연/월/코드)로 맞춘다 — 불러오지는 않음
        function selectShipment(s){
            const d=shipDate(s), y=String(d.getFullYear()), m=String(d.getMonth()+1);
            document.getElementById('yearSel').value=y; fillMonths(y);
            document.getElementById('monthSel').value=m; fillCodes(y,m);
            document.getElementById('codeSel').value=s.shipmentCode;
        }
        function onYearChange(){ fillMonths(document.getElementById('yearSel').value); fillCodes('',''); loadArranged(); }
        function onMonthChange(){ fillCodes(document.getElementById('yearSel').value, document.getElementById('monthSel').value); loadArranged(); }
        function onCodeChange(){ loadArranged(); }
        function selectedCode(){ return document.getElementById('codeSel').value; }

        // 저장된 출고배정 로드 (출고리스트=저장분, 남은상품=아이템수량-배정합계)
        //   + 출고스캔 박스 맵 (발주번호|바코드 → 박스들) — 가상으로 잡힌 박스를 '박스' 열에 보여준다
        let arrangeReq=0;
        let boxMap={};
        async function loadArranged(){
            const code=selectedCode();
            const my=++arrangeReq;
            // 출고코드를 선택하지 않으면 아무것도 표시하지 않음
            if(!code){ shippingRows=[]; stockRows=[]; prepared=false; render(); return; }
            try{
                const res=await fetch('/api/inbound/arranged'+(code?('?shipmentCode='+encodeURIComponent(code)):''));
                const data=await res.json();
                if(my!==arrangeReq) return; // 더 최신 요청이 있으면 무시 (레이스 방지)
                if(!res.ok) throw new Error(data.error||'조회 실패');
                shippingRows=data.shipping||[];
                stockRows=data.stock||[];
                prepared=shippingRows.length>0;
                // 박스 열 — 이 입고코드에 있는 발주서들의 박스를 처리완료 여부와 상관없이 (쉽먼트 접수로 처리완료된 발주서의 가상 박스도 보여야 한다, 2026-10-15)
                const nos=[...new Set(shippingRows.map(r=>r.출고번호).filter(Boolean))];
                const bmRes=nos.length?await fetch('/api/ship-scan/box-map?orders='+encodeURIComponent(nos.join(','))).catch(()=>null):null;
                if(my!==arrangeReq) return;
                boxMap=(bmRes&&bmRes.ok)?await bmRes.json():{};   // 실패해도 박스 열만 비는 것으로
                render();
            }catch(e){ if(my===arrangeReq) toast('조회 실패: '+e.message); }
        }
        // 박스 열: 그 출고번호(=발주번호)+바코드가 가상으로 잡힌 박스만 (가상 없는 박스는 표시 안 함 → 기존 방식 그대로 비어 있음)
        function boxCell(r){
            const list=boxMap[`${r.출고번호}|${r.바코드}`]||[];
            const html=list.filter(b=>b.virtualQty>0).map(b=>{
                const st=b.confirmed?'virtual-ok':(b.virtualQty>=b.qty?'virtual-all':'virtual-part');   // ✅ 가상확정(다 찾아옴) · 👾 전부 가상 · 🔀 섞임
                return `<span class="vbox ${st}" title="박스 ${b.boxNo} ${esc(b.boxSize||'')} · ${b.confirmed?'가상확정 · ':''}가상 ${b.virtualQty} / 전체 ${b.qty}">📦${b.boxNo} ${st==='virtual-ok'?'✅':st==='virtual-all'?'👾':'🔀'}</span>`;
            }).join('');
            return html||'';
        }

        // 모바일 입고 표시 — 이모지만, 처리자·시각은 title(마우스 올리면)
        function mobileCell(r){
            if(!r.모바일) return '';
            const who=r.모바일처리자?esc(r.모바일처리자):'', at=r.모바일시각?new Date(r.모바일시각).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
            const tip=(r.모바일==='found'?'모바일 찾음':'모바일 없음')+(who?' · '+who:'')+(at?' · '+at:'');
            return `<span title="${tip}" style="cursor:default">${r.모바일==='found'?'✅':'❌'}</span>`;
        }

        function switchTab(t){
            activeTab=t;
            document.getElementById('tab-shipping').classList.toggle('active',t==='shipping');
            document.getElementById('tab-stock').classList.toggle('active',t==='stock');
            render();
        }

        // 출고준비 버튼: 남은상품 탭 + 출고코드 선택 시에만 활성화
        function updateActionButtons(){
            const on = activeTab==='stock' && !!selectedCode();
            document.getElementById('prepareBtn').disabled = !on;
        }

        function maxBatch(){ return shippingRows.reduce((m,r)=>Math.max(m,r.회차||0),0); }

        function render(){
            document.getElementById('cnt-shipping').textContent=shippingRows.length;
            document.getElementById('cnt-stock').textContent=stockRows.length;
            updateBatchOptions();
            const terms=document.getElementById('searchInput').value.toLowerCase().split(',').map(t=>t.trim()).filter(Boolean);
            let rowsAll=activeTab==='shipping'?shippingRows:stockRows;
            // 회차 필터 (출고리스트에만 적용)
            if(activeTab==='shipping' && batchFilter!=='all'){
                rowsAll=rowsAll.filter(r=>String(r.회차)===String(batchFilter));
            }
            let rows=terms.length===0?rowsAll:rowsAll.filter(r=>{
                const hay=[r.출고코드,r.박스명,r.중국번호,r.상품명,r.바코드,r.출고번호].map(v=>String(v||'').toLowerCase());
                return terms.some(t=>hay.some(h=>h.includes(t)));
            });
            // 기본 정렬: 회차 > 출고예정일 > 센터 > 발주서번호(출고번호)  ※ 위치는 이 화면에 데이터 없음
            // [정렬] 모달에서 순위를 지정하면 그 순서로 먼저 비교하고, 모두 같을 때만 기본 정렬을 따른다.
            const defCmp=(a,b)=>
                (Number(a.회차)||0)-(Number(b.회차)||0)
                || sortText(a.출고예정일,b.출고예정일)
                || sortText(a.센터,b.센터)
                || sortText(a.출고번호,b.출고번호);
            rows=rows.slice().sort((a,b)=>{
                for(const r of sortRules){ const c=ruleCmp(r,a,b); if(c) return c; }
                return defCmp(a,b);
            });
            const mb=maxBatch();
            const nBatches=new Set(shippingRows.map(r=>r.회차).filter(v=>v!=null)).size;
            const thead=document.getElementById('thead'), tb=document.getElementById('tbody');
            // 헤더에 정렬 순위 표시 (예: 출고예정일 1↑)
            const ind=k=>{ const i=sortRules.findIndex(r=>r.k===k); return i<0?'':`<span class="sort-ind">${i+1}${sortRules[i].dir>0?'↑':'↓'}</span>`; };
            thead.innerHTML=`<tr><th class="chk"><input type="checkbox" id="checkAll" onchange="toggleAllRows(this)"></th><th style="width:88px">회차${ind('회차')}</th><th>입고코드${ind('출고코드')}</th><th>박스명${ind('박스명')}</th><th>중국번호${ind('중국번호')}</th><th>상품명${ind('상품명')}</th><th class="ctr">수량${ind('수량')}</th><th>바코드${ind('바코드')}</th><th>출고번호${ind('출고번호')}</th><th style="width:96px">박스</th><th>센터${ind('센터')}</th><th class="ctr">출고개수${ind('출고개수')}</th><th>출고예정일${ind('출고예정일')}</th><th class="ctr" style="width:58px" title="모바일 입고 — ✅ 찾음 · ❌ 없음 (마우스를 올리면 처리자)">모바일</th></tr>`;
            if(rows.length===0){
                let msg;
                if(!selectedCode()) msg='연도 · 월 · 입고코드를 선택하세요.';
                else if(activeTab==='shipping') msg=prepared?'출고 배정된 항목이 없습니다.':'‘출고준비’ 버튼으로 발주서를 선택해 정리하세요.';
                else msg='남은상품이 없습니다.';
                tb.innerHTML=`<tr class="state-row"><td colspan="14">${msg}</td></tr>`;
            }else{
                tb.innerHTML=rows.map((r,idx)=>{
                    // 출고번호 그룹 끝(마지막 행 또는 다음 행의 출고번호가 다름) → 인쇄 시 굵은 구분선
                    const ge=idx===rows.length-1 || String(rows[idx+1].출고번호||'')!==String(r.출고번호||'');
                    const isShip=r.회차!=null;
                    const latest=isShip && r.회차===mb && nBatches>1; // 회차 2개 이상일 때만 최신 강조
                    const batchCell=isShip
                        ? `<span class="batch ${latest?'latest':''}">${r.회차}회차</span>${latest?'<span class="newtag">NEW</span>':''}`
                        : '<span class="dash">-</span>';
                    return `<tr class="${latest?'latest':''} ${ge?'ge':''}">
                        <td class="chk">${r.allocId!=null?`<input type="checkbox" class="rowchk" data-allocid="${esc(r.allocId)}" onchange="updateCancelBtn()">`:''}</td>
                        <td class="ctr">${batchCell}</td>
                        <td class="code">${esc(r.출고코드)}</td><td>${esc(r.박스명)}</td><td>${esc(r.중국번호)}</td>
                        <td class="pname">${modelBadge(r.상품명)}</td><td class="ctr">${dashCell(r.수량)}</td><td>${esc(r.바코드)}</td>
                        <td class="ord">${dashCell(r.출고번호)}</td><td>${boxCell(r)}</td><td>${dashCell(r.센터)}</td><td class="ctr">${dashCell(r.출고개수)}</td><td>${dashCell(r.출고예정일)}</td><td class="ctr">${mobileCell(r)}</td>
                    </tr>`;
                }).join('');
            }
            document.getElementById('rowCount').textContent=rows.length;
            updateActionButtons();
            updateCancelBtn();
        }

        // ── 출고배정 취소 (체크된 행 삭제 → 남은상품으로 자동 복원) ──
        function toggleAllRows(chk){
            document.querySelectorAll('.rowchk').forEach(c=>{c.checked=chk.checked;});
            updateCancelBtn();
        }
        function updateCancelBtn(){
            const n=document.querySelectorAll('.rowchk:checked').length;
            const b=document.getElementById('cancelBtn');
            if(b) b.disabled=n===0;
        }
        async function cancelSelected(){
            const ids=[...document.querySelectorAll('.rowchk:checked')].map(c=>c.dataset.allocid);
            if(!ids.length){ toast('선택된 항목이 없습니다.'); return; }
            if(!confirm(`선택한 ${ids.length}건의 출고배정을 취소하시겠습니까?\n취소된 수량은 남은상품으로 돌아갑니다.`)) return;
            try{
                const res=await fetch('/api/inbound/shipping/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({allocIds:ids})});
                const data=await res.json().catch(()=>({}));
                if(!res.ok) throw new Error(data.error||'취소 실패');
                toast(`출고배정 ${data.deleted??ids.length}건 취소 완료`);
                await loadArranged();
            }catch(e){ toast('취소 실패: '+e.message); }
        }

        // ── 정렬 (순위별 다중 정렬) ──
        // 페이지를 열면 항상 기본 정렬. 지정한 순위는 이 화면에 머무는 동안만 유지한다(저장 안 함).
        const SORT_COLS=[
            {k:'회차',num:true},{k:'출고코드'},{k:'박스명'},{k:'중국번호'},{k:'상품명'},{k:'수량',num:true},
            {k:'바코드'},{k:'출고번호'},{k:'센터'},{k:'출고개수',num:true},{k:'출고예정일'}];
        const SORT_NUM=new Set(SORT_COLS.filter(c=>c.num).map(c=>c.k));
        const COL_LABEL={'출고코드':'입고코드'};   // 화면 표시 이름 (데이터 키는 그대로)
        let sortRules=[];   // 적용된 순위 [{k, dir:1(오름)|-1(내림)}]
        let sortDraft=[];   // 모달에서 편집 중인 순위 (적용 전)

        function sortText(x,y){ return String(x==null?'':x).localeCompare(String(y==null?'':y),'ko',{numeric:true}); }
        const isBlank=v=>v==null||v===''||v==='-';
        // 한 순위 비교: 빈 값은 방향과 상관없이 항상 뒤로
        function ruleCmp(r,a,b){
            const va=a[r.k], vb=b[r.k], ea=isBlank(va), eb=isBlank(vb);
            if(ea||eb) return ea===eb?0:(ea?1:-1);
            const c=SORT_NUM.has(r.k)?((Number(va)||0)-(Number(vb)||0)):sortText(va,vb);
            return c*r.dir;
        }

        function updateSortBtn(){
            const b=document.getElementById('sortBtn'), n=sortRules.length;
            b.classList.toggle('sort-on',n>0);
            b.innerHTML=n?`정렬 <span class="sort-cnt">${n}</span>`:'정렬';
            b.title=n?sortRules.map((r,i)=>`${i+1}순위 ${COL_LABEL[r.k]||r.k} ${r.dir>0?'오름차순':'내림차순'}`).join('\n'):'순위별 정렬';
        }
        function openSortModal(){
            sortDraft=sortRules.length?sortRules.map(r=>({...r})):[{k:'',dir:1}];
            renderSortModal();
            document.getElementById('sortBack').classList.add('show');
        }
        function closeSortModal(){ document.getElementById('sortBack').classList.remove('show'); }
        function renderSortModal(){
            const n=sortDraft.length;
            document.getElementById('sortRows').innerHTML=sortDraft.map((r,i)=>{
                // 다른 순위에서 이미 고른 항목은 선택지에서 뺀다 (중복 방지)
                const used=new Set(sortDraft.filter((_,j)=>j!==i).map(x=>x.k).filter(Boolean));
                const opts=SORT_COLS.filter(c=>!used.has(c.k))
                    .map(c=>`<option value="${esc(c.k)}" ${c.k===r.k?'selected':''}>${esc(COL_LABEL[c.k]||c.k)}</option>`).join('');
                return `<div class="sort-row">
                    <span class="sort-rank">${i+1}순위</span>
                    <select onchange="setSortKey(${i},this.value)" aria-label="${i+1}순위 항목"><option value="">항목 선택</option>${opts}</select>
                    <span class="dir">
                        <button type="button" class="${r.dir>0?'on':''}" onclick="setSortDir(${i},1)">오름차순</button>
                        <button type="button" class="${r.dir<0?'on':''}" onclick="setSortDir(${i},-1)">내림차순</button>
                    </span>
                    <button type="button" class="icon-btn" onclick="moveSortRule(${i},-1)" ${i===0?'disabled':''} title="위로" aria-label="위로">▲</button>
                    <button type="button" class="icon-btn" onclick="moveSortRule(${i},1)" ${i===n-1?'disabled':''} title="아래로" aria-label="아래로">▼</button>
                    <button type="button" class="icon-btn" onclick="removeSortRule(${i})" title="삭제" aria-label="삭제">✕</button>
                </div>`;
            }).join('') || '<div class="modal-desc" style="padding:6px 0">순위가 없습니다. 기본 정렬로 표시됩니다.</div>';
            document.getElementById('addRuleBtn').disabled=sortDraft.length>=SORT_COLS.length;
        }
        function setSortKey(i,k){ sortDraft[i].k=k; renderSortModal(); }
        function setSortDir(i,d){ sortDraft[i].dir=d; renderSortModal(); }
        function moveSortRule(i,d){
            const j=i+d; if(j<0||j>=sortDraft.length) return;
            [sortDraft[i],sortDraft[j]]=[sortDraft[j],sortDraft[i]]; renderSortModal();
        }
        function removeSortRule(i){ sortDraft.splice(i,1); renderSortModal(); }
        function addSortRule(){ if(sortDraft.length<SORT_COLS.length){ sortDraft.push({k:'',dir:1}); renderSortModal(); } }
        function applySort(){
            sortRules=sortDraft.filter(r=>r.k).map(r=>({k:r.k,dir:r.dir>0?1:-1}));
            closeSortModal(); updateSortBtn(); render();
        }
        function resetSort(){ sortRules=[]; closeSortModal(); updateSortBtn(); render(); }
        document.addEventListener('keydown',e=>{
            if(e.key==='Escape' && document.getElementById('sortBack').classList.contains('show')) closeSortModal();
        });

        let batchFilter='all';
        function onBatchFilter(){ batchFilter=document.getElementById('batchFilter').value; render(); }
        function updateBatchOptions(){
            const sel=document.getElementById('batchFilter');
            const batches=[...new Set(shippingRows.map(r=>r.회차).filter(v=>v!=null))].sort((a,b)=>a-b);
            const want=['all',...batches.map(String)];
            const cur=[...sel.options].map(o=>o.value);
            if(JSON.stringify(want)!==JSON.stringify(cur)){
                const keep=want.includes(batchFilter)?batchFilter:'all';
                sel.innerHTML='<option value="all">전체 회차</option>'+batches.map(b=>`<option value="${b}">${b}회차</option>`).join('');
                sel.value=keep; batchFilter=keep;
            }
        }

        // ── 발주서 선택 슬라이드 (rocket 전체보기 스타일 + 체크박스) ──
        function uniqueOrders(){
            const m=new Map();
            for(const o of orders){
                if(!m.has(o.발주번호)) m.set(o.발주번호,{발주번호:o.발주번호,물류센터:o.물류센터,입고예정일:o.입고예정일,count:(o.상품정보||[]).length});
            }
            return [...m.values()];
        }
        function renderOrderPanel(){
            const uniq=uniqueOrders();
            document.getElementById('sideCount').textContent=`${uniq.length}건`;
            const byDate=new Map();
            for(const o of uniq){ const d=o.입고예정일||'(미정)'; if(!byDate.has(d))byDate.set(d,[]); byDate.get(d).push(o); }
            let html='';
            for(const [date,list] of byDate){
                const dateAllSel=list.length>0&&list.every(o=>selectedOrders.has(o.발주번호));
                html+=`<div class="side-date ${dateAllSel?'sel':''}" onclick="toggleDate('${esc(date)}')">${esc(date)}</div>`;
                const byCenter=new Map();
                for(const o of list){ const c=o.물류센터||'(미정)'; if(!byCenter.has(c))byCenter.set(c,[]); byCenter.get(c).push(o); }
                for(const [,corders] of byCenter){
                    html+=`<div class="side-orders">`;
                    html+=corders.map(o=>{
                        const sel=selectedOrders.has(o.발주번호);
                        return `<div class="side-order ${sel?'sel':''}" onclick="toggleOrder('${esc(o.발주번호)}')">
                            <input type="checkbox" ${sel?'checked':''} onclick="event.stopPropagation();toggleOrder('${esc(o.발주번호)}')">
                            <div class="so-body"><div class="so-no">${esc(o.발주번호)} <span class="so-cnt">(${o.count})</span></div>
                            <div class="so-center">${esc(o.물류센터)}</div></div></div>`;
                    }).join('');
                    html+=`</div>`;
                }
            }
            document.getElementById('sideList').innerHTML=html;
            updateSelInfo();
        }
        function updateSelInfo(){
            document.getElementById('selInfo').textContent=`${selectedOrders.size}개 선택`;
            document.getElementById('selectAllOrders').checked=selectedOrders.size===uniqueOrders().length && uniqueOrders().length>0;
        }
        function toggleOrder(no){
            if(selectedOrders.has(no)) selectedOrders.delete(no); else selectedOrders.add(no);
            renderOrderPanel();
        }
        function ordersOfDate(date){
            return uniqueOrders().filter(o=>(o.입고예정일||'(미정)')===date).map(o=>o.발주번호);
        }
        function toggleDate(date){
            const nos=ordersOfDate(date);
            const allSel=nos.length>0&&nos.every(n=>selectedOrders.has(n));
            if(allSel) nos.forEach(n=>selectedOrders.delete(n));
            else nos.forEach(n=>selectedOrders.add(n));
            renderOrderPanel();
        }
        function toggleAllOrders(el){
            if(el.checked) selectedOrders=new Set(uniqueOrders().map(o=>o.발주번호));
            else selectedOrders=new Set();
            renderOrderPanel();
        }
        function openOrderPanel(){
            renderOrderPanel();
            document.getElementById('sideBack').classList.add('show');
            document.getElementById('sidePanel').classList.add('show');
        }
        function closeOrderPanel(){
            document.getElementById('sideBack').classList.remove('show');
            document.getElementById('sidePanel').classList.remove('show');
        }

        // ── 출고준비 실행 (선택 발주서 기준 할당) ──
        async function runPrepare(){
            if(selectedOrders.size===0){toast('발주서를 하나 이상 선택하세요.');return;}
            closeOrderPanel();
            toast('출고준비 계산 중…');
            try{
                const res=await fetch('/api/inbound/prepare',{method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({shipmentCode:selectedCode()||undefined, orderNumbers:[...selectedOrders]})});
                const data=await res.json();
                if(!res.ok)throw new Error(data.error||'출고준비 실패');
                shippingRows=data.shipping||[];
                stockRows=data.stock||[];
                prepared=true;
                batchFilter='all'; // 새 회차가 항상 보이도록 필터 초기화
                activeTab='shipping';
                switchTab('shipping');
                const msg = data.saved>0 ? `출고준비 완료 · ${data.batch}회차 신규 ${data.saved}건 (출고 ${shippingRows.length} · 남은상품 ${stockRows.length})`
                    : `추가 배정할 항목이 없습니다 (출고 ${shippingRows.length} · 남은상품 ${stockRows.length})`;
                toast(msg);
            }catch(e){toast('출고준비 실패: '+e.message);}
        }

        // ============================================================
        // 박스라벨출력 — 박스 라벨 (label-service 임베드). 쉽먼트(/shipment)·발주서 관리(/rocket)의 [박스라벨출력] 과 같은 흐름
        //   체크한 행의 출고번호(=발주번호)를 표에 보이는 순서(= [인쇄] 순서)대로 모아 → POST /api/label/order-boxes
        //   → 발주서마다 출고스캔 박스(rk_ship_boxes) 1장씩, 그 순서 그대로 임베드에 넘긴다 (labelType:'box').
        //   같은 발주서 상품 행을 여러 개 체크해도 발주서 1건. 출고스캔 전이라 박스가 없는 발주서는 제외(토스트 안내).
        //   템플릿별 프린터 지정값은 이 사이트가 기억한다 (localStorage — 다른 페이지 라벨출력과 같은 키라 PC 마다 한 번만 지정).
        // ============================================================
        let labelCfg=null, labelOrigin=null, labelPending=null;
        const LABEL_PRINTER_KEY='label_printer_map_v1';
        const labelDebug=new URLSearchParams(location.search).get('labeldebug')==='1';
        function loadLabelPrinterMap(){ try{ const j=JSON.parse(localStorage.getItem(LABEL_PRINTER_KEY)||'{}'); return j&&typeof j==='object'&&!Array.isArray(j)?j:{}; }catch(_){ return {}; } }
        function saveLabelPrinterMap(map){ try{ localStorage.setItem(LABEL_PRINTER_KEY, JSON.stringify(map||{})); }catch(_){ /* 저장 불가 시 무시 */ } }
        async function getLabelCfg(){
            if(labelCfg) return labelCfg;
            const res=await fetch('/api/label/config');
            const j=await res.json();
            if(!res.ok) throw new Error(j.error||'라벨 서비스 설정을 불러오지 못했습니다.');
            labelCfg=j; labelOrigin=new URL(j.url).origin;
            return j;
        }
        function sendLabelPending(){
            const frame=document.getElementById('labelPrintFrame');
            if(!labelPending||!frame.contentWindow||frame.dataset.ready!=='1') return;
            frame.contentWindow.postMessage(labelPending, labelOrigin);
            labelPending=null;
        }
        // 체크된 행의 출고번호 — 표 위→아래 순서, 중복 제거 (체크박스는 출고리스트 행에만 있다)
        function checkedOrderNumbers(){
            const out=[];
            document.querySelectorAll('#tbody tr').forEach(tr=>{
                const c=tr.querySelector('.rowchk'); if(!c||!c.checked) return;
                const no=String((tr.querySelector('td.ord')||{}).textContent||'').trim();
                if(no&&no!=='-'&&!out.includes(no)) out.push(no);
            });
            return out;
        }
        let boxLabelOrders=[];   // 모달에 띄운 발주번호 — 체크박스를 바꾸면 같은 발주서로 다시 조회
        function reloadBoxLabels(){ if(boxLabelOrders.length) loadBoxLabels(); }
        async function openBoxLabelPrint(){
            const orderNumbers=checkedOrderNumbers();
            if(!orderNumbers.length){ toast('박스 라벨을 출력할 행(출고리스트)을 선택해주세요.'); return; }
            boxLabelOrders=orderNumbers;
            await loadBoxLabels();
        }
        async function loadBoxLabels(){
            const orderNumbers=boxLabelOrders;
            const btn=document.getElementById('boxLabelPrintBtn'); btn.disabled=true;
            try{
                const cfg=await getLabelCfg();
                const skipPrinted=document.getElementById('labelSkipPrinted').checked;
                const res=await fetch('/api/label/order-boxes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderNumbers, skipPrinted})});
                const j=await res.json();
                if(!res.ok) throw new Error(j.error||'박스 데이터 조회 실패');
                const skippedN=(j.skipped||[]).length, allPrintedN=(j.allPrinted||[]).length;
                if(!j.items.length && !skippedN){ toast('선택한 발주번호를 발주서에서 찾지 못했습니다.'); return; }
                if(j.noBox.length) toast(`출고스캔 전 발주서 ${j.noBox.length}건은 박스 정보 없이(박스 1/1) 발주번호 라벨 1장만 나갑니다.\n${j.noBox.join(', ')}`);
                else if(skippedN) toast(`이미 뽑힌 박스 ${skippedN}개(실제 스캔·가상확정)는 제외했습니다.${allPrintedN?` 발주서 ${allPrintedN}건은 전부 제외.`:''}`);

                labelPending={
                    type:'label-print:print',
                    requestId:String(Date.now()),
                    source:cfg.source,
                    userId:cfg.userId,
                    labelType:'box',
                    autoPrint:false,
                    printerMap:loadLabelPrinterMap(),   // 이 PC 에서 기억해 둔 템플릿별 프린터
                    items:j.items
                };
                document.getElementById('labelPrintSub').textContent=`박스 ${j.items.length}개 · 발주서 ${j.orderCount}건${skippedN?` · 제외 ${skippedN}`:''}`;
                document.getElementById('labelPrintStatus').textContent=(!j.items.length&&skippedN)?`선택한 발주서의 박스 라벨은 모두 이미 뽑힌 것으로 봅니다 (${skippedN}박스). 전부 뽑으려면 위 체크를 푸세요.`:'';
                document.getElementById('labelBack').classList.add('show');

                const frame=document.getElementById('labelPrintFrame');
                if(frame.dataset.ready==='1') sendLabelPending();                                   // 이미 로드된 iframe 재사용
                else frame.src=cfg.url+'/print-embed'+(labelDebug?'?debug=1':'');                  // 로드되면 'label-print:ready' 가 온다
            }catch(e){ toast('박스 라벨 출력 준비 실패: '+e.message); }
            finally{ btn.disabled=false; }
        }
        function closeLabelPrint(){ document.getElementById('labelBack').classList.remove('show'); labelPending=null; }
        // 임베드 → 이 창: 준비 완료 / 프린터 지정 변경 / 인쇄 결과
        window.addEventListener('message',function(e){
            if(!labelOrigin||e.origin!==labelOrigin) return;
            const d=e.data||{};
            if(d.type==='label-print:ready'){ document.getElementById('labelPrintFrame').dataset.ready='1'; sendLabelPending(); }
            else if(d.type==='label-print:printer-map'){ if(d.map&&typeof d.map==='object'&&!Array.isArray(d.map)) saveLabelPrinterMap(d.map); }
            else if(d.type==='label-print:result'){
                document.getElementById('labelPrintStatus').textContent=d.ok?`✓ 박스 라벨 ${d.printed}장 전송됨`:'✕ 박스 라벨 실패';   // 상세 사유는 임베드가 alert 로 띄운다
            }
        });
        document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeLabelPrint(); closeVirtualBatch(); } });

        // ============================================================
        // 가상스캔 · 일괄 — 체크한 행의 출고번호(=발주번호)마다 출고스캔의 [가상스캔]을 같은 옵션으로 돌린다
        //   옵션: 기존 박스(채우기/새 박스만 — 매번 직접 고름) · 대상(전체/입고/재고 — 이 화면은 입고 작업이라 '입고' 기본)
        //         · 입고코드 = 위 드롭박스에서 고른 코드 하나로 고정 (다른 코드의 입고분은 서버가 '다른 입고코드' 로 제외)
        //   흐름: 옵션을 다 고르면 서버에 미리보기(confirm:false, 읽기만) → 발주서별 표 → [확정](confirm:true) → 결과 → 박스 열 갱신
        //   확정은 서버가 그 시점 DB 로 계획을 다시 계산해 저장한다. 같은 발주서를 또 돌려도 남은 목표가 0 이라 더해지지 않는다.
        // ============================================================
        let vbOrders=[], vbCode='', vbTopUp=null, vbTarget='입고', vbPreview=null, vbReq=0, vbBusy=false, vbDone=false, vbOff=new Set();
        function openVirtualBatch(){
            const orders=checkedOrderNumbers();
            if(!orders.length){ toast('가상스캔할 행(출고리스트)을 선택해주세요.'); return; }
            const code=selectedCode();
            if(!code){ toast('입고코드를 선택하세요.'); return; }
            vbOrders=orders; vbCode=code; vbTopUp=null; vbTarget='입고'; vbPreview=null; vbBusy=false; vbDone=false; vbOff=new Set(); vbReq++;
            document.getElementById('vbSub').textContent=`발주서 ${orders.length}건 · 입고코드 ${code}`;
            const cancel=document.getElementById('vbCancelBtn'); cancel.textContent='취소'; cancel.disabled=false;
            renderVbOpts(); renderVbBody();
            document.getElementById('vbBack').classList.add('show');
        }
        function closeVirtualBatch(){
            if(vbBusy) return;   // 확정 처리 중에는 닫지 않는다
            document.getElementById('vbBack').classList.remove('show'); vbReq++; vbPreview=null;
        }
        function setVbTopUp(on){ if(vbBusy||vbDone) return; vbTopUp=!!on; renderVbOpts(); runVbPreview(); }
        function setVbTarget(t){ if(vbBusy||vbDone) return; vbTarget=t; renderVbOpts(); runVbPreview(); }
        function vbReady(){ return vbTopUp!=null && !!vbTarget; }
        function renderVbOpts(){
            const dis=(vbBusy||vbDone)?'disabled':'';
            document.getElementById('vbOpts').innerHTML=`
                <div class="vb-opt">
                    <span class="lbl">기존 박스</span>
                    <div class="vb-seg">
                        <button type="button" class="${vbTopUp===true?'on':''}" ${dis} onclick="setVbTopUp(true)">기존 박스 채우기</button>
                        <button type="button" class="${vbTopUp===false?'on':''}" ${dis} onclick="setVbTopUp(false)">새 박스만</button>
                    </div>
                    <span class="hint">${vbTopUp==null?'<b class="need">선택하세요</b> · 박스가 없는 발주서는 어느 쪽이든 새 박스'
                        :vbTopUp?'발주서마다 마지막 박스부터 채움 · 앞 박스는 마감 · 박스 없으면 새 박스':'기존 박스는 그대로 두고 새 박스에만 담음'}</span>
                </div>
                <div class="vb-opt">
                    <span class="lbl">대상</span>
                    <div class="vb-seg">
                        <button type="button" class="${vbTarget==='all'?'on':''}" ${dis} onclick="setVbTarget('all')">전체</button>
                        <button type="button" class="${vbTarget==='입고'?'on':''}" ${dis} onclick="setVbTarget('입고')">입고</button>
                        <button type="button" class="${vbTarget==='재고'?'on':''}" ${dis} onclick="setVbTarget('재고')">재고</button>
                    </div>
                    <span class="hint">${vbTarget==='all'?'입고분 먼저, 재고분은 새 박스':vbTarget==='입고'?'이 입고코드의 입고분만 (재고 제외)':'재고분만 (입고 제외)'}</span>
                </div>
                <div class="vb-opt">
                    <span class="lbl">입고코드</span>
                    <span class="code">${esc(vbCode)}</span>
                    <span class="hint">${vbTarget==='재고'?'재고만 담으므로 입고코드는 쓰지 않음':'위 드롭박스에서 고른 코드 · 다른 입고코드의 입고분은 제외 (그 코드로 다시 돌리세요)'}</span>
                </div>`;
        }
        async function runVbPreview(){
            if(!vbReady()){ vbPreview=null; renderVbBody(); return; }
            const my=++vbReq;
            vbPreview=null; renderVbBody('loading');
            try{
                const res=await fetch('/api/ship-scan/virtual-batch',{method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({orderNumbers:vbOrders, topUp:vbTopUp, target:vbTarget, inboundCode:vbCode, confirm:false})});
                const j=await res.json().catch(()=>({}));
                if(my!==vbReq) return;   // 그 사이 옵션이 바뀌었거나 닫힘
                if(!res.ok) throw new Error(j.error||'미리보기 실패');
                vbPreview=j; renderVbBody();
            }catch(e){ if(my===vbReq){ vbPreview=null; renderVbBody('error', e.message); } }
        }
        function toggleVbOrder(no){ if(vbBusy||vbDone) return; if(vbOff.has(no)) vbOff.delete(no); else vbOff.add(no); renderVbBody(); }
        function toggleVbAll(on){ if(vbBusy||vbDone) return; vbOff=new Set(); if(!on) for(const r of vbPreview.results) if(r.status==='ready') vbOff.add(r.orderNumber); renderVbBody(); }
        function vbPicked(){ return vbPreview?vbPreview.results.filter(r=>r.status==='ready'&&!vbOff.has(r.orderNumber)):[]; }
        const vbBoxChip=b=>`<span class="vb-bx ${b.isNew?'new':''} ${b.sizeFrom?'up':''}" title="${esc((b.warnings||[]).join(' · '))}">📦${b.boxNo} ${b.sizeFrom?esc(b.sizeFrom)+'→':''}${esc(b.size)}${b.isNew?'':' 기존'}${b.source?' · '+esc(b.source):''} <b>+${b.addQty}</b></span>`;
        function renderVbBody(state, msg){
            const body=document.getElementById('vbBody'), note=document.getElementById('vbNote'), btn=document.getElementById('vbConfirmBtn');
            note.className='vb-note';
            if(!vbPreview){
                body.innerHTML=`<div class="vb-msg">${state==='loading'?'발주서별 예상 박스를 계산하는 중…'
                    :state==='error'?'미리보기 실패: '+esc(msg)
                    :'위에서 <b>기존 박스</b>를 고르면 발주서별 예상 박스를 계산합니다.'}</div>`;
                note.textContent=state==='loading'?'':'아직 계산 전입니다.';
                btn.disabled=true; btn.textContent='확정 · 박스 반영 + 저장';
                return;
            }
            // 표는 반영 가능(또는 저장됨) → 오류 → 건너뜀 순으로 (같은 상태끼리는 체크한 행 순서 유지)
            const rank={ready:0,saved:0,error:1,skip:2};
            const rs=vbPreview.results.map((r,i)=>[r,i]).sort((a,b)=>((rank[a[0].status]??3)-(rank[b[0].status]??3))||(a[1]-b[1])).map(x=>x[0]);
            const stLabel={ready:'반영 가능',saved:'저장됨',skip:'건너뜀',error:'오류'};
            const exTxt=r=>{ const e=r.excluded||{}; const parts=[]; if(e.done) parts.push(`이미 완료 ${e.done}종`); if(e.none) parts.push(`배정 없음 ${e.none}종`); for(const [k,v] of Object.entries(e.other||{})) parts.push(`${k} ${v}종`); return parts.join(' · '); };
            const rows=rs.map(r=>{
                const on=r.status==='ready'&&!vbOff.has(r.orderNumber);
                const chk=vbDone?'':(r.status==='ready'?`<input type="checkbox" ${on?'checked':''} onchange="toggleVbOrder('${esc(r.orderNumber)}')">`:'');
                const tgt=r.status==='skip'||r.status==='error'?'<span class="dash">-</span>'
                    :`${r.qty}개 · ${r.skus}종${Object.keys(r.bySource||{}).length>1?` <small class="vb-why">(${Object.entries(r.bySource).map(([k,v])=>k+' '+v).join(' · ')})</small>`:''}`;
                const boxes=(r.boxes||[]).length?r.boxes.map(vbBoxChip).join(''):'<span class="dash">-</span>';
                const warn=(r.warnings||[]).length?`<span class="vb-warn" title="${esc(r.warnings.join('\n'))}">⚠ ${r.warnings.length}</span>`:'';
                const why=r.status==='skip'||r.status==='error'?`<span class="vb-why">${esc(r.reason||'')}</span>`
                    :r.status==='saved'?`<span class="vb-why">${r.saved.addQty}개 → 박스 ${r.saved.boxCnt}개${r.saved.upCnt?` · 크기 변경 ${r.saved.upCnt}`:''}</span>`
                    :`<span class="vb-why">${exTxt(r)}</span>`;
                return `<tr class="${r.status}${on||r.status==='saved'?'':' skip'}">
                    <td class="chk">${chk}</td>
                    <td class="ord">${esc(r.orderNumber)}<small>${esc([r.arrivalDate,r.center].filter(Boolean).join(' '))}</small></td>
                    <td><span class="vb-st ${r.status}">${stLabel[r.status]||r.status}</span>${warn}</td>
                    <td class="num">${tgt}</td>
                    <td>${boxes}</td>
                    <td>${why}</td>
                </tr>`;
            }).join('');
            const ready=rs.filter(r=>r.status==='ready').length, picked=vbPicked();
            const allOn=ready>0&&picked.length===ready;
            const sumQty=picked.reduce((s,r)=>s+r.qty,0), sumBox=picked.reduce((s,r)=>s+(r.boxes||[]).length,0), sumNew=picked.reduce((s,r)=>s+(r.newBoxes||0),0);
            const s=vbPreview.summary||{};
            const sum=vbDone
                ?`<div class="vb-sum"><span>저장 <b>${s.saved||0}</b>건</span><span>상품 <b>${s.qty||0}</b>개</span><span>박스 <b>${s.boxes||0}</b>개 (신규 ${s.newBoxes||0})</span><span>건너뜀 ${s.skipped||0} · 오류 ${s.errors||0}</span></div>`
                :`<div class="vb-sum"><span>반영 <b>${picked.length}</b> / ${rs.length}건</span><span>상품 <b>${sumQty}</b>개</span><span>박스 <b>${sumBox}</b>개 (신규 ${sumNew})</span><span>건너뜀 ${rs.length-ready}</span></div>`;
            body.innerHTML=sum+`<table class="vb-tbl"><thead><tr>
                <th class="chk">${vbDone||!ready?'':`<input type="checkbox" ${allOn?'checked':''} onchange="toggleVbAll(this.checked)" title="전체">`}</th>
                <th>발주서</th><th>상태</th><th>대상</th><th>예상 박스</th><th>비고</th></tr></thead><tbody>${rows}</tbody></table>`;
            if(vbDone){
                note.textContent=s.errors?'일부 발주서는 저장하지 못했습니다. 표의 오류 사유를 확인하세요.':'저장했습니다. 표의 박스 열에 가상 박스가 표시됩니다.';
                if(s.errors) note.className='vb-note err';
                btn.disabled=true; btn.textContent='저장 완료';
                return;
            }
            note.textContent=picked.length?'확정하면 체크한 발주서마다 지금 DB 기준으로 다시 계산해 박스를 잡고 바로 저장합니다.':'반영할 발주서가 없습니다.';
            btn.disabled=!picked.length; btn.textContent=`확정 · ${picked.length}건 박스 반영 + 저장`;
        }
        async function confirmVirtualBatch(){
            const picked=vbPicked();
            if(!picked.length||vbBusy||vbDone) return;
            const btn=document.getElementById('vbConfirmBtn'), cancel=document.getElementById('vbCancelBtn'), note=document.getElementById('vbNote');
            vbBusy=true; btn.disabled=true; cancel.disabled=true; btn.textContent='반영 중…'; note.className='vb-note'; note.textContent=`발주서 ${picked.length}건 저장 중… 창을 닫지 마세요.`;
            renderVbOpts();
            try{
                const res=await fetch('/api/ship-scan/virtual-batch',{method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({orderNumbers:picked.map(r=>r.orderNumber), topUp:vbTopUp, target:vbTarget, inboundCode:vbCode, confirm:true})});
                const j=await res.json().catch(()=>({}));
                if(!res.ok) throw new Error(j.error||'확정 실패');
                vbPreview=j; vbDone=true; vbBusy=false;
                cancel.disabled=false; cancel.textContent='닫기';
                renderVbOpts(); renderVbBody();
                const s=j.summary||{};
                toast(`가상스캔 ${s.saved||0}건 저장 · 상품 ${s.qty||0}개 → 박스 ${s.boxes||0}개${s.errors?` · 오류 ${s.errors}건`:''}`);
                // 표의 박스 열 갱신 — 체크 상태는 유지해서 바로 [박스라벨출력]으로 이어갈 수 있게
                const keep=new Set([...document.querySelectorAll('.rowchk:checked')].map(c=>c.dataset.allocid));
                await loadArranged();
                document.querySelectorAll('.rowchk').forEach(c=>{ if(keep.has(c.dataset.allocid)) c.checked=true; });
                updateCancelBtn();
            }catch(e){
                vbBusy=false; cancel.disabled=false;
                renderVbOpts();
                note.className='vb-note err'; note.textContent='확정 실패: '+e.message+' — 저장된 발주서가 있을 수 있으니 다시 미리보기로 확인하세요.';
                btn.disabled=false; btn.textContent=`확정 · ${picked.length}건 박스 반영 + 저장`;
            }
        }

        let toastTimer;
        function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3200);}

        loadData();
    </script>
</body>
</html>
