<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가상확정</title>
    <style>
        :root{
            --bg:#f3f4f6; --card:#fff; --ink:#0f172a; --ink-soft:#374151; --muted:#94a3b8;
            --line:#eef2f7; --primary:#4f46e5; --primary-dark:#4338ca; --blue:#2563eb; --hover:#f8fafc;
        }
        *{box-sizing:border-box;}
        body{margin:0;font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink-soft);font-size:13.5px;-webkit-font-smoothing:antialiased;}
        .page{max-width:1240px;width:96%;margin:22px auto;display:flex;flex-direction:column;gap:16px;}
        .card{background:var(--card);border:1px solid #edeff3;border-radius:16px;box-shadow:0 1px 3px rgba(15,23,42,.05),0 10px 30px rgba(15,23,42,.035);padding:22px 24px 18px;}
        .head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
        .title-wrap{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
        .title{font-size:20px;font-weight:700;color:var(--ink);margin:0;letter-spacing:-.3px;}
        .subtitle{font-size:13px;color:var(--muted);font-weight:500;}
        .subtitle b{color:var(--primary);font-weight:600;}
        .btn{height:38px;padding:0 15px;border:1px solid #e2e8f0;background:#fff;color:#334155;border-radius:9px;font-size:13.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s;white-space:nowrap;font-family:inherit;}
        .btn:hover{background:var(--hover);border-color:#cbd5e1;}
        .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600;box-shadow:0 1px 2px rgba(79,70,229,.25);}
        .btn.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);}
        .btn.ok{background:#1D9E75;color:#fff;border-color:#1D9E75;font-weight:600;}
        .btn.ok:hover{background:#0F6E56;border-color:#0F6E56;}
        .btn:disabled{opacity:.5;cursor:default;}

        /* 스캔 입력 — 출고스캔 발주서 입력과 같은 느낌 (크고, 스캐너 Enter) */
        .scan{position:relative;}
        .scan input{width:100%;height:64px;padding:0 20px 0 56px;border:2px solid #c7d2fe;border-radius:14px;background:#fff;font-size:22px;font-weight:700;color:var(--ink);outline:none;letter-spacing:.02em;font-family:inherit;}
        .scan input::placeholder{color:#b4bac6;font-weight:500;font-size:16px;letter-spacing:0;}
        .scan input:focus{border-color:var(--primary);box-shadow:0 0 0 5px rgba(99,102,241,.12);}
        .scan svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:var(--muted);}
        .hint{font-size:12.5px;color:var(--muted);margin-top:8px;}

        /* 박스 상세 */
        .box-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px;}
        .box-id{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
        .box-id .no{font-size:24px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}
        .box-id .meta{font-size:13px;color:#64748b;}
        .state{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;}
        .state.part{background:#EEEDFE;color:#3C3489;border:1.5px solid #7F77DD;}
        .state.all{background:#534AB7;color:#EEEDFE;}
        .state.ok{background:#E1F5EE;color:#085041;border:1.5px solid #1D9E75;}
        .state.none{background:#f1f5f9;color:#64748b;}
        .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
        .stat{flex:1 1 120px;border:1px solid #eef2f7;border-radius:10px;padding:10px 12px;}
        .stat .k{font-size:12px;color:#94a3b8;}
        .stat .v{font-size:19px;font-weight:700;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums;}
        .stat.v-virtual{background:#F5F3FF;border-color:#DDD6FE;}
        .stat.v-ok{background:#E1F5EE;border-color:#9FE1CB;}
        table{width:100%;border-collapse:collapse;}
        thead th{position:sticky;top:0;background:#f1f3f6;text-align:left;font-size:12px;font-weight:600;color:#8b94a3;padding:9px 10px;border:1px solid #dfe3ea;white-space:nowrap;}
        thead th.ctr{text-align:center;}
        tbody td{padding:8px 10px;border:1px solid #e8ebf1;color:var(--ink-soft);font-size:12.5px;vertical-align:middle;}
        td.ctr{text-align:center;font-variant-numeric:tabular-nums;}
        td.pname{white-space:normal;}
        td.bc{font-variant-numeric:tabular-nums;white-space:nowrap;}
        .vtag{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;white-space:nowrap;line-height:1.4;vertical-align:middle;}
        .vtag.part{background:#EEEDFE;color:#3C3489;border:1.5px solid #7F77DD;}
        .vtag.all{background:#534AB7;color:#EEEDFE;}
        .vtag.ok{background:#E1F5EE;color:#085041;border:1.5px solid #9FE1CB;}
        .state-row td{text-align:center;padding:36px 12px;color:var(--muted);}
        .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
        .confirmed-at{font-size:12.5px;color:#0F6E56;}

        /* 대기 목록 */
        .tabletop{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
        .seg{display:inline-flex;border:1px solid #e2e8f0;border-radius:9px;overflow:hidden;background:#fff;}
        .seg button{height:32px;padding:0 13px;border:none;background:transparent;font-size:13px;font-weight:500;color:#64748b;cursor:pointer;font-family:inherit;}
        .seg button+button{border-left:1px solid #e2e8f0;}
        .seg button.on{background:var(--primary);color:#fff;font-weight:600;}
        .table-scroll{overflow:auto;max-height:52vh;}
        tr.pick{cursor:pointer;}
        tr.pick:hover td{background:var(--hover);}
        tr.pick.sel td{background:#eef2ff;}
        .chip{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:600;background:#eef1f6;color:#475569;}
        .chip.part{background:#EEEDFE;color:#3C3489;border:1.5px solid #7F77DD;padding:1px 6px;}
        .chip.all{background:#534AB7;color:#EEEDFE;}
        .chip.ok{background:#E1F5EE;color:#085041;border:1.5px solid #1D9E75;padding:1px 6px;}
        .dash{color:#cbd5e1;}

        #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:13px 20px;border-radius:10px;font-size:13.5px;line-height:1.5;box-shadow:0 8px 24px rgba(15,23,42,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9999;max-width:90vw;white-space:pre-line;text-align:center;}
        #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    </style>
</head>
<body>
    <div id="header-container"></div>

    <div class="page">
        <!-- 스캔 -->
        <div class="card">
            <div class="head">
                <div class="title-wrap">
                    <h1 class="title">가상확정</h1>
                    <span class="subtitle">가상스캔으로 잡힌 박스의 상품을 다 찾아왔으면 박스 라벨을 스캔하고 [가상확정]</span>
                </div>
            </div>
            <div class="scan">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M11 8v8M15 8v8M19 8v8"/></svg>
                <input id="scanInput" type="text" autocomplete="off" placeholder="박스 라벨 스캔 — 발주번호-박스번호 (예 144287071-1) 또는 발주번호 후 Enter">
            </div>
            <div class="hint">발주번호만 스캔하면 그 발주서의 가상 박스가 아래 목록에 걸러지고, 하나뿐이면 바로 열립니다. 가상이 없는 박스는 확정할 것이 없습니다.</div>
        </div>

        <!-- 박스 상세 -->
        <div class="card" id="boxCard" style="display:none">
            <div class="box-head">
                <div class="box-id">
                    <span class="no" id="bxTitle"></span>
                    <span class="meta" id="bxMeta"></span>
                </div>
                <span class="state none" id="bxState"></span>
            </div>
            <div class="stats">
                <div class="stat"><div class="k">전체 수량</div><div class="v" id="bxQty">0</div></div>
                <div class="stat v-virtual"><div class="k">가상스캔</div><div class="v" id="bxVirtual">0</div></div>
                <div class="stat"><div class="k">실제 스캔</div><div class="v" id="bxReal">0</div></div>
                <div class="stat"><div class="k">품목</div><div class="v" id="bxItems">0</div></div>
            </div>
            <div class="table-scroll">
                <table>
                    <thead><tr><th>바코드</th><th>상품명</th><th class="ctr">수량</th><th class="ctr">가상</th></tr></thead>
                    <tbody id="bxBody"></tbody>
                </table>
            </div>
            <div class="actions">
                <span class="confirmed-at" id="bxConfirmedAt"></span>
                <button class="btn" id="undoBtn" onclick="confirmBox(true)">확정 취소</button>
                <button class="btn ok" id="confirmBtn" onclick="confirmBox(false)">✅ 가상확정</button>
            </div>
        </div>

        <!-- 가상 박스 목록 -->
        <div class="card">
            <div class="head">
                <div class="title-wrap">
                    <h2 class="title" style="font-size:16px">가상 박스 목록</h2>
                    <span class="subtitle">미확정 <b id="cntPending">0</b> · 확정 <b id="cntDone">0</b></span>
                </div>
                <button class="btn" onclick="loadList()">새로고침</button>
            </div>
            <div class="tabletop">
                <div class="seg" id="filterSeg">
                    <button type="button" class="on" data-f="pending" onclick="setFilter('pending')">미확정</button>
                    <button type="button" data-f="done" onclick="setFilter('done')">확정</button>
                    <button type="button" data-f="all" onclick="setFilter('all')">전체</button>
                </div>
                <span class="hint" id="listHint" style="margin:0 0 0 6px"></span>
            </div>
            <div class="table-scroll">
                <table>
                    <thead><tr><th>발주번호</th><th>물류센터</th><th class="ctr">입고예정일</th><th class="ctr">박스</th><th class="ctr">수량</th><th class="ctr">가상</th><th>상태</th></tr></thead>
                    <tbody id="listBody"><tr class="state-row"><td colspan="7">불러오는 중…</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        fetch('/header').then(r=>r.text()).then(h=>{document.getElementById('header-container').innerHTML=h;}).catch(()=>{});

        // ============================================================
        // 가상확정 — 가상스캔(출고스캔 [가상스캔])으로 잡힌 박스는 실물 스캔 없이 박스가 만들어진다.
        // 작업자가 그 박스의 상품을 다 찾아오면 박스 라벨(발주번호-박스번호)을 찍고 [가상확정] → rk_ship_boxes.virtual_confirmed_qty/at.
        // 확정 상태 = 확정 당시 가상 합 == 지금 가상 합 (가상스캔으로 더 채우면 자동으로 미확정). 쉽먼트·발주서 관리·입고정리 등은 ✅ 로 표시.
        // ============================================================
        const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const scanInput=document.getElementById('scanInput');
        let list=[], filter='pending', cur=null, orderFilter='';

        // "144287071-1" / "144287071 - 1" / "144287071" → { orderNumber, boxNo|null }
        function parseCode(raw){
            const m=String(raw||'').replace(/\s+/g,'').match(/^(\d+)(?:-(\d+))?$/);
            return m?{orderNumber:m[1], boxNo:m[2]!=null?Number(m[2]):null}:null;
        }
        function stateOf(b){ return b.virtualQty<=0?'none':b.confirmed?'ok':(b.virtualQty>=b.qty?'all':'part'); }
        const STATE_LABEL={ok:'✅ 가상확정',all:'👾 전부 가상',part:'🔀 일부 가상',none:'가상 없음'};
        function fmtTs(ts){ if(!ts) return ''; const d=new Date(ts); if(isNaN(d)) return ''; const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }

        scanInput.addEventListener('keydown',async e=>{
            if(e.key!=='Enter') return;
            e.preventDefault();
            const raw=scanInput.value; scanInput.value='';
            if(!raw.trim()) return;
            const p=parseCode(raw);
            if(!p){ playWarn(); toast('발주번호 형식이 아닙니다: '+raw.trim()); return; }
            if(p.boxNo!=null){ await openBox(p.orderNumber,p.boxNo); return; }
            // 발주번호만: 그 발주서의 가상 박스로 목록을 거르고, 하나면 바로 연다
            orderFilter=p.orderNumber; filter='all'; syncFilterSeg(); renderList();
            const mine=list.filter(b=>b.orderNumber===p.orderNumber);
            if(!mine.length){ playWarn(); toast(`${p.orderNumber} 에 가상 박스가 없습니다.`); orderFilter=''; renderList(); return; }
            if(mine.length===1) await openBox(mine[0].orderNumber, mine[0].boxNo);
            else toast(`${p.orderNumber} 가상 박스 ${mine.length}개 — 아래 목록에서 고르세요.`);
        });

        async function openBox(orderNumber,boxNo,quiet){
            try{
                const res=await fetch(`/api/ship-scan/box?orderNumber=${encodeURIComponent(orderNumber)}&boxNo=${encodeURIComponent(boxNo)}`);
                const d=await res.json();
                if(!res.ok) throw new Error(d.error||'박스 조회 실패');
                cur=d; renderBox(); renderList();
                if(quiet){ /* 확정/취소 직후 다시 읽기 — 안내는 호출한 쪽이 띄운다 */ }
                else if(d.virtualQty<=0){ playWarn(); toast('이 박스에는 가상스캔 수량이 없습니다 (전부 실제 스캔).'); }
                else if(d.confirmed){ toast('이미 가상확정된 박스입니다.'); }
                else playOk();
                document.getElementById('boxCard').scrollIntoView({block:'nearest',behavior:'smooth'});
            }catch(e){ playWarn(); toast(e.message); }
            scanInput.focus();
        }
        function renderBox(){
            const card=document.getElementById('boxCard');
            if(!cur){ card.style.display='none'; return; }
            card.style.display='';
            const st=stateOf(cur);
            document.getElementById('bxTitle').textContent=`📦 ${cur.orderNumber} - ${cur.boxNo}`;
            document.getElementById('bxMeta').textContent=[cur.boxSize, cur.center, cur.arrivalDate, cur.done?'처리완료 발주서':''].filter(Boolean).join(' · ');
            const se=document.getElementById('bxState'); se.className='state '+st; se.textContent=STATE_LABEL[st];
            document.getElementById('bxQty').textContent=cur.qty;
            document.getElementById('bxVirtual').textContent=cur.virtualQty;
            document.getElementById('bxReal').textContent=cur.qty-cur.virtualQty;
            document.getElementById('bxItems').textContent=cur.items.length;
            document.getElementById('bxBody').innerHTML=cur.items.length?cur.items.map(it=>{
                const ist=it.virtualQty<=0?'':cur.confirmed?'ok':(it.virtualQty>=it.qty?'all':'part');
                return `<tr><td class="bc">${esc(it.barcode)}</td><td class="pname">${esc(it.productName)||'<span class="dash">-</span>'}</td>
                    <td class="ctr">${it.qty}</td><td class="ctr">${it.virtualQty>0?`<span class="vtag ${ist}">${ist==='ok'?'✅':ist==='all'?'👾':'🔀'} ${it.virtualQty}</span>`:'<span class="dash">-</span>'}</td></tr>`;
            }).join(''):'<tr class="state-row"><td colspan="4">담긴 상품이 없습니다.</td></tr>';
            document.getElementById('confirmBtn').disabled=cur.virtualQty<=0||cur.confirmed||cur.done;
            document.getElementById('undoBtn').style.display=cur.confirmed?'':'none';
            document.getElementById('bxConfirmedAt').textContent=cur.confirmed?`확정 ${fmtTs(cur.confirmedAt)}`:(cur.confirmedQty>0?`이전 확정(가상 ${cur.confirmedQty}개) 뒤 가상이 바뀌어 다시 확인이 필요합니다`:'');
        }
        async function confirmBox(undo){
            if(!cur) return;
            const btn=document.getElementById(undo?'undoBtn':'confirmBtn'); btn.disabled=true;
            try{
                const res=await fetch('/api/ship-scan/virtual-confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderNumber:cur.orderNumber, boxNo:cur.boxNo, undo})});
                const d=await res.json();
                if(!res.ok) throw new Error(d.error||'가상확정 실패');
                toast(undo?`확정 취소 — 📦 ${cur.orderNumber} - ${cur.boxNo}`:`✅ 가상확정 — 📦 ${cur.orderNumber} - ${cur.boxNo} (가상 ${d.virtualQty}개)`);
                if(!undo) playOk();
                await Promise.all([openBox(cur.orderNumber,cur.boxNo,true), loadList()]);
            }catch(e){ playWarn(); toast(e.message); btn.disabled=false; }
        }

        // ── 목록 ──
        async function loadList(){
            try{
                const res=await fetch('/api/ship-scan/virtual-boxes');
                const d=await res.json();
                if(!res.ok) throw new Error(d.error||'목록 조회 실패');
                list=d; renderList();
            }catch(e){ document.getElementById('listBody').innerHTML=`<tr class="state-row"><td colspan="7">${esc(e.message)}</td></tr>`; }
        }
        function setFilter(f){ filter=f; orderFilter=''; syncFilterSeg(); renderList(); scanInput.focus(); }
        function syncFilterSeg(){ document.querySelectorAll('#filterSeg button').forEach(b=>b.classList.toggle('on', b.dataset.f===filter)); }
        function renderList(){
            document.getElementById('cntPending').textContent=list.filter(b=>!b.confirmed).length;
            document.getElementById('cntDone').textContent=list.filter(b=>b.confirmed).length;
            let rows=list.filter(b=>filter==='all'||(filter==='done'?b.confirmed:!b.confirmed));
            if(orderFilter) rows=rows.filter(b=>b.orderNumber===orderFilter);
            document.getElementById('listHint').textContent=orderFilter?`발주서 ${orderFilter} 만 표시 — 필터를 누르면 해제`:'';
            const tb=document.getElementById('listBody');
            if(!rows.length){ tb.innerHTML=`<tr class="state-row"><td colspan="7">${list.length?'해당하는 박스가 없습니다.':'가상 박스가 없습니다.'}</td></tr>`; return; }
            tb.innerHTML=rows.map(b=>{
                const st=stateOf(b), sel=cur&&cur.orderNumber===b.orderNumber&&cur.boxNo===b.boxNo;
                return `<tr class="pick ${sel?'sel':''}" onclick="openBox('${esc(b.orderNumber)}',${b.boxNo})">
                    <td style="font-weight:600;color:#1e293b">${esc(b.orderNumber)}</td><td>${esc(b.center)||'<span class="dash">-</span>'}</td><td class="ctr">${esc(b.arrivalDate)||'<span class="dash">-</span>'}</td>
                    <td class="ctr"><span class="chip ${st}"><b>${b.boxNo}</b>${esc(b.boxSize)}</span></td>
                    <td class="ctr">${b.qty}</td><td class="ctr">${b.virtualQty}</td>
                    <td>${STATE_LABEL[st]}${b.confirmed?` <span style="color:#94a3b8;font-size:12px">${esc(fmtTs(b.confirmedAt))}</span>`:''}</td>
                </tr>`;
            }).join('');
        }

        // ── 효과음 (출고스캔과 같은 방식) ──
        function playOk(){ try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(659.25,ac.currentTime); o.frequency.setValueAtTime(880,ac.currentTime+.12); o.connect(g); g.connect(ac.destination); g.gain.value=.4; o.start(); setTimeout(()=>o.stop(),260); }catch(e){} }
        function playWarn(){ try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.type='square'; o.frequency.value=700; o.connect(g); g.connect(ac.destination); g.gain.value=.5; o.start(); setTimeout(()=>o.stop(),350); }catch(e){} }

        let toastTimer;
        function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3200);}

        loadList();
        scanInput.focus();
    </script>
</body>
</html>
