<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>모바일 입고</title>
    <style>
        /* ============================================================
           모바일 입고 — 폰(375px) 전용. 종이 [인쇄] 대신 출고리스트를 카드 1장씩 넘기며 [스캔](찾음) / [없음]
           1화면 이름 + 연/월/출고코드 휠  →  2화면 발주서 입력·📷·목록  →  3화면 카드 스와이프
           사이트 헤더는 폭이 안 맞아 넣지 않는다 (홈 링크만)
           ============================================================ */
        :root{
            --bg:#f3f4f6; --card:#fff; --ink:#0f172a; --ink-soft:#374151; --muted:#94a3b8; --line:#e5e9f0;
            --primary:#4f46e5; --primary-dark:#4338ca; --blue:#2563eb; --ok:#1D9E75; --ok-dark:#0F6E56; --bad:#dc2626;
            --wheel-h:40px;
        }
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        html,body{height:100%;}
        body{margin:0;font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink-soft);font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
        button{font-family:inherit;}
        .screen{display:none;min-height:100dvh;flex-direction:column;}
        .screen.on{display:flex;}

        /* 상단 바 */
        .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;height:52px;padding:0 10px;background:rgba(251,250,249,.92);backdrop-filter:blur(10px);border-bottom:1px solid #eeece9;}
        .top .back{height:36px;padding:0 10px;border:0;background:transparent;font-size:15px;font-weight:700;color:var(--primary);cursor:pointer;display:inline-flex;align-items:center;gap:4px;}
        .top .ttl{flex:1;min-width:0;font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .top .ttl small{font-weight:600;color:var(--muted);margin-left:6px;}
        .top .ico{height:36px;min-width:36px;padding:0 8px;border:0;background:transparent;font-size:18px;cursor:pointer;border-radius:9px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;}
        .top .ico:active{background:#eceaf8;}

        /* 1화면 */
        .setup{padding:18px 16px 28px;display:flex;flex-direction:column;gap:18px;flex:1;}
        .brand{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:800;font-size:17px;}
        .brand .dot{width:9px;height:9px;border-radius:3px;background:#F0492F;}
        .field label{display:block;font-size:12.5px;font-weight:700;color:#64748b;margin-bottom:6px;}
        .field input{width:100%;height:52px;padding:0 16px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:18px;font-weight:700;color:var(--ink);outline:none;font-family:inherit;}
        .field input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(99,102,241,.12);}
        .field .hint{font-size:12px;color:var(--muted);margin-top:6px;}

        /* 휠 피커 (아이폰 시계처럼 세로 스크롤 스냅) */
        .wheels{position:relative;display:flex;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:6px;height:calc(var(--wheel-h) * 5 + 12px);}
        .wheels::before{content:"";position:absolute;left:6px;right:6px;top:50%;height:var(--wheel-h);transform:translateY(-50%);background:#eef2ff;border-radius:10px;pointer-events:none;}
        .wheels::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;border-radius:14px;pointer-events:none;
            background:linear-gradient(#fff 0, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, #fff 100%);}
        .wheel{flex:1;min-width:0;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;-ms-overflow-style:none;position:relative;z-index:1;padding:calc(var(--wheel-h) * 2) 0;}
        .wheel::-webkit-scrollbar{display:none;}
        .wheel.code{flex:1.4;}
        .wheel div{height:var(--wheel-h);display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:17px;font-weight:700;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;}
        .wheel div.sel{color:var(--ink);font-size:19px;}
        .wheel div.empty{color:#cbd5e1;font-weight:500;font-size:14px;}
        .wheel-head{display:flex;gap:6px;padding:0 6px;margin-bottom:5px;}
        .wheel-head span{flex:1;text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);}
        .wheel-head span.code{flex:1.4;}

        .btn{height:54px;border:1.5px solid var(--line);background:#fff;color:#334155;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;}
        .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
        .btn.primary:active{background:var(--primary-dark);}
        .btn:disabled{opacity:.45;}

        /* 2화면 — 발주서 */
        .pick{padding:14px 14px 24px;display:flex;flex-direction:column;gap:14px;flex:1;}
        .scanrow{display:flex;gap:8px;}
        .scanrow input{flex:1;min-width:0;height:56px;padding:0 14px;border:2px solid #c7d2fe;border-radius:14px;background:#fff;font-size:22px;font-weight:800;color:var(--ink);outline:none;font-family:inherit;letter-spacing:.02em;}
        .scanrow input::placeholder{font-size:14px;font-weight:600;color:#b4bac6;letter-spacing:0;}
        .scanrow input:focus{border-color:var(--primary);}
        .scanrow .cam{width:56px;height:56px;border:1.5px solid var(--line);background:#fff;border-radius:14px;font-size:24px;cursor:pointer;flex:none;}
        .olist{display:flex;flex-direction:column;gap:8px;}
        .olist .sub{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;}
        .olist .sub button{border:0;background:transparent;color:var(--primary);font-weight:700;font-size:13px;cursor:pointer;padding:4px 6px;}
        .orow{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;}
        .orow:active{background:#f8fafc;}
        .orow.done{opacity:.55;}
        .orow .no{font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}
        .orow .meta{font-size:12px;color:#64748b;margin-top:2px;}
        .orow .body{flex:1;min-width:0;}
        .orow .prog{font-size:13px;font-weight:800;padding:4px 9px;border-radius:999px;background:#f1f5f9;color:#475569;white-space:nowrap;font-variant-numeric:tabular-nums;}
        .orow .prog.part{background:#eef2ff;color:var(--primary);}
        .orow .prog.done{background:#E1F5EE;color:var(--ok-dark);}
        .orow .prog.miss{background:#fee2e2;color:var(--bad);}
        .empty{padding:36px 12px;text-align:center;color:var(--muted);font-size:14px;}

        /* 3화면 — 카드 덱 */
        #s3.on{height:100dvh;overflow:hidden;}
        .deck-wrap{flex:1;display:flex;flex-direction:column;min-height:0;}
        .deck{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;}
        .deck::-webkit-scrollbar{display:none;}
        .cardw{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;padding:8px 12px 4px;overflow:hidden;display:flex;flex-direction:column;}
        .card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px 14px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;position:relative;overflow:hidden;}
        .card.found{border-color:#9FE1CB;background:#F2FBF7;}
        .card.missing{border-color:#fecaca;background:#FFF5F5;}
        .meta{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:12.5px;font-weight:700;color:#475569;align-items:center;}
        .meta .batch{background:#eef2ff;color:var(--primary);border-radius:6px;padding:1px 7px;}
        .meta .ord{color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums;}
        .meta .sep{color:#cbd5e1;}
        .boxname{font-size:21px;font-weight:900;color:var(--ink);letter-spacing:-.01em;line-height:1.15;flex:none;}
        .boxname small{font-size:12px;font-weight:700;color:var(--muted);margin-left:6px;}
        .thumb{width:100%;flex:1 1 0;min-height:90px;border-radius:14px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#b4bac6;font-size:14px;font-weight:600;}
        .thumb img{width:100%;height:100%;object-fit:contain;background:#fff;}
        .pname{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.3;word-break:break-word;flex:none;}
        .pname .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
        .name-badge{display:inline-block;background:#dbeafe;color:#2563eb;border:1px solid #bfdbfe;border-radius:6px;padding:0 6px;white-space:nowrap;}
        .bc{display:inline-block;background:var(--blue);color:#fff;border-radius:8px;padding:3px 10px;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.03em;margin-top:2px;}
        .boxes{display:flex;flex-wrap:wrap;gap:6px;}
        .vbox{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;border-radius:8px;padding:3px 9px;background:#f1f5f9;color:#475569;}
        .vbox.virtual-part{background:#EEEDFE;color:#3C3489;border:1.5px solid #7F77DD;padding:2px 8px;}
        .vbox.virtual-all{background:#534AB7;color:#EEEDFE;}
        .qty{display:flex;align-items:baseline;justify-content:center;gap:8px;flex:none;padding-top:2px;}
        .qty .k{font-size:14px;font-weight:700;color:#64748b;}
        .qty .v{font-size:48px;font-weight:900;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;}
        .qty .u{font-size:18px;font-weight:800;color:#64748b;}
        .band{display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:12px;padding:8px 12px;font-size:14px;font-weight:800;flex:none;}
        .band.found{background:#E1F5EE;color:var(--ok-dark);}
        .band.missing{background:#fee2e2;color:var(--bad);}
        .band small{font-weight:600;font-size:12px;opacity:.8;margin-left:6px;}
        .band button{height:32px;padding:0 12px;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:9px;font-size:13px;font-weight:800;cursor:pointer;}
        .card.end{align-items:center;justify-content:center;text-align:center;gap:14px;}
        .card.end .big{font-size:44px;}
        .card.end h2{margin:0;font-size:20px;color:var(--ink);}
        .card.end p{margin:0;color:#64748b;font-size:14px;line-height:1.5;}
        .card.end .btn{width:auto;min-width:200px;}

        /* 하단 고정 버튼 */
        .bottom{flex:none;display:flex;gap:10px;padding:6px 12px calc(8px + env(safe-area-inset-bottom));background:var(--bg);}
        .bottom .act{flex:1;height:60px;border-radius:16px;font-size:21px;font-weight:900;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
        .bottom .none{background:#fff;color:var(--bad);border:2px solid #fecaca;}
        .bottom .none:active{background:#fee2e2;}
        .bottom .scan{background:var(--ok);color:#fff;flex:1.5;}
        .bottom .scan:active{background:var(--ok-dark);}
        .bottom .act:disabled{opacity:.4;}
        .dots{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:0 0 2px;font-variant-numeric:tabular-nums;flex:none;}

        /* 카메라 */
        .cam-back{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:50;}
        .cam-back.show{display:flex;}
        .cam-back video{flex:1;width:100%;object-fit:cover;}
        .cam-back .guide{position:absolute;left:8%;right:8%;top:40%;height:20%;border:2px solid rgba(255,255,255,.85);border-radius:12px;pointer-events:none;}
        .cam-back .cam-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:#fff;font-weight:700;font-size:14px;text-shadow:0 1px 2px rgba(0,0,0,.6);}
        .cam-back .cam-top button{height:40px;padding:0 14px;border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;}

        #toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;line-height:1.5;box-shadow:0 8px 24px rgba(15,23,42,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90vw;white-space:pre-line;text-align:center;}
        #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    </style>
</head>
<body>
    <!-- ───── 1화면: 이름 + 연/월/출고코드 ───── -->
    <section class="screen on" id="s1">
        <div class="top">
            <a href="/" class="ico" title="홈" aria-label="홈">🏠</a>
            <div class="ttl">모바일 입고</div>
        </div>
        <div class="setup">
            <div class="brand"><span class="dot"></span>아이엠몽 로켓 · 모바일 입고</div>
            <div class="field">
                <label for="worker">본인 이름</label>
                <input id="worker" type="text" autocomplete="off" placeholder="예) 영희" maxlength="20" enterkeyhint="done">
                <div class="hint">이 폰에 기억됩니다. 처리한 사람 표시에 쓰입니다.</div>
            </div>
            <div class="field">
                <label>입고정리 · 연도 / 월 / 출고코드</label>
                <div class="wheel-head"><span>연도</span><span>월</span><span class="code">출고코드</span></div>
                <div class="wheels">
                    <div class="wheel" id="wYear"></div>
                    <div class="wheel" id="wMonth"></div>
                    <div class="wheel code" id="wCode"></div>
                </div>
                <div class="hint" id="codeHint">위아래로 돌려 선택하세요.</div>
            </div>
            <button class="btn primary" id="nextBtn" onclick="goPick()">다음 →</button>
        </div>
    </section>

    <!-- ───── 2화면: 발주서 입력 / 📷 / 목록 ───── -->
    <section class="screen" id="s2">
        <div class="top">
            <button class="back" onclick="show('s1')">‹ 설정</button>
            <div class="ttl" id="pickTitle"></div>
            <button class="ico" onclick="loadOrders()" title="새로고침" aria-label="새로고침">↻</button>
        </div>
        <div class="pick">
            <div class="scanrow">
                <input id="orderInput" type="text" inputmode="numeric" autocomplete="off" placeholder="발주번호 입력 또는 📷 스캔" enterkeyhint="go">
                <button class="cam" onclick="openCam()" title="카메라로 바코드 스캔" aria-label="카메라">📷</button>
            </div>
            <button class="btn primary" onclick="startOrder(document.getElementById('orderInput').value)">진행 →</button>
            <div class="olist">
                <div class="sub"><span id="olistSub">발주서 목록</span><button onclick="startNextOrder()">다음 미처리 발주서 ›</button></div>
                <div id="olist"><div class="empty">불러오는 중…</div></div>
            </div>
        </div>
    </section>

    <!-- ───── 3화면: 카드 스와이프 ───── -->
    <section class="screen" id="s3">
        <div class="top">
            <button class="back" onclick="backToPick()">‹ 목록</button>
            <div class="ttl" id="deckTitle"></div>
            <button class="ico" onclick="reloadDeck()" title="새로고침" aria-label="새로고침">↻</button>
        </div>
        <div class="deck-wrap">
            <div class="deck" id="deck"></div>
            <div class="dots" id="dots"></div>
        </div>
        <div class="bottom">
            <button class="act none" id="btnNone" onclick="mark('missing')">없음</button>
            <button class="act scan" id="btnScan" onclick="mark('found')">✓ 스캔</button>
        </div>
    </section>

    <!-- 카메라 바코드 스캔 (BarcodeDetector 지원 브라우저만 — 안드로이드 크롬) -->
    <div class="cam-back" id="camBack">
        <video id="camVideo" playsinline muted autoplay></video>
        <div class="guide"></div>
        <div class="cam-top"><span>발주서 바코드를 맞춰 주세요</span><button onclick="closeCam()">닫기</button></div>
    </div>

    <div id="toast"></div>

    <script>
        const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const $=id=>document.getElementById(id);
        const LS={worker:'mobileInbound.worker', sel:'mobileInbound.sel'};
        let shipments=[], sel={y:'',m:'',code:''};
        let orders=[], curOrder=null, rows=[], idx=0;

        function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); window.scrollTo(0,0); }
        let toastTimer;
        function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}
        function worker(){ return $('worker').value.trim(); }
        // 상품명: 첫 콤마 앞 영어+숫자 모델코드 → 파란 배지 (입고정리와 같은 규칙)
        function modelBadge(name){
            const s=String(name==null?'':name); const ci=s.indexOf(',');
            if(ci>0){ const prefix=s.slice(0,ci), rest=s.slice(ci); const m=prefix.match(/(\S+)(\s*)$/);
                if(m){ const t=m[1];
                    if(/^[A-Za-z0-9]+$/.test(t)&&/[A-Za-z]/.test(t)&&/\d/.test(t)){
                        const before=prefix.slice(0, prefix.length-m[0].length);
                        return esc(before)+'<span class="name-badge">'+esc(t)+'</span>'+esc(m[2])+esc(rest); } } }
            return esc(s);
        }

        // ════════ 1화면: 휠 피커 ════════
        // 각 휠 = 세로 스크롤 스냅. 항목 높이 40px, 위아래 2칸 패딩이라 가운데 밴드에 오는 항목이 선택값.
        const WH=40;
        function wheelItems(el){ return [...el.children]; }
        function wheelIndex(el){ return Math.max(0, Math.min(el.children.length-1, Math.round(el.scrollTop/WH))); }
        function wheelSet(el,i,instant){ el.scrollTo({top:i*WH, behavior:instant?'auto':'smooth'}); markSel(el,i); }
        function markSel(el,i){ wheelItems(el).forEach((d,j)=>d.classList.toggle('sel',j===i)); }
        function fillWheel(el,list,emptyText){
            el.innerHTML=list.length?list.map(v=>`<div data-v="${esc(v.v)}">${esc(v.t)}</div>`).join(''):`<div class="empty" data-v="">${emptyText||'없음'}</div>`;
        }
        function wheelValue(el){ const d=el.children[wheelIndex(el)]; return d?d.dataset.v:''; }
        // 스크롤이 멈추면 선택 확정 → 아래 휠 갱신
        function bindWheel(el,onChange){
            let t; el.addEventListener('scroll',()=>{ markSel(el,wheelIndex(el)); clearTimeout(t); t=setTimeout(()=>onChange(wheelValue(el)),120); },{passive:true});
        }
        function shipDate(s){ return new Date(s.createdAt); }
        function years(){ return [...new Set(shipments.map(s=>shipDate(s).getFullYear()))].sort((a,b)=>b-a).map(String); }
        function months(y){ return [...new Set(shipments.filter(s=>String(shipDate(s).getFullYear())===String(y)).map(s=>shipDate(s).getMonth()+1))].sort((a,b)=>b-a).map(String); }
        function codes(y,m){ return shipments.filter(s=>{const d=shipDate(s);return String(d.getFullYear())===String(y)&&String(d.getMonth()+1)===String(m);}).map(s=>s.shipmentCode); }
        function setupWheels(){
            const ys=years();
            fillWheel($('wYear'), ys.map(v=>({v,t:v+'년'})), '연도 없음');
            let y=ys.includes(sel.y)?sel.y:ys[0]||'';
            wheelSet($('wYear'), Math.max(0,ys.indexOf(y)), true); sel.y=y;
            refillMonths(true); refillCodes(true);
        }
        function refillMonths(instant){
            const ms=months(sel.y);
            fillWheel($('wMonth'), ms.map(v=>({v,t:v+'월'})), '월 없음');
            const m=ms.includes(sel.m)?sel.m:ms[0]||'';
            wheelSet($('wMonth'), Math.max(0,ms.indexOf(m)), instant); sel.m=m;
        }
        function refillCodes(instant){
            const cs=codes(sel.y,sel.m);
            const byCode=new Map(shipments.map(s=>[s.shipmentCode,s]));
            fillWheel($('wCode'), cs.map(v=>({v,t:v})), '출고코드 없음');
            const c=cs.includes(sel.code)?sel.code:cs[0]||'';
            wheelSet($('wCode'), Math.max(0,cs.indexOf(c)), instant); sel.code=c;
            const s=byCode.get(c);
            $('codeHint').textContent=s?`${c} · 아이템 ${s.itemCount}건 · ${shipDate(s).toLocaleDateString('ko-KR')}`:'위아래로 돌려 선택하세요.';
            $('nextBtn').disabled=!c;
        }
        bindWheel($('wYear'), v=>{ if(v===sel.y) return; sel.y=v; sel.m=''; sel.code=''; refillMonths(); refillCodes(); });
        bindWheel($('wMonth'), v=>{ if(v===sel.m) return; sel.m=v; sel.code=''; refillCodes(); });
        bindWheel($('wCode'), v=>{ sel.code=v; refillCodes(true); });

        async function init(){
            try{ $('worker').value=localStorage.getItem(LS.worker)||''; const s=JSON.parse(localStorage.getItem(LS.sel)||'{}'); if(s&&typeof s==='object') sel={...sel,...s}; }catch(_){}
            try{
                const res=await fetch('/api/inbound/shipments'); shipments=await res.json();
                if(!Array.isArray(shipments)) throw new Error('목록 형식 오류');
                setupWheels();
            }catch(e){ toast('출고코드 목록을 불러오지 못했습니다: '+e.message); }
        }
        function goPick(){
            if(!worker()){ toast('본인 이름을 입력하세요.'); $('worker').focus(); return; }
            if(!sel.code){ toast('출고코드를 선택하세요.'); return; }
            try{ localStorage.setItem(LS.worker,worker()); localStorage.setItem(LS.sel,JSON.stringify(sel)); }catch(_){}
            $('pickTitle').innerHTML=`출고코드 ${esc(sel.code)}<small>${esc(worker())}</small>`;
            show('s2'); loadOrders();
        }

        // ════════ 2화면: 발주서 ════════
        async function loadOrders(){
            $('olist').innerHTML='<div class="empty">불러오는 중…</div>';
            try{
                const res=await fetch('/api/inbound/mobile-orders?shipmentCode='+encodeURIComponent(sel.code));
                const d=await res.json(); if(!res.ok) throw new Error(d.error||'조회 실패');
                orders=d; renderOrders();
            }catch(e){ $('olist').innerHTML=`<div class="empty">${esc(e.message)}</div>`; }
        }
        const isDoneOrder=o=>o.found+o.missing>=o.total;
        function renderOrders(){
            const left=orders.filter(o=>!isDoneOrder(o)).length;
            $('olistSub').textContent=`발주서 ${orders.length}건 · 남음 ${left}`;
            if(!orders.length){ $('olist').innerHTML='<div class="empty">이 출고코드에는 출고리스트(배정)가 없습니다.<br>PC 입고정리에서 [출고준비]를 먼저 하세요.</div>'; return; }
            $('olist').innerHTML=orders.map(o=>{
                const done=isDoneOrder(o), n=o.found+o.missing;
                const cls=done?(o.missing?'miss':'done'):(n>0?'part':'');
                return `<div class="orow ${done?'done':''}" onclick="startOrder('${esc(o.orderNumber)}')">
                    <div class="body"><div class="no">${esc(o.orderNumber)}</div>
                    <div class="meta">${o.batch}회차 · ${esc(o.center)||'-'} · ${esc(o.shippingDate)||'-'}</div></div>
                    <span class="prog ${cls}">${done?(o.missing?`✅ ${o.found} · ❌ ${o.missing}`:'✅ 완료'):`${n} / ${o.total}`}</span></div>`;
            }).join('');
        }
        // "144287071-1" (박스 라벨) / "144287071" → 발주번호
        function parseOrderNo(raw){ const m=String(raw||'').replace(/\s+/g,'').match(/^(\d{5,})(?:-\d+)?$/); return m?m[1]:null; }
        $('orderInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); startOrder($('orderInput').value); } });
        function startNextOrder(){
            const o=orders.find(x=>!isDoneOrder(x));
            if(!o){ toast('남은 발주서가 없습니다.'); return; }
            startOrder(o.orderNumber);
        }
        async function startOrder(raw){
            const no=parseOrderNo(raw);
            if(!no){ playWarn(); toast('발주번호 형식이 아닙니다: '+String(raw||'').trim()); return; }
            $('orderInput').value='';
            curOrder=no;
            $('deckTitle').innerHTML=`${esc(no)}<small></small>`;
            $('deck').innerHTML='<div class="cardw"><div class="card"><div class="empty">불러오는 중…</div></div></div>';
            show('s3');
            await reloadDeck(true);
        }
        function backToPick(){ stopCam(); show('s2'); loadOrders(); setTimeout(()=>$('orderInput').focus(),50); }

        // ════════ 3화면: 카드 덱 ════════
        async function reloadDeck(first){
            try{
                const res=await fetch(`/api/inbound/mobile-list?shipmentCode=${encodeURIComponent(sel.code)}&orderNumber=${encodeURIComponent(curOrder)}`);
                const d=await res.json(); if(!res.ok) throw new Error(d.error||'조회 실패');
                rows=d.rows||[];
                if(!rows.length){ playWarn(); toast(`출고코드 ${sel.code} 에 발주서 ${curOrder} 배정이 없습니다.`); backToPick(); return; }
                const h=rows[0];
                $('deckTitle').innerHTML=`${esc(curOrder)}<small>${esc(h.센터)||''} · ${esc(h.출고예정일)||''}</small>`;
                renderDeck();
                // 처음 열면 첫 미처리 카드로, 새로고침이면 현재 자리 유지
                const target=first?Math.max(0,rows.findIndex(r=>!r.모바일)):Math.min(idx,rows.length);
                goTo(target<0?rows.length:target, true);
                if(first) playOk();
            }catch(e){ playWarn(); toast(e.message); }
        }
        function boxChips(r){
            return (r.boxes||[]).map(b=>{
                const st=b.virtualQty<=0?'':(b.virtualQty>=b.qty?'virtual-all':'virtual-part');
                const em=st==='virtual-all'?'👾':st==='virtual-part'?'🔀':'';
                return `<span class="vbox ${st}" title="박스 ${b.boxNo} ${esc(b.boxSize||'')} · ${b.virtualQty>0?`가상 ${b.virtualQty} / `:''}전체 ${b.qty}">📦${b.boxNo}${b.boxSize?' '+esc(b.boxSize):''} ${em} ×${b.qty}</span>`;
            }).join('');
        }
        function fmtAt(ts){ if(!ts) return ''; const d=new Date(ts); return isNaN(d)?'':d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
        function cardHtml(r,i){
            const st=r.모바일||'';
            const boxes=boxChips(r);
            return `<div class="cardw" data-i="${i}"><div class="card ${st}">
                <div class="meta"><span class="batch">${r.회차}회차</span><span>${esc(r.출고코드)}</span><span class="sep">·</span><span class="ord">${esc(r.출고번호)}</span><span class="sep">·</span><span>${esc(r.센터)||'-'}</span><span class="sep">·</span><span>${esc(r.출고예정일)||'-'}</span></div>
                <div class="boxname">${esc(r.박스명)||'-'}<small>${esc(r.중국번호)||''}</small></div>
                <div class="thumb">${r.img?`<img src="${esc(r.img)}" alt="" loading="lazy" onerror="this.parentNode.textContent='이미지 없음'">`:'상품 이미지 없음'}</div>
                <div class="pname"><div class="nm">${modelBadge(r.상품명)}</div><span class="bc">${esc(r.바코드)||'-'}</span></div>
                ${boxes?`<div class="boxes">${boxes}</div>`:''}
                <div class="qty"><span class="k">출고개수</span><span class="v">${esc(r.출고개수)}</span><span class="u">개</span></div>
                ${st?`<div class="band ${st}"><span>${st==='found'?'✅ 찾음':'❌ 없음'}<small>${esc(r.모바일처리자)||''} ${fmtAt(r.모바일시각)}</small></span><button onclick="clearMark(${i})">취소</button></div>`:''}
            </div></div>`;
        }
        function endHtml(){
            const f=rows.filter(r=>r.모바일==='found').length, m=rows.filter(r=>r.모바일==='missing').length, left=rows.length-f-m;
            return `<div class="cardw" data-i="${rows.length}"><div class="card end">
                <div class="big">${left?'🔎':'🎉'}</div>
                <h2>${left?`아직 ${left}장 남았습니다`:'이 발주서 끝'}</h2>
                <p>✅ 찾음 ${f} · ❌ 없음 ${m} · 전체 ${rows.length}${left?'<br>왼쪽으로 넘겨 남은 카드를 확인하세요.':''}</p>
                ${left?`<button class="btn" onclick="goTo(firstLeft())">남은 카드로</button>`:''}
                <button class="btn primary" onclick="backToPick()">다음 발주서 ›</button>
            </div></div>`;
        }
        function renderDeck(){
            $('deck').innerHTML=rows.map(cardHtml).join('')+endHtml();
            updateDots();
        }
        function firstLeft(){ const i=rows.findIndex(r=>!r.모바일); return i<0?rows.length:i; }
        function nextLeft(from){ for(let i=from+1;i<rows.length;i++) if(!rows[i].모바일) return i; return rows.length; }
        function goTo(i,instant){
            idx=Math.max(0,Math.min(rows.length,i));
            const deck=$('deck'); deck.scrollTo({left:idx*deck.clientWidth, behavior:instant?'auto':'smooth'});
            updateDots();
        }
        // 스와이프로 넘긴 뒤 현재 카드 번호 갱신
        let scrollT; $('deck').addEventListener('scroll',()=>{ clearTimeout(scrollT); scrollT=setTimeout(()=>{ const d=$('deck'); idx=Math.round(d.scrollLeft/Math.max(1,d.clientWidth)); updateDots(); },80); },{passive:true});
        function updateDots(){
            const done=rows.filter(r=>r.모바일).length;
            $('dots').textContent=idx>=rows.length?`완료 카드 · 처리 ${done} / ${rows.length}`:`${idx+1} / ${rows.length} · 처리 ${done}`;
            const onEnd=idx>=rows.length;
            $('btnNone').disabled=onEnd; $('btnScan').disabled=onEnd;
        }
        // 카드 1장만 다시 그림 (덱 전체를 다시 그리면 스크롤이 튄다)
        function repaint(i){
            const old=$('deck').querySelector(`.cardw[data-i="${i}"]`);
            if(!old) return;
            const tmp=document.createElement('div'); tmp.innerHTML=cardHtml(rows[i],i); old.replaceWith(tmp.firstElementChild);
            const end=$('deck').lastElementChild; if(end){ const t2=document.createElement('div'); t2.innerHTML=endHtml(); end.replaceWith(t2.firstElementChild); }
            updateDots();
        }
        let saving=false;
        async function save(i,status){
            const r=rows[i]; if(!r||saving) return false;
            saving=true;
            const prev={모바일:r.모바일,모바일처리자:r.모바일처리자,모바일시각:r.모바일시각};
            r.모바일=status; r.모바일처리자=status?worker():null; r.모바일시각=status?new Date().toISOString():null;   // 낙관적 반영
            repaint(i);
            try{
                const res=await fetch('/api/inbound/mobile-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({allocId:r.allocId,status,worker:worker()})});
                const d=await res.json(); if(!res.ok) throw new Error(d.error||'저장 실패');
                r.모바일=d.모바일; r.모바일처리자=d.모바일처리자; r.모바일시각=d.모바일시각; repaint(i);
                return true;
            }catch(e){ Object.assign(r,prev); repaint(i); playWarn(); toast('저장 실패: '+e.message); return false; }
            finally{ saving=false; }
        }
        async function mark(status){
            if(idx>=rows.length) return;
            const i=idx;
            if(status==='found') playOk(); else playNone();
            const ok=await save(i,status);
            if(ok) goTo(nextLeft(i));   // 다음 미처리 카드 (없으면 완료 카드)
        }
        async function clearMark(i){ await save(i,null); }

        // ════════ 카메라 바코드 (BarcodeDetector) ════════
        let camStream=null, camTimer=null;
        async function openCam(){
            if(!('BarcodeDetector' in window)){ toast('이 브라우저는 카메라 바코드 인식을 지원하지 않습니다.\n발주번호를 직접 입력하세요.'); return; }
            try{
                camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
                const v=$('camVideo'); v.srcObject=camStream; $('camBack').classList.add('show'); await v.play();
                const det=new BarcodeDetector({formats:['code_128','code_39','ean_13','qr_code','itf']});
                camTimer=setInterval(async()=>{
                    try{ const codes=await det.detect(v); for(const c of codes){ const no=parseOrderNo(c.rawValue); if(no){ closeCam(); playOk(); startOrder(no); return; } } }catch(_){}
                },300);
            }catch(e){ stopCam(); toast('카메라를 열 수 없습니다: '+e.message); }
        }
        function stopCam(){ clearInterval(camTimer); camTimer=null; if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } $('camBack').classList.remove('show'); }
        function closeCam(){ stopCam(); }

        // ── 효과음 (가상확정·출고스캔과 같은 방식) ──
        function playOk(){ try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(659.25,ac.currentTime); o.frequency.setValueAtTime(880,ac.currentTime+.12); o.connect(g); g.connect(ac.destination); g.gain.value=.4; o.start(); setTimeout(()=>o.stop(),260); }catch(e){} }
        function playNone(){ try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.type='triangle'; o.frequency.setValueAtTime(440,ac.currentTime); o.frequency.setValueAtTime(330,ac.currentTime+.12); o.connect(g); g.connect(ac.destination); g.gain.value=.4; o.start(); setTimeout(()=>o.stop(),260); }catch(e){} }
        function playWarn(){ try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.type='square'; o.frequency.value=700; o.connect(g); g.connect(ac.destination); g.gain.value=.5; o.start(); setTimeout(()=>o.stop(),350); }catch(e){} }

        // 화면 회전·주소창 변화로 폭이 바뀌면 현재 카드에 다시 맞춘다
        window.addEventListener('resize',()=>{ if($('s3').classList.contains('on')) goTo(idx,true); });
        init();
    </script>
</body>
</html>
