            }catch(e){ playWarn(); toast(e.message); }
        }
        // 꺼내는 곳(박스명, 검정) → 담는 곳(출고스캔 박스 번호 · 크기, 오른쪽). 서버가 가상으로 담긴 박스만 준다(이미 실제로 담은 분량은 제외).
        //   칩에는 박스 번호·크기만. 담을 개수는 아래 큰 숫자(출고개수)로 보여준다 — 박스가 여럿일 때(발주번호만 입력한 전체 보기)만 칩에 ×n (2026-10-15: 칩의 ×4 와 출고개수 12 가 같이 보여 헷갈림)
        //   박스가 없으면 "직접 스캔"
        // ── 박스별 찾음/없음 (2026-10-22) — 한 행이 두 박스에 걸칠 때(출고개수 13 = 📦1 12 + 📦2 1) 2번을 담던 사람의 찾음이 1번 카드에 보이던 문제.
        //   r.모바일박스 = {박스번호: {status, qty, by, at}} · 박스 보기(curBox)면 그 박스 기록만, 발주서 전체 보기면 행 요약(r.모바일: 전부 찾음/하나라도 없음)
        //   박스별 기록이 하나도 없는 행(예전 기록)은 행 요약을 그대로 쓴다
        const boxEntries=r=>(r&&r.모바일박스&&typeof r.모바일박스==='object')?r.모바일박스:{};
        function markOf(r){
            const e=boxEntries(r), has=Object.keys(e).length>0;
            if(curBox!=null){ const m=e[String(curBox)]; if(m) return {status:m.status||null,by:m.by||null,at:m.at||null}; if(has) return null; }
            return r.모바일?{status:r.모바일,by:r.모바일처리자,at:r.모바일시각}:null;
        }
        const markSt=r=>{ const m=markOf(r); return m?m.status:null; };
        // 이번 표시가 걸리는 박스(들)와 몫 — 박스 보기면 그 박스만, 전체 보기면 카드의 박스 전부, 박스가 없으면 "0"(박스 미정) 에 행의 출고개수
        function marksFor(r){
            const list=r.boxes||[];
            if(curBox>0){ const b=list.find(b=>b.boxNo===curBox); return [{boxNo:curBox, qty:b?Number(b.virtualQty)||0:0}]; }
            if(curBox===0||!list.length) return [{boxNo:0, qty:Number(r.출고개수)||0}];
            return list.map(b=>({boxNo:b.boxNo, qty:Number(b.virtualQty)||0}));
        }
        function boxRow(r,i){
            // [전체] 모드: 입고 = "입고코드-박스명" (1018-BR5) · 재고 = 위치 (흰 칩). [입고] 모드는 예전 그대로 박스명만
            const src=mode==='all'&&r.source==='재고'
                ? `<span class="chip src stock" title="재고 위치">${ICON('i-search',20,2.2)}${esc(r.위치)||'-'}</span>`
                : mode==='all'
                ? `<span class="chip src" title="중국 입고 박스 ${esc(r.중국번호||'')}">${ICON('i-truck',20,2)}${esc(r.출고코드)}-${esc(r.박스명)||'-'}</span>`
                : `<span class="chip src" title="중국 입고 박스 ${esc(r.중국번호||'')}">${ICON('i-truck',20,2)}${esc(r.박스명)||'-'}</span>`;
            // 입고 박스 칩 아래 작은 글씨: 같은 상품의 재고 위치 (2026-10-27 — 재고정리로 선반에 올린 상품이 어디 있는지 보이게)
            const locs=r.source!=='재고'?(r.재고위치||[]):[];
            //   위치마다 배지(📍 위치 · 수량), 3곳까지 + "+N"
            const srcLoc=locs.length?`<div class="srcloc" title="재고 위치: ${esc(locs.map(l=>`${l.location} ${l.qty}개`).join(', '))}">${locs.slice(0,3).map(l=>`<span class="locbadge">${ICON('i-pin',13,2.4)}${esc(l.location)}<small>${l.qty}</small></span>`).join('')}${locs.length>3?`<span class="locbadge more">+${locs.length-3}</span>`:''}</div>`:'';
            const list=(r.boxes||[]);
            const dst=list.length
                ? list.map(b=>{ const m=boxEntries(r)[String(b.boxNo)]; const mk=m?(m.status==='found'?`<small class="mk ok" title="찾음 · ${esc(m.by||'')}">✓</small>`:`<small class="mk miss" title="없음 · ${esc(m.by||'')}">✕</small>`):'';
                    return `<span class="chip pick" onclick="openSizeSheet(${b.boxNo},${i})" title="박스 ${b.boxNo} ${esc(b.boxSize||'')} · 가상 ${b.virtualQty}개 (박스 안 ${b.qty}개) — 누르면 크기 변경">${ICON('i-box',20,2)}${b.boxNo}${b.boxSize?' · '+esc(b.boxSize):''}${list.length>1?` <small style="font-size:13px;font-weight:700;color:var(--muted)">×${b.virtualQty}</small>`:''}${mk}</span>`; }).join('')
                : `<span class="chip none">${ICON('i-box',18,2)}박스 미정 · 직접 스캔</span>`;
            return `<div class="boxrow"><div class="srcwrap">${src}${srcLoc}</div><span class="arrow">${ICON('i-arrow',24,2.5)}</span><div class="dst">${dst}</div></div>`;
        }
        function fmtAt(ts){ if(!ts) return ''; const d=new Date(ts); if(isNaN(d)) return ''; const p=n=>String(n).padStart(2,'0'); return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
        function cardHtml(r,i){
            const mk=markOf(r), st=mk?mk.status:'';
            const band=st?`<div class="band ${st}"><div class="l">${ICON('i-check',22,3)}<b>${st==='found'?'찾음':'없음'}</b><small>${esc(mk.by)||''} · ${fmtAt(mk.at)}</small></div><button onclick="clearMark(${i})">취소</button></div>`
                // 전체 보기에서 일부 박스만 표시된 행 — 어느 박스를 누가 처리했는지 한 줄로 (2026-10-22)
                :(curBox==null&&Object.keys(boxEntries(r)).length?`<div class="band part"><div class="l"><b>일부</b><small>${Object.entries(boxEntries(r)).map(([k,m])=>`📦${k==='0'?'미정':k} ${m.status==='found'?'찾음':'없음'}${m.by?' · '+esc(m.by):''}`).join(' / ')}</small></div><button onclick="clearMark(${i})">취소</button></div>`:'');
            const noimg=ICON('i-img',40,1.6)+'<div>상품 이미지 없음</div>';
            return `<div class="cardw" data-i="${i}"><div class="card ${st}">
                ${band}
                <div class="meta">${mode==='all'?`<span class="batch">${r.source==='재고'?'재고':esc(r.출고코드)} · ${r.회차}회차</span>`:`<span class="batch">${r.회차}회차</span><span>${esc(r.출고코드)}</span><span class="sep">·</span>`}<span>${esc(r.센터)||'-'}</span><span class="sep">·</span><span>${esc(ymd(r.출고예정일))||'-'}</span></div>
                ${boxRow(r,i)}
                <div class="thumb">${r.img?`<img src="${esc(r.img)}" alt="" loading="lazy" onerror="this.parentNode.innerHTML=NOIMG">`:noimg}</div>
                <div class="pname"><div class="nm">${modelBadge(r.상품명)}</div><span class="bc">${esc(r.바코드)||'-'}</span></div>
                ${r.모바일메모?`<div class="memo-line" onclick="openMemo(${i})"><span>📝</span><span>${esc(r.모바일메모)}<small>${esc(r.모바일메모처리자||'')}${r.모바일메모시각?' · '+fmtAt(r.모바일메모시각):''}</small></span></div>`:''}
                ${qtyRow(r)}
            </div></div>`;
        }
        const NOIMG=ICON('i-img',40,1.6)+'<div>이미지 없음</div>';
        // 출고개수 = 이 카드에서 **지금 담을 개수**. 가상 박스가 잡혀 있으면 그 박스(들) 몫의 합(박스 보기면 그 박스 몫), 아니면 행의 출고개수.
        //   박스 몫이 행의 출고개수보다 작으면(나머지는 이미 실제 포장됐거나 다른 입고코드) 작게 "배정 n" 을 덧붙인다
        function qtyRow(r){
            const list=r.boxes||[], share=list.reduce((s,b)=>s+(Number(b.virtualQty)||0),0);
            const total=Number(r.출고개수)||0, show=list.length?share:total;
            return `<div class="qty"><span class="k">출고개수</span><span class="v">${show}</span><span class="u">개</span>${list.length&&show!==total?`<span class="u" style="font-weight:600">· 배정 ${total}</span>`:''}</div>`;
        }
        function endHtml(){
            const f=rows.filter(r=>markSt(r)==='found').length, m=rows.filter(r=>markSt(r)==='missing').length, left=rows.length-f-m;
            const miss=rows.filter(r=>markSt(r)==='missing');
            return `<div class="cardw" data-i="${rows.length}"><div class="card end">
                <div class="ring ${left?'left':''}">${left?ICON('i-search',40,2.4):ICON('i-check',44,3)}</div>
                <div><h2>${left?`아직 ${left}장 남았습니다`:'이 발주서 끝'}</h2>
                <p>${left?'왼쪽으로 넘겨 남은 카드를 확인하세요.':(m?'못 찾은 상품은 사무실 입고정리 표에 없음으로 보입니다.':`${rows.length}장 모두 처리했습니다.`)}</p></div>
                <div class="tiles"><div class="tile ok"><div class="k">찾음</div><div class="v">${f}</div></div><div class="tile miss"><div class="k">없음</div><div class="v">${m}</div></div><div class="tile"><div class="k">전체</div><div class="v">${rows.length}</div></div></div>
                ${endBoxHtml()}
                ${miss.length?`<div class="misslist"><div class="lab">없음으로 표시한 상품</div>${miss.map(r=>`<div class="missrow"><div class="bx" style="${r.source==='재고'?'font-size:11px':''}">${esc(r.source==='재고'?r.위치:r.박스명)||'-'}</div><div class="b"><div class="n">${esc(r.상품명)}</div><div class="m"><span class="bc">${esc(r.바코드)}</span><span>${esc(r.출고개수)}개 없음</span></div></div></div>`).join('')}</div>`:''}
                <div class="end-foot">
                    ${left?`<button class="btn" onclick="goTo(firstLeft())">남은 카드로</button>`:''}
                    <button class="btn primary" onclick="backToPick()">다음 발주서 ${ICON('i-arrow',20,2.5)}</button>
                    ${left?'':`<button class="btn ghost" onclick="goTo(0)">카드 다시 보기</button>`}
                </div>
            </div></div>`;
        }
        // 완료 카드의 박스 크기 변경 (2026-10-21) — 다 찾고 나서 상자를 바꿔 담는 경우가 많아 마지막 화면에서 바로 바꾸게 한다.
        //   박스 라벨로 들어왔으면 그 박스, 발주번호 전체로 들어왔으면 카드에 잡힌 박스들
        function endBoxes(){
            if(curBox>0) return [curBox];
            const set=new Set(); for(const r of rows) for(const b of (r.boxes||[])) set.add(b.boxNo);
            return [...set].sort((a,b)=>a-b);
        }
        function endBoxHtml(){
            const bxs=endBoxes(); if(!bxs.length) return '';
            return `<div class="endbox"><div class="lab">담는 박스 — 크기를 바꾸거나 나눠 담을 때</div>${bxs.map(n=>`<button class="btn" onclick="openSizeSheet(${n})"><span>📦${n} · ${esc(sizeOfBox(n)||'크기 없음')}</span><small>박스 ▾</small></button>`).join('')}</div>`;
        }
        function renderDeck(){
            $('deck').innerHTML=rows.map(cardHtml).join('')+endHtml();
            updateDots();
        }
        function firstLeft(){ const i=rows.findIndex(r=>!markSt(r)); return i<0?rows.length:i; }
        function nextLeft(from){ for(let i=from+1;i<rows.length;i++) if(!markSt(rows[i])) return i; return rows.length; }
        function goTo(i,instant){
            idx=Math.max(0,Math.min(rows.length,i));
            const deck=$('deck'); deck.scrollTo({left:idx*deck.clientWidth, behavior:instant?'auto':'smooth'});
            updateDots();
        }
        // 스와이프로 넘긴 뒤 현재 카드 번호 갱신
        let scrollT; $('deck').addEventListener('scroll',()=>{ clearTimeout(scrollT); scrollT=setTimeout(()=>{ const d=$('deck'); idx=Math.round(d.scrollLeft/Math.max(1,d.clientWidth)); updateDots(); },80); },{passive:true});
        function updateDots(){
            const done=rows.filter(r=>markSt(r)).length, n=rows.length;
            const onEnd=idx>=n, full=n>0&&done>=n;
            $('dots').className='txt'+(full?' full':'');
            $('dots').innerHTML=full?`${n} / ${n} 완료`:(onEnd?`처리 ${done} / ${n}`:`${idx+1} / ${n} <span>· 처리 ${done}</span>`);
            const bar=$('progBar'); bar.style.width=(n?Math.round(done/n*100):0)+'%'; bar.classList.toggle('full',full);
            $('btnNone').disabled=onEnd; $('btnScan').disabled=onEnd; $('btnMemo').disabled=onEnd;
            const cur=rows[idx]; const dim=!onEnd&&!!(cur&&markSt(cur));
            $('btnMemo').classList.toggle('has', !onEnd&&!!(cur&&cur.모바일메모));
            $('btnNone').classList.toggle('dim',dim); $('btnScan').classList.toggle('dim',dim);
        }
        // 카드 1장만 다시 그림 (덱 전체를 다시 그리면 스크롤이 튄다)
        function repaint(i){
            const old=$('deck').querySelector(`.cardw[data-i="${i}"]`);
            if(!old) return;
            const tmp=document.createElement('div'); tmp.innerHTML=cardHtml(rows[i],i); old.replaceWith(tmp.firstElementChild);
            const end=$('deck').lastElementChild; if(end){ const t2=document.createElement('div'); t2.innerHTML=endHtml(); end.replaceWith(t2.firstElementChild); }
            updateDots();
        }
        let saving=false;
        async function save(i,status){
            const r=rows[i]; if(!r||saving) return false;
            saving=true;
            const prev={모바일:r.모바일,모바일처리자:r.모바일처리자,모바일시각:r.모바일시각,모바일박스:r.모바일박스};
            // 낙관적 반영 — 박스별 기록(이번 박스(들)만)과, 전체 보기면 행 요약도. 서버 응답으로 덮어쓴다 (2026-10-22)
            const marks=marksFor(r), now=new Date().toISOString(), e={...boxEntries(r)};
            for(const m of marks){ if(status) e[String(m.boxNo)]={status,qty:m.qty,by:worker(),at:now}; else delete e[String(m.boxNo)]; }
            r.모바일박스=Object.keys(e).length?e:null;
            if(curBox==null||status==null){ r.모바일=status; r.모바일처리자=status?worker():null; r.모바일시각=status?now:null; }
            repaint(i);
            try{
                const body={status,worker:worker(),marks,shareTotal:Number.isFinite(Number(r.shareTotal))?Number(r.shareTotal):null};
                const res=mode==='all'
                    ? await fetch('/api/mobile/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({listId:r.listId,...body})})
                    : await fetch('/api/inbound/mobile-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({allocId:r.allocId,...body})});
                const d=await res.json(); if(!res.ok) throw new Error(d.error||'저장 실패');
                r.모바일=d.모바일; r.모바일처리자=d.모바일처리자; r.모바일시각=d.모바일시각; r.모바일박스=d.모바일박스||null; repaint(i);
                return true;
            }catch(e){ Object.assign(r,prev); repaint(i); playWarn(); toast('저장 실패: '+e.message); return false; }
            finally{ saving=false; }
        }
        async function mark(status){
            if(idx>=rows.length) return;
            const i=idx;
            if(status==='found') playOk(); else playNone();
            const ok=await save(i,status);
            if(ok) goTo(nextLeft(i));   // 다음 미처리 카드 (없으면 완료 카드)
        }
        async function clearMark(i){ await save(i,null); }

        // ── 메모 (2026-10-21) — 지금 카드(또는 카드의 메모 줄을 누른 카드)에 한 줄 메모. 저장 = POST /api/mobile/memo ──
        //   [입고] 모드는 allocId(rk_cn_shipping), [전체] 모드는 listId(rk_shipping_list). 빈 메모로 저장하면 지운다
        let memoIdx=null, memoBusy=false;
        function openMemo(i){
            const at=Number.isInteger(i)?i:idx;
            if(at==null||at>=rows.length) return;
            memoIdx=at; const r=rows[at];
            $('memoTitle').textContent=r.모바일메모?'메모 수정':'메모';
            $('memoSub').innerHTML=`<b>${esc(r.source==='재고'?(r.위치||'재고'):(r.박스명||''))}</b> · ${esc(r.바코드||'')}<br>${esc(String(r.상품명||'').slice(0,40))}`;
            $('memoText').value=r.모바일메모||'';
            $('memoClearBtn').disabled=!r.모바일메모;
            $('memoBack').classList.add('show');
            setTimeout(()=>$('memoText').focus(),80);
        }
        function closeMemo(){ $('memoBack').classList.remove('show'); memoIdx=null; }
        async function saveMemo(clear){
            if(memoBusy||memoIdx==null) return;
            const i=memoIdx, r=rows[i]; if(!r) return;
            const memo=clear?'':$('memoText').value.trim();
            if(!clear&&!memo){ toast('메모를 입력하세요. 지우려면 [지우기]'); return; }
            memoBusy=true; $('memoSaveBtn').disabled=true; $('memoClearBtn').disabled=true;
            try{
                const body=mode==='all'?{listId:r.listId,memo,worker:worker()}:{allocId:r.allocId,memo,worker:worker()};
                const res=await fetch('/api/mobile/memo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
                const d=await res.json(); if(!res.ok) throw new Error(d.error||'저장 실패');
                r.모바일메모=d.모바일메모; r.모바일메모처리자=d.모바일메모처리자; r.모바일메모시각=d.모바일메모시각;
                closeMemo(); repaint(i); playOk(); toast(memo?'메모를 저장했습니다.':'메모를 지웠습니다.');
            }catch(e){ playWarn(); toast('메모 저장 실패: '+e.message); }
            finally{ memoBusy=false; $('memoSaveBtn').disabled=false; if(memoIdx!=null) $('memoClearBtn').disabled=!(rows[memoIdx]&&rows[memoIdx].모바일메모); }
        }

        // ── 담는 박스 시트 (2026-10-27 개편) — 덱 제목 📦N · 카드의 담는 곳 칩 · 완료 카드의 박스 버튼에서 연다 ──
        //   위 탭 [박스 크기 변경] [박스 이동] — 고르면 아래 내용이 바뀐다. 카드가 없으면(완료 카드에서 열면) 박스 이동 탭은 흐리게 + 누르면 이유.
        //   size: 크기를 고르고 [저장] (POST /api/inbound/mobile-box-size). rk_ship_boxes.box_size 만 바뀐다
        //   move: "이 상품을 지금 박스에 몇 개 담나요"(화면 숫자 패드) + 새 박스 크기 → 입력한 개수만 남기고, 이 상품의 나머지와 이후 카드의 이 박스 몫을 새 박스로
        //         (POST /api/inbound/mobile-box-split · 새 번호 = 그 발주서의 최대 + 1, 화면에 미리 보여준 번호와 다르면 서버가 409)
        //         [박스 생성] → 확인 모달 [넘어가기] → 만들고 새 박스 카드로 바로 이동
        //   카드 순서는 서버가 정한 고정 순서라 "이 카드 이후" 가 매번 같다. 옮기는 건 가상 박스 배정뿐 — 출고개수는 그대로,
        //   옮긴 몫의 박스별 찾음 기록은 서버가 정리한다(원래 박스에 남는 몫만 남김).
        const BOX_SIZES=['극소','소','중','대','대2'];
        let szBox=null, szBusy=false, szIdx=null, szView='size', szPick=null;
        let mvSize=null, mvKeep='', mvNext=null, mvNextErr='';
        function sizeOfBox(boxNo){ for(const r of rows) for(const b of (r.boxes||[])) if(b.boxNo===boxNo) return b.boxSize||''; const o=orders.find(o=>o.orderNumber===curOrder&&o.boxNo===boxNo); return o?(o.boxSize||''):''; }
        const shareIn=(r,boxNo)=>{ const b=r&&(r.boxes||[]).find(b=>b.boxNo===boxNo); return b?Math.max(0,Number(b.virtualQty)||0):0; };
        function openSizeSheet(boxNo,cardIdx){
            if(!curOrder||!(boxNo>0)) return;
            szBox=boxNo;
            // 칩에서 열면 그 카드, 제목에서 열면 지금 보고 있는 카드(그 박스에 몫이 있을 때만). 완료 카드에서 열면 카드 없음 → 박스 이동 불가
            const ci=Number.isInteger(cardIdx)?cardIdx:idx;
            szIdx=rows[ci]&&shareIn(rows[ci],boxNo)>0?ci:null;
            szView='size'; szPick=sizeOfBox(boxNo)||null; mvSize=null; mvKeep=''; mvNext=null; mvNextErr='';
            renderSizeSheet();
            $('szBack').classList.add('show');
        }
        function closeSizeSheet(){ if(szBusy) return; $('szBack').classList.remove('show'); szBox=null; szIdx=null; szView='size'; }
        const NO_CARD_MSG='상품 카드의 담는 박스 칩을 눌러야 그 상품부터 나눌 수 있습니다';
        function szGo(view){
            if(szBusy||szView===view) return;
            if(view==='move'&&szIdx==null){ playWarn(); toast(NO_CARD_MSG); return; }
            szView=view;
            if(view==='size') szPick=sizeOfBox(szBox)||null;
            if(view==='move'){ mvSize=null; mvKeep=''; loadNextBoxNo(); }
            renderSizeSheet();
        }
        function renderSizeSheet(){
            const cur=sizeOfBox(szBox), label=`${esc(curOrder)}-${szBox}`;
            const body=$('szBody');
            if(szView==='move'&&szIdx==null) szView='size';
            $('szTabs').innerHTML=[['size','박스 크기 변경'],['move','박스 이동']].map(([k,t])=>
                `<button role="tab" aria-selected="${szView===k}" class="${szView===k?'on':''}${k==='move'&&szIdx==null?' off':''}" ${szBusy?'disabled':''} onclick="szGo('${k}')">${t}</button>`).join('');
            if(szView==='move'){ renderMoveView(); return; }
            $('szSub').innerHTML=`<b>${label}</b> · 지금 <b>${esc(cur)||'크기 없음'}</b> — 바꿀 크기를 고르고 저장하세요`;
            body.innerHTML=`<div class="sz-grid">${BOX_SIZES.map(sz=>`<button class="${sz===szPick?'cur':''}" ${szBusy?'disabled':''} onclick="szPick='${sz}';renderSizeSheet()">${sz}</button>`).join('')}</div>
                <div class="sz-actions"><button class="btn primary" ${szBusy||!szPick||szPick===cur?'disabled':''} onclick="changeBoxSize()">${szBusy?'저장 중…':'저장'}</button></div>`;
        }
        async function loadNextBoxNo(){
            mvNext=null; mvNextErr='';
            const order=curOrder, box=szBox;
            try{
                const res=await fetch('/api/inbound/mobile-box-next?orderNumber='+encodeURIComponent(order));
                const d=await res.json(); if(!res.ok) throw new Error(d.error||'조회 실패');
                if(order!==curOrder||box!==szBox) return;
                mvNext=d.nextBoxNo;
            }catch(e){ mvNextErr='새 박스 번호를 못 읽었습니다: '+e.message; }
            if(szView==='move') renderMoveView();
        }
        // 박스 이동 계획 — keep = 이 상품을 지금 박스(szBox)에 남길 개수. 이 상품의 나머지 + 이후 카드의 이 박스 몫 전부를 새 박스로
        function movePlan(keep){
            if(szIdx==null||!(szBox>0)) return null;
            const r=rows[szIdx], share=shareIn(r,szBox);
            const before=rows.slice(0,szIdx).filter(x=>shareIn(x,szBox)>0).length;
            const codeOf=x=>x.출고코드!=null&&String(x.출고코드).trim()!==''?String(x.출고코드).trim():null;
            const moves=new Map(), cards=[];
            const add=(x,q)=>{ if(!(q>0)) return; const code=codeOf(x), k=`${x.바코드}|${code||''}`; const m=moves.get(k)||{barcode:x.바코드,code,qty:0}; m.qty+=q; moves.set(k,m); };
            const curMove=Number.isInteger(keep)?share-keep:0;
            add(r,curMove);
            if(curMove>0) cards.push({listId:r.listId??null, allocId:r.allocId??null, keep, shareTotal:r.shareTotal});
            let laterCards=0, laterQty=0;
            rows.forEach((x,j)=>{ if(j<=szIdx) return; const q=shareIn(x,szBox); if(!(q>0)) return;
                laterCards++; laterQty+=q; add(x,q); cards.push({listId:x.listId??null, allocId:x.allocId??null, keep:0, shareTotal:x.shareTotal}); });
            return { share, before, keep, curMove, laterCards, laterQty, total:curMove+laterQty, moves:[...moves.values()], cards };
        }
        // 입력값 검사 — 문제가 있으면 이유(문장), 없으면 ''
        function moveProblem(p){
            if(mvKeep==='') return '이 상품을 📦'+szBox+' 에 몇 개 담을지 입력하세요';
            if(!Number.isInteger(p.keep)||p.keep<0||p.keep>p.share) return `0 ~ ${p.share} 사이로 입력하세요`;
            if(p.total<=0) return '넘어갈 상품이 없습니다 — 이 상품을 전부 담고 뒤에 남은 상품도 없습니다';
            if(p.before===0&&p.keep===0) return `📦${szBox} 의 첫 상품이라 0개면 박스가 통째로 넘어갑니다 — 1개 이상 남기거나 박스 크기 변경을 쓰세요`;
            if(!mvSize) return '새 박스 크기를 고르세요';
            if(mvNextErr) return mvNextErr;
            if(mvNext==null) return '새 박스 번호를 읽는 중…';
            return '';
        }
        function renderMoveView(){
            const r=rows[szIdx];
            if(!r){ szView='size'; renderSizeSheet(); return; }
            $('szSub').innerHTML=`<b>${esc(curOrder)}-${szBox}</b> 에서 이 상품부터 새 박스로 나눕니다`;
            const share=shareIn(r,szBox);
            const nm=String(r.상품명||'').split(',')[0].slice(0,40);
            $('szBody').innerHTML=`<div class="mv-new"><span><small>새 박스</small><span class="no">${esc(curOrder)}-${mvNext!=null?mvNext:'…'}</span></span><span class="sz ${mvSize?'':'none'}">${mvSize?esc(mvSize):'크기 선택'}</span></div>
                <div class="sz-sec">이 상품을 📦${szBox} 에 몇 개 담나요?</div>
                <div class="mv-item" title="${esc(r.상품명||'')}">${esc(nm)} · ${esc(r.바코드||'')}</div>
                <div class="mv-keep" id="mvKeepNum"><span id="mvKeepVal"></span><small>/ ${share}개</small></div>
                <div class="mv-pad">${PAD_KEYS.map(k=>`<button type="button" class="${k==='C'||k==='B'?'fn':''}" ${szBusy?'disabled':''} onclick="padKey('${k}')" aria-label="${k==='C'?'지우기':k==='B'?'한 자리 지우기':k}">${k==='C'?'지우기':k==='B'?'⌫':k}</button>`).join('')}</div>
                <div class="sz-sec">새 박스 크기</div>
                <div class="sz-grid">${BOX_SIZES.map(sz=>`<button class="${sz===mvSize?'cur':''}" ${szBusy?'disabled':''} onclick="mvSize='${sz}';renderMoveView()">${sz}</button>`).join('')}</div>
                <div id="mvSum"></div>`;
            renderMoveSummary();
        }
        // 요약·버튼만 다시 그린다 (입력칸은 그대로 → 키보드가 닫히지 않게)
        function renderMoveSummary(){
            const el=$('mvSum'); if(!el) return;
            const kn=$('mvKeepNum'), kv=$('mvKeepVal');
            if(kn&&kv){ kv.textContent=mvKeep===''?'숫자를 누르세요':mvKeep+'개'; kn.classList.toggle('empty',mvKeep===''); }
            const keep=mvKeep===''?null:Number(mvKeep);
            const p=movePlan(keep), share=p?p.share:0;
            const prob=p?moveProblem(p):'카드를 찾을 수 없습니다';
            const nb=mvNext!=null?`📦${mvNext}`:'새 박스';
            const valid=p&&keep!=null&&Number.isInteger(keep)&&keep>=0&&keep<=share;
            el.innerHTML=(valid?`<div class="mv-sum">
                    <div class="ln"><span>📦${szBox} 에 담음<small>이 상품</small></span><b>${p.keep}개</b></div>
                    <div class="ln to"><span>${nb} 로 넘어감<small>이 상품 나머지 ${p.curMove}개${p.laterCards?` + 이후 상품 ${p.laterCards}장 ${p.laterQty}개`:''}</small></span><b>${p.total}개</b></div>
                </div>`:'')
                +(prob?`<div class="mv-err">${esc(prob)}</div>`:'')
                +`<div class="sz-actions stick"><button class="btn primary" ${szBusy||prob?'disabled':''} onclick="openMoveConfirm()">박스 생성</button></div>`;
        }
        const PAD_KEYS=['1','2','3','4','5','6','7','8','9','C','0','B'];   // C = 지우기 · B = 한 자리 지우기(⌫)
        function padKey(k){
            if(szBusy) return;
            const r=rows[szIdx]; if(!r) return; const share=shareIn(r,szBox);
            if(k==='C') mvKeep='';
            else if(k==='B') mvKeep=mvKeep.slice(0,-1);
            else{
                const v=Number((mvKeep==='0'?'':mvKeep)+k);
                if(v>share){ const n=$('mvKeepNum'); if(n){ n.classList.remove('shake'); void n.offsetWidth; n.classList.add('shake'); } playWarn(); toast(`이 박스 몫은 ${share}개까지예요`); return; }
                mvKeep=String(v);
            }
            renderMoveSummary();
        }
        function openMoveConfirm(){
            const keep=mvKeep===''?null:Number(mvKeep), p=movePlan(keep);
            if(!p||moveProblem(p)){ renderMoveSummary(); return; }
            $('mvText').innerHTML=`<b>${esc(curOrder)}</b> 발주서 <b>📦${mvNext} (${esc(mvSize)})</b> 박스를 만들고 넘어갈까요?`;
            $('mvCodes').innerHTML=`<div><span>📦${szBox} 에 남음 · 이 상품</span><span class="c"><b>${p.keep}개</b></span></div>
                <div><span>📦${mvNext} 로 이동 · ${p.cards.length}장</span><span class="c"><b>${p.total}개</b></span></div>
                <div><span>📦${szBox} 라벨</span><span class="c">다시 출력</span></div>`;
            $('mvGo').disabled=false; $('mvCancel').disabled=false; $('mvGo').textContent='넘어가기';
            $('mvBack').classList.add('show');
        }
        function closeMoveConfirm(){ if(szBusy) return; $('mvBack').classList.remove('show'); }
        async function doMoveBox(){
            if(szBusy) return;
            const keep=mvKeep===''?null:Number(mvKeep), p=movePlan(keep);
            if(!p||moveProblem(p)){ closeMoveConfirm(); renderMoveSummary(); return; }
            const fromBoxNo=szBox, order=curOrder;
            szBusy=true; $('mvGo').disabled=true; $('mvCancel').disabled=true; $('mvGo').textContent='만드는 중…'; renderMoveView();
            try{
                const res=await fetch('/api/inbound/mobile-box-split',{method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({orderNumber:order,fromBoxNo,boxSize:mvSize,worker:worker(),moves:p.moves,cards:p.cards,expectBoxNo:mvNext})});
                const d=await res.json();
                if(res.status===409&&d.nextBoxNo!=null){ mvNext=d.nextBoxNo; throw new Error(d.error); }
                if(!res.ok) throw new Error(d.error||'박스 이동 실패');
                ordersCache.clear();   // 목록에 새 박스 줄이 생긴다
                szBusy=false; $('mvBack').classList.remove('show'); closeSizeSheet();
                playOk();
                toast(`📦${fromBoxNo} → 📦${d.newBoxNo} (${d.boxSize}) ${d.movedQty}개 이동 · 📦${fromBoxNo} 라벨을 다시 출력하세요`);
                await startOrder(`${order}-${d.newBoxNo}`);   // 만든 박스 카드로 바로
            }catch(e){
                szBusy=false; $('mvBack').classList.remove('show');
                playWarn(); toast('박스 이동 실패: '+e.message);
                if(szBox!=null) renderSizeSheet();
            }
        }
        async function changeBoxSize(){
            if(szBusy||szBox==null) return;
            const boxNo=szBox, prev=sizeOfBox(boxNo), size=szPick;
            if(!size||size===prev) return;
            szBusy=true; renderSizeSheet();
            try{
                const res=await fetch('/api/inbound/mobile-box-size',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderNumber:curOrder,boxNo,boxSize:size,worker:worker()})});
                const d=await res.json(); if(!res.ok) throw new Error(d.error||'변경 실패');
                // 화면의 같은 박스를 전부 새 크기로: 카드 칩(rows), 목록(orders), 덱 제목
                for(const r of rows) for(const b of (r.boxes||[])) if(b.boxNo===boxNo) b.boxSize=d.boxSize;
                for(const o of orders) if(o.orderNumber===curOrder&&o.boxNo===boxNo) o.boxSize=d.boxSize;
                szBusy=false; closeSizeSheet();
                const keep=idx; renderDeck(); goTo(keep,true);
                const t=$('deckTitle').querySelector('b'); if(t) t.innerHTML=`${esc(curOrder)}${boxTag()}`;
                playOk();
                toast(`📦${boxNo} ${d.prevSize||'크기 없음'} → ${d.boxSize} · 박스 라벨을 다시 출력하세요`);
            }catch(e){ szBusy=false; playWarn(); toast('박스 크기 변경 실패: '+e.message); if(szBox!=null) renderSizeSheet(); }
        }

        // ════════ 카메라 바코드 ════════
        //   안드로이드 크롬: 내장 BarcodeDetector (빠름). 아이폰(사파리·크롬 모두 WebKit)은 이 API 가 없어 ZXing 라이브러리를 그때 내려받아 쓴다 (2026-10-15).
        //   둘 다 HTTPS + 카메라 권한 필요. 인식한 값은 발주번호 또는 박스 라벨(발주번호-박스번호)이라 startOrder 에 그대로 넘긴다.
        let camStream=null, camTimer=null, zxReader=null, zxLoading=null;
        const CAM_FORMATS=['code_128','code_39','ean_13','qr_code','itf'];
        // 뒷카메라 + 높은 해상도 — 1D(code128) 바코드는 저해상도 프레임에서 잘 안 읽힌다 (아이폰에서 인식 안 되던 문제, 2026-10-15)
        const CAM_VIDEO={facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}};
        // 내장 BarcodeDetector 를 믿어도 되는지 — 있고, code_128 을 지원한다고 답해야 한다. (WebKit 은 API 만 있고 1D 를 못 읽는 경우가 있다)
        async function nativeDetectorOk(){
            try{
                if(!('BarcodeDetector' in window)) return false;
                const fm=await BarcodeDetector.getSupportedFormats();
                return Array.isArray(fm) && fm.includes('code_128');
            }catch(_){ return false; }
        }
        function loadZXing(){
            if(window.ZXing) return Promise.resolve();
            if(zxLoading) return zxLoading;
            zxLoading=new Promise((resolve,reject)=>{
                const sc=document.createElement('script');
                sc.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
                sc.onload=()=>resolve(); sc.onerror=()=>{ zxLoading=null; reject(new Error('바코드 인식 모듈을 내려받지 못했습니다 (인터넷 확인)')); };
                document.head.appendChild(sc);
            });
            return zxLoading;
        }
        function onCamCode(raw){
            if(!parseOrderCode(raw)) return false;          // 발주번호 형식이 아니면 계속 찾는다
            closeCam(); goOrderInput(raw); return true;   // 박스 라벨 → 바로 진행 · 발주번호 → 목록 검색 (2026-10-21)
        }
        async function openCam(){
            const v=$('camVideo');
            try{
                if(await nativeDetectorOk()){
                    camStream=await navigator.mediaDevices.getUserMedia({video:CAM_VIDEO,audio:false});
                    v.srcObject=camStream; $('camBack').classList.add('show'); $('camHint').textContent='발주서 바코드를 맞춰 주세요'; await v.play();
                    const det=new BarcodeDetector({formats:CAM_FORMATS});
                    let fails=0;
                    camTimer=setInterval(async()=>{
                        try{ const codes=await det.detect(v); fails=0; for(const c of codes){ if(onCamCode(c.rawValue)) return; } }
                        catch(_){ if(++fails>=5){ clearInterval(camTimer); camTimer=null; openCamZXing(v); } }   // detect 가 계속 실패 → ZXing 으로 넘어간다
                    },300);
                    return;
                }
                await openCamZXing(v);
            }catch(e){ stopCam(); toast('카메라를 열 수 없습니다: '+(e&&e.message||e)); }
        }
        // 아이폰(WebKit) 등 내장 인식기가 없거나 1D 를 못 읽는 경우: ZXing
        async function openCamZXing(v){
            try{
                if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; v.srcObject=null; }
                $('camBack').classList.add('show'); $('camHint').textContent='인식 모듈 준비 중…';
                await loadZXing();
                const Z=window.ZXing;
                const hints=new Map();
                hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.QR_CODE,Z.BarcodeFormat.ITF]);
                hints.set(Z.DecodeHintType.TRY_HARDER,true);
                zxReader=new Z.BrowserMultiFormatReader(hints, 250);
                $('camHint').textContent='바코드를 화면 가운데에 가로로 맞춰 주세요';
                await zxReader.decodeFromConstraints({video:CAM_VIDEO,audio:false}, v, (result,err)=>{
                    if(result && zxReader) onCamCode(result.getText());
                    // err 는 "이 프레임엔 바코드 없음" 이 대부분 — 무시하고 계속
                });
            }catch(e){ stopCam(); toast('카메라를 열 수 없습니다: '+(e&&e.message||e)); }
        }
        function stopCam(){
            clearInterval(camTimer); camTimer=null;
            if(zxReader){ try{ zxReader.reset(); }catch(_){} zxReader=null; }
            if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
            const v=$('camVideo'); if(v&&v.srcObject){ try{ v.srcObject.getTracks().forEach(t=>t.stop()); }catch(_){} v.srcObject=null; }
            $('camBack').classList.remove('show');
        }
        function closeCam(){ stopCam(); }

        // ── 효과음 (가상확정·출고스캔과 같은 방식) ──
        function playOk(){ try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(659.25,ac.currentTime); o.frequency.setValueAtTime(880,ac.currentTime+.12); o.connect(g); g.connect(ac.destination); g.gain.value=.4; o.start(); setTimeout(()=>o.stop(),260); }catch(e){} }
        function playNone(){ try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.type='triangle'; o.frequency.setValueAtTime(440,ac.currentTime); o.frequency.setValueAtTime(330,ac.currentTime+.12); o.connect(g); g.connect(ac.destination); g.gain.value=.4; o.start(); setTimeout(()=>o.stop(),260); }catch(e){} }
        function playWarn(){ try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.type='square'; o.frequency.value=700; o.connect(g); g.connect(ac.destination); g.gain.value=.5; o.start(); setTimeout(()=>o.stop(),350); }catch(e){} }

        // 화면 회전·주소창 변화로 폭이 바뀌면 현재 카드에 다시 맞춘다
        window.addEventListener('resize',()=>{ if($('s3').classList.contains('on')) goTo(idx,true); });
        init();
    </script>
</body>
</html>
