<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F4F2EE">
    <title>모바일 입고</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           모바일 입고 — 폰(390px) 전용. 종이 [인쇄] 대신 출고리스트를 카드 1장씩 넘기며 [스캔](찾음) / [없음]
           1화면 이름 + 연/월/입고코드 휠  →  2화면 발주서 입력·카메라·목록  →  3화면 카드 스와이프 (한 화면에 딱 맞춤)
           디자인: 클로드 디자인 시안(2026-10-15) — 따뜻한 회백 바탕 · 코랄 주색 · 검정 칩 · 파란 바코드
           사이트 헤더는 폭이 안 맞아 넣지 않는다 (홈 링크만)
           ============================================================ */
        :root{
            --bg:#F4F2EE; --card:#FFFFFF; --ink:#17161A; --ink2:#4B4A52; --muted:#6B6A72; --muted2:#9A98A0; --faint:#B9B7BE; --line:#E6E3DD; --fill:#EFEDE8;
            --coral:#E4432A; --coral-dark:#B8321C; --coral-tint:#FBE6E1; --green:#15803D; --green-dark:#0F6E46; --green-tint:#DDF2E6; --green-bg:#F7FBF8;
            --red-tint:#FFF8F6; --red-line:#F2CFC8; --blue:#1D4ED8; --blue-tint:#E8EEFF;
            --wheel-h:40px;
        }
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        html,body{height:100%;}
        body{margin:0;font-family:"Noto Sans KR","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
        button,input{font-family:inherit;}
        svg{flex:none;}
        .screen{display:none;min-height:100dvh;flex-direction:column;}
        .screen.on{display:flex;}

        /* 상단 바 */
        .top{flex:none;height:56px;display:flex;align-items:center;gap:6px;padding:0 10px 0 6px;}
        .top .back{height:40px;padding:0 10px;border:0;background:transparent;font-size:15px;font-weight:700;color:var(--coral);cursor:pointer;display:inline-flex;align-items:center;gap:2px;border-radius:10px;text-decoration:none;}
        .top .ttl{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;overflow:hidden;}
        .top .ttl b{font-size:18px;font-weight:900;letter-spacing:.01em;white-space:nowrap;}
        .top .ttl small{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .top .ico{width:40px;height:40px;border:0;background:transparent;border-radius:10px;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;}
        .top .ico:active{background:var(--fill);}
        .top .pill{margin-left:auto;font-size:12px;font-weight:700;color:var(--coral);background:var(--coral-tint);padding:4px 10px;border-radius:999px;white-space:nowrap;}

        /* 공통 버튼 */
        .btn{height:58px;width:100%;border:1.5px solid var(--line);background:#fff;color:var(--ink2);border-radius:16px;font-size:18px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em;text-decoration:none;}
        .btn.primary{background:var(--coral);color:#fff;border-color:var(--coral);}
        .btn.primary:active{background:var(--coral-dark);}
        .btn.ghost{background:transparent;border-color:transparent;color:var(--muted);height:48px;font-size:15px;font-weight:700;}
        .btn:disabled{opacity:.45;}

        /* ── 1화면 ── */
        .setup{flex:1;display:flex;flex-direction:column;gap:22px;padding:10px 20px 0;}
        .hero h1{margin:0;font-size:26px;font-weight:900;line-height:1.2;letter-spacing:-.02em;}
        .hero p{margin:6px 0 0;font-size:13.5px;color:var(--muted);line-height:1.5;}
        .field{display:flex;flex-direction:column;gap:8px;}
        .field label,.field .lab{font-size:12.5px;font-weight:700;color:var(--muted);}
        .field .labrow{display:flex;align-items:baseline;justify-content:space-between;}
        .field .labrow span{font-size:12px;color:var(--muted2);font-weight:500;}
        .field input{height:54px;padding:0 16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-size:19px;font-weight:700;color:var(--ink);outline:none;width:100%;}
        .field input:focus{border-color:var(--coral);box-shadow:0 0 0 4px rgba(228,67,42,.12);}
        .hintcard{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border:1.5px solid var(--line);border-radius:12px;font-size:13px;color:var(--muted);}
        .hintcard b{color:var(--ink);font-weight:700;font-size:13.5px;}
        .hintcard svg{color:var(--coral);}
        .setup-foot{flex:none;padding:12px 20px 28px;}

        /* 휠 피커 (아이폰 시계처럼 세로 스크롤 스냅) */
        .wheels{position:relative;display:flex;gap:4px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:6px;height:calc(var(--wheel-h) * 5 + 12px);}
        .wheels::before{content:"";position:absolute;left:8px;right:8px;top:50%;height:48px;transform:translateY(-50%);background:var(--coral-tint);border-radius:12px;pointer-events:none;}
        .wheels::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;border-radius:16px;pointer-events:none;
            background:linear-gradient(#fff 0, rgba(255,255,255,0) 38%, rgba(255,255,255,0) 62%, #fff 100%);}
        .wheel{flex:1;min-width:0;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;-ms-overflow-style:none;position:relative;z-index:1;padding:calc(var(--wheel-h) * 2) 0;}
        .wheel::-webkit-scrollbar{display:none;}
        .wheel.code{flex:1.3;}
        .wheel div{height:var(--wheel-h);display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:16px;font-weight:700;color:#A9A6AF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;transition:color .15s;}
        .wheel div.sel{color:var(--ink);font-size:21px;font-weight:900;}
        .wheel.code div.sel{color:var(--coral);font-size:22px;letter-spacing:.02em;}
        .wheel div.empty{color:#D5D2CC;font-weight:500;font-size:14px;}

        /* ── 2화면 — 발주서 ── */
        .pick{flex:1;display:flex;flex-direction:column;gap:10px;padding:6px 16px 24px;}
        .scanrow{display:flex;gap:8px;}
        .scanrow input{flex:1;min-width:0;height:58px;padding:0 16px;border:2px solid var(--ink);border-radius:16px;background:#fff;font-size:22px;font-weight:900;color:var(--ink);outline:none;letter-spacing:.02em;}
        .scanrow input::placeholder{font-size:14px;font-weight:600;color:#B4B2B8;letter-spacing:0;}
        .scanrow input:focus{border-color:var(--coral);}
        .scanrow .cam{width:58px;height:58px;border:0;background:var(--ink);color:#fff;border-radius:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
        .olist{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
        .olist .sub{display:flex;align-items:center;justify-content:space-between;padding:0 2px;font-size:13px;font-weight:700;color:var(--muted);}
        .olist .sub b{color:var(--ink);}
        .olist .sub button{border:0;background:transparent;color:var(--coral);font-weight:800;font-size:13px;cursor:pointer;padding:4px 0 4px 6px;display:inline-flex;align-items:center;gap:2px;}
        .orow{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;}
        .orow:active{background:#FBFAF8;}
        .orow.done{opacity:.85;background:var(--green-bg);border-color:#CDE8D8;}
        .orow.miss{opacity:.85;border-color:var(--red-line);}
        .orow .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
        .orow .no{font-size:19px;font-weight:900;letter-spacing:.01em;color:var(--ink);}
        .orow.done .no,.orow.miss .no{color:var(--ink2);}
        .orow .meta{font-size:12.5px;color:var(--muted);font-weight:500;}
        .orow .no .dash{margin:0 1px;color:var(--ink2);}
        .orow .no .bx{display:inline-block;margin-left:7px;padding:2px 9px;border-radius:999px;background:#EEEDFE;color:#3C3489;font-size:13.5px;font-weight:800;vertical-align:middle;letter-spacing:0;}
        .orow .no .bx.none{background:var(--fill);color:var(--muted);}
        .orow .prog{font-size:14px;font-weight:800;padding:6px 12px;border-radius:999px;background:var(--fill);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
        .orow .prog.part{background:var(--coral-tint);color:var(--coral-dark);}
        .orow .prog.ok{background:var(--green-tint);color:var(--green-dark);font-size:13.5px;}
        .orow .prog.miss{background:var(--coral-tint);color:var(--coral-dark);font-size:13px;}
        .empty{padding:36px 12px;text-align:center;color:var(--muted2);font-size:14px;line-height:1.6;}

        /* ── 3화면 — 카드 덱 (상단바 + 진행 + 카드 + 버튼 = 100dvh) ── */
        #s3.on{height:100dvh;overflow:hidden;}
        .prog-row{flex:none;display:flex;align-items:center;gap:10px;padding:0 16px 8px;}
        .prog-row .bar{flex:1;height:6px;border-radius:999px;background:var(--line);overflow:hidden;}
        .prog-row .bar i{display:block;height:6px;background:var(--coral);border-radius:999px;transition:width .25s;}
        .prog-row .bar i.full{background:var(--green);}
        .prog-row .txt{font-size:12.5px;font-weight:800;color:var(--muted);white-space:nowrap;}
        .prog-row .txt span{color:var(--faint);font-weight:500;}
        .prog-row .txt.full{color:var(--green);}
        .deck{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;}
        .deck::-webkit-scrollbar{display:none;}
        .cardw{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;padding:0 12px;overflow:hidden;display:flex;flex-direction:column;}
        .card{flex:1;min-height:0;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:12px 16px 12px;display:flex;flex-direction:column;gap:9px;overflow:hidden;position:relative;}
        .card.found{background:var(--green-bg);border:2px solid var(--green);}
        .card.missing{background:var(--red-tint);border:2px solid var(--coral-dark);}
        .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--muted);flex:none;}
        .meta .batch{background:var(--coral-tint);color:var(--coral-dark);border-radius:7px;padding:2px 8px;}
        .meta .sep{color:#D5D2CC;}
        /* 꺼내는 곳(검정 칩) → 담는 곳(연회색 칩, 오른쪽 끝) */
        .boxrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;}
        .chip{display:inline-flex;align-items:center;gap:8px;background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 14px;font-size:19px;font-weight:900;letter-spacing:.01em;white-space:nowrap;}
        .chip.src{background:var(--ink);color:#fff;}
        .chip.none{color:var(--muted2);font-size:15px;font-weight:700;}
        .boxrow .arrow{color:var(--muted2);}
        .boxrow .dst{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;min-width:0;}
        .thumb{width:100%;flex:1 1 0;min-height:40px;border-radius:16px;background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;color:var(--muted2);font-size:13px;font-weight:700;}
        .thumb img{width:100%;height:100%;object-fit:contain;background:#fff;}
        .pname{flex:none;display:flex;flex-direction:column;gap:4px;}
        .pname .nm{font-size:16px;font-weight:700;line-height:1.35;color:var(--ink);word-break:break-word;}
        .name-badge{display:inline-block;background:var(--blue-tint);color:var(--blue);border-radius:6px;padding:0 6px;font-weight:800;white-space:nowrap;}
        .bc{color:var(--blue);font-size:17px;font-weight:900;letter-spacing:.04em;font-variant-numeric:tabular-nums;}
        .qty{display:flex;align-items:baseline;justify-content:center;gap:10px;flex:none;}
        .qty .k{font-size:14px;font-weight:700;color:var(--muted);}
        .qty .v{font-size:50px;font-weight:900;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
        .qty .u{font-size:18px;font-weight:800;color:var(--muted);}
        .band{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:14px;padding:9px 12px 9px 14px;color:#fff;}
        .band.found{background:var(--green);}
        .band.missing{background:var(--coral-dark);}
        .band .l{display:flex;align-items:center;gap:8px;min-width:0;}
        .band .l b{font-size:16px;font-weight:900;white-space:nowrap;}
        .band .l small{font-size:12.5px;font-weight:600;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .band button{height:34px;padding:0 12px;border:1.5px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:9px;font-size:13px;font-weight:800;cursor:pointer;flex:none;}
        /* 완료 카드 */
        .card.end{align-items:center;padding:28px 20px 20px;gap:18px;}
        .card.end .ring{width:84px;height:84px;border-radius:50%;background:var(--green-tint);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none;}
        .card.end .ring.left{background:var(--coral-tint);color:var(--coral);}
        .card.end h2{margin:0;font-size:24px;font-weight:900;letter-spacing:-.02em;text-align:center;}
        .card.end p{margin:4px 0 0;font-size:13.5px;color:var(--muted);line-height:1.5;text-align:center;}
        .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;flex:none;}
        .tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 8px;border-radius:14px;background:var(--bg);}
        .tile .k{font-size:12px;font-weight:700;color:var(--muted);}
        .tile .v{font-size:30px;font-weight:900;line-height:1.1;color:var(--ink);}
        .tile.ok{background:var(--green-tint);} .tile.ok .k,.tile.ok .v{color:var(--green-dark);}
        .tile.miss{background:var(--coral-tint);} .tile.miss .k,.tile.miss .v{color:var(--coral-dark);}
        .misslist{width:100%;display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;}
        .misslist .lab{font-size:12.5px;font-weight:700;color:var(--muted);padding:0 2px;}
        .missrow{display:flex;align-items:center;gap:12px;border:1.5px solid var(--red-line);background:var(--red-tint);border-radius:14px;padding:10px 12px;}
        .missrow .bx{width:40px;height:40px;flex:none;border-radius:10px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;}
        .missrow .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
        .missrow .n{font-size:14px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .missrow .m{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--coral-dark);}
        .missrow .m .bc{font-size:12px;}
        .end-foot{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:6px;flex:none;}

        /* 하단 버튼 */
        .bottom{flex:none;display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg);}
        .bottom .act{height:64px;border-radius:18px;font-size:20px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s;}
        .bottom .none{flex:1;border:2px solid var(--line);background:#fff;color:var(--ink2);}
        .bottom .none:active{background:var(--fill);}
        .bottom .scan{flex:1.6;border:0;background:var(--coral);color:#fff;font-size:21px;}
        .bottom .scan:active{background:var(--coral-dark);}
        .bottom .act.dim{opacity:.5;}
        .bottom .act:disabled{opacity:.35;}

        /* 카메라 */
        .cam-back{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:50;}
        .cam-back.show{display:flex;}
        .cam-back video{flex:1;width:100%;object-fit:cover;}
        .cam-back .guide{position:absolute;left:8%;right:8%;top:40%;height:20%;border:2px solid rgba(255,255,255,.85);border-radius:12px;pointer-events:none;}
        .cam-back .cam-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:#fff;font-weight:700;font-size:14px;text-shadow:0 1px 2px rgba(0,0,0,.6);}
        .cam-back .cam-top button{height:40px;padding:0 14px;border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;}

        #toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;line-height:1.5;box-shadow:0 8px 24px rgba(23,22,26,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90vw;white-space:pre-line;text-align:center;}
        #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    </style>
</head>
<body>
    <!-- 공용 아이콘 (inline svg, 이모지 대신) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></symbol>
            <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></symbol>
            <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></symbol>
            <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
            <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
            <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></symbol>
            <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
            <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M11 8v8M14 8v8M17 8v8"/></symbol>
            <symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 15l-5-5-8 8"/></symbol>
            <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
        </defs>
    </svg>

    <!-- ───── 1화면: 이름 + 연/월/입고코드 ───── -->
    <section class="screen on" id="s1">
        <div class="top" style="padding:0 16px;gap:10px">
            <a href="/" class="ico" title="홈" aria-label="홈" style="width:36px;height:36px"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-home"/></svg></a>
            <div class="ttl"><b style="font-size:17px;letter-spacing:-.02em">모바일 입고</b></div>
            <span class="pill">아이엠몽 로켓</span>
        </div>
        <div class="setup">
            <div class="hero">
                <h1>오늘 찾을<br>입고코드를 고르세요</h1>
                <p>이름과 입고코드는 이 폰에 기억됩니다.</p>
            </div>
            <div class="field">
                <label for="worker">본인 이름</label>
                <input id="worker" type="text" autocomplete="off" placeholder="예) 영희" maxlength="20" enterkeyhint="done">
            </div>
            <div class="field">
                <div class="labrow"><span class="lab">입고정리 · 연도 / 월 / 입고코드</span><span>위아래로 돌려 선택</span></div>
                <div class="wheels">
                    <div class="wheel" id="wYear"></div>
                    <div class="wheel" id="wMonth"></div>
                    <div class="wheel code" id="wCode"></div>
                </div>
                <div class="hintcard" id="codeHint"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-box"/></svg><span>입고코드를 선택하세요.</span></div>
            </div>
        </div>
        <div class="setup-foot">
            <button class="btn primary" id="nextBtn" onclick="goPick()">다음 <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><use href="#i-arrow"/></svg></button>
        </div>
    </section>

    <!-- ───── 2화면: 발주서 입력 / 카메라 / 목록 ───── -->
    <section class="screen" id="s2">
        <div class="top">
            <button class="back" onclick="show('s1')"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chev-l"/></svg>설정</button>
            <div class="ttl" id="pickTitle"></div>
            <button class="ico" onclick="loadOrders()" title="새로고침" aria-label="새로고침"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-refresh"/></svg></button>
        </div>
        <div class="pick">
            <div class="scanrow">
                <input id="orderInput" type="text" inputmode="numeric" autocomplete="off" placeholder="발주번호 입력 또는 카메라 스캔" enterkeyhint="go" aria-label="발주번호">
                <button class="cam" onclick="openCam()" title="카메라로 바코드 스캔" aria-label="카메라로 바코드 스캔"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-scan"/></svg></button>
            </div>
            <button class="btn primary" style="height:54px;font-size:17px" onclick="startOrder(document.getElementById('orderInput').value)">진행 <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><use href="#i-arrow"/></svg></button>
            <div class="olist">
                <div class="sub"><span id="olistSub">발주서 목록</span><button onclick="startNextOrder()">다음 미처리 박스<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chev-r"/></svg></button></div>
                <div id="olist" style="display:flex;flex-direction:column;gap:8px"><div class="empty">불러오는 중…</div></div>
            </div>
        </div>
    </section>

    <!-- ───── 3화면: 카드 스와이프 ───── -->
    <section class="screen" id="s3">
        <div class="top">
            <button class="back" onclick="backToPick()"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chev-l"/></svg>목록</button>
            <div class="ttl" id="deckTitle"></div>
            <button class="ico" onclick="reloadDeck()" title="새로고침" aria-label="새로고침"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-refresh"/></svg></button>
        </div>
        <div class="prog-row"><div class="bar"><i id="progBar" style="width:0"></i></div><div class="txt" id="dots"></div></div>
        <div class="deck" id="deck"></div>
        <div class="bottom">
            <button class="act none" id="btnNone" onclick="mark('missing')">없음</button>
            <button class="act scan" id="btnScan" onclick="mark('found')"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><use href="#i-check"/></svg>스캔</button>
        </div>
    </section>

    <!-- 카메라 바코드 스캔 — 안드로이드 크롬은 내장 BarcodeDetector, 아이폰(사파리·크롬 등 WebKit)은 ZXing 라이브러리로 인식 -->
    <div class="cam-back" id="camBack">
        <video id="camVideo" playsinline muted autoplay></video>
        <div class="guide"></div>
        <div class="cam-top"><span id="camHint">발주서 바코드를 맞춰 주세요</span><button onclick="closeCam()">닫기</button></div>
    </div>

    <div id="toast"></div>

    <script>
        const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const $=id=>document.getElementById(id);
        const ICON=(id,size,sw)=>`<svg width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${sw||2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#${id}"/></svg>`;
        const LS={worker:'mobileInbound.worker', sel:'mobileInbound.sel'};
        let shipments=[], sel={y:'',m:'',code:''};   // 1화면 휠 선택값 (휠이 보일 때만 바뀐다)
        let active={code:''};                          // [다음] 을 누른 시점의 출고코드 — 2·3화면은 이것만 쓴다
        let orders=[], curOrder=null, rows=[], idx=0;

        // 화면 전환. display:none 이 되면 휠 scrollTop 이 0 으로 초기화되므로(스크롤 이벤트까지 남) 1화면으로 돌아올 때 휠을 선택값에 다시 맞춘다
        function show(id){
            document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); window.scrollTo(0,0);
            if(id==='s1'&&shipments.length) requestAnimationFrame(()=>setupWheels());
        }
        const onS1=()=>$('s1').classList.contains('on');
        let toastTimer;
        function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}
        function worker(){ return $('worker').value.trim(); }
        // 상품명: 첫 콤마 앞 영어+숫자 모델코드 → 파란 배지 (입고정리와 같은 규칙)
        function modelBadge(name){
            const s=String(name==null?'':name); const ci=s.indexOf(',');
            if(ci>0){ const prefix=s.slice(0,ci), rest=s.slice(ci); const m=prefix.match(/(\S+)(\s*)$/);
                if(m){ const t=m[1];
                    if(/^[A-Za-z0-9]+$/.test(t)&&/[A-Za-z]/.test(t)&&/\d/.test(t)){
                        const before=prefix.slice(0, prefix.length-m[0].length);
                        return esc(before)+'<span class="name-badge">'+esc(t)+'</span>'+esc(m[2])+esc(rest); } } }
            return esc(s);
        }
        function ymd(s){ const m=String(s||'').match(/^(\d{4})(\d{2})(\d{2})$/); return m?`${m[1]}-${m[2]}-${m[3]}`:String(s||''); }
        function md(s){ const m=String(s||'').match(/^(\d{4})-?(\d{2})-?(\d{2})$/); return m?`${m[2]}-${m[3]}`:String(s||''); }

        // ════════ 1화면: 휠 피커 ════════
        // 각 휠 = 세로 스크롤 스냅. 항목 높이 40px, 위아래 2칸 패딩이라 가운데 밴드에 오는 항목이 선택값.
        const WH=40;
        function wheelItems(el){ return [...el.children]; }
        function wheelIndex(el){ return Math.max(0, Math.min(el.children.length-1, Math.round(el.scrollTop/WH))); }
        function wheelSet(el,i,instant){ el.scrollTo({top:i*WH, behavior:instant?'auto':'smooth'}); markSel(el,i); }
        function markSel(el,i){ wheelItems(el).forEach((d,j)=>d.classList.toggle('sel',j===i)); }
        function fillWheel(el,list,emptyText){
            el.innerHTML=list.length?list.map(v=>`<div data-v="${esc(v.v)}">${esc(v.t)}</div>`).join(''):`<div class="empty" data-v="">${emptyText||'없음'}</div>`;
        }
        function wheelValue(el){ const d=el.children[wheelIndex(el)]; return d?d.dataset.v:''; }
        // 스크롤이 멈추면 선택 확정 → 아래 휠 갱신
        function bindWheel(el,onChange){
            let t; el.addEventListener('scroll',()=>{ if(!onS1()) return; markSel(el,wheelIndex(el)); clearTimeout(t); t=setTimeout(()=>{ if(onS1()) onChange(wheelValue(el)); },120); },{passive:true});
        }
        function shipDate(s){ return new Date(s.createdAt); }
        function years(){ return [...new Set(shipments.map(s=>shipDate(s).getFullYear()))].sort((a,b)=>b-a).map(String); }
        function months(y){ return [...new Set(shipments.filter(s=>String(shipDate(s).getFullYear())===String(y)).map(s=>shipDate(s).getMonth()+1))].sort((a,b)=>b-a).map(String); }
        function codes(y,m){ return shipments.filter(s=>{const d=shipDate(s);return String(d.getFullYear())===String(y)&&String(d.getMonth()+1)===String(m);}).map(s=>s.shipmentCode); }
        function setupWheels(){
            const ys=years();
            fillWheel($('wYear'), ys.map(v=>({v,t:v+'년'})), '연도 없음');
            let y=ys.includes(sel.y)?sel.y:ys[0]||'';
            wheelSet($('wYear'), Math.max(0,ys.indexOf(y)), true); sel.y=y;
            refillMonths(true); refillCodes(true);
        }
        function refillMonths(instant){
            const ms=months(sel.y);
            fillWheel($('wMonth'), ms.map(v=>({v,t:v+'월'})), '월 없음');
            const m=ms.includes(sel.m)?sel.m:ms[0]||'';
            wheelSet($('wMonth'), Math.max(0,ms.indexOf(m)), instant); sel.m=m;
        }
        function refillCodes(instant){
            const cs=codes(sel.y,sel.m);
            const byCode=new Map(shipments.map(s=>[s.shipmentCode,s]));
            fillWheel($('wCode'), cs.map(v=>({v,t:v})), '입고코드 없음');
            const c=cs.includes(sel.code)?sel.code:cs[0]||'';
            wheelSet($('wCode'), Math.max(0,cs.indexOf(c)), instant); sel.code=c;
            const s=byCode.get(c);
            const d=s?shipDate(s):null;
            $('codeHint').innerHTML=ICON('i-box',18,2)+(s?`<b>${esc(c)}</b><span>아이템 ${s.itemCount}건 · ${d.getMonth()+1}월 ${d.getDate()}일 입고</span>`:'<span>입고코드를 선택하세요.</span>');
            $('nextBtn').disabled=!c;
        }
        bindWheel($('wYear'), v=>{ if(v===sel.y) return; sel.y=v; sel.m=''; sel.code=''; refillMonths(); refillCodes(); });
        bindWheel($('wMonth'), v=>{ if(v===sel.m) return; sel.m=v; sel.code=''; refillCodes(); });
        bindWheel($('wCode'), v=>{ sel.code=v; refillCodes(true); });

        async function init(){
            try{ $('worker').value=localStorage.getItem(LS.worker)||''; const s=JSON.parse(localStorage.getItem(LS.sel)||'{}'); if(s&&typeof s==='object') sel={...sel,...s}; }catch(_){}
            try{
                const res=await fetch('/api/inbound/shipments'); shipments=await res.json();
                if(!Array.isArray(shipments)) throw new Error('목록 형식 오류');
                setupWheels();
            }catch(e){ toast('입고코드 목록을 불러오지 못했습니다: '+e.message); }
        }
        function goPick(){
            if(!worker()){ toast('본인 이름을 입력하세요.'); $('worker').focus(); return; }
            if(!sel.code){ toast('입고코드를 선택하세요.'); return; }
            try{ localStorage.setItem(LS.worker,worker()); localStorage.setItem(LS.sel,JSON.stringify(sel)); }catch(_){}
            active.code=sel.code;
            $('pickTitle').innerHTML=`<b style="font-size:17px;letter-spacing:-.02em">입고코드 ${esc(active.code)}</b><small>${esc(worker())}</small>`;
            show('s2'); loadOrders();
        }

        // ════════ 2화면: 발주서 ════════
        async function loadOrders(){
            $('olist').innerHTML='<div class="empty">불러오는 중…</div>';
            try{
                const res=await fetch('/api/inbound/mobile-orders?shipmentCode='+encodeURIComponent(active.code));
                const d=await res.json(); if(!res.ok) throw new Error(d.error||'조회 실패');
                orders=d; renderOrders();
            }catch(e){ $('olist').innerHTML=`<div class="empty">${esc(e.message)}</div>`; }
        }
        const isDoneOrder=o=>o.found+o.missing>=o.total;
        // 목록은 (발주서, 가상 박스) 단위 — 박스 라벨(발주번호-박스번호)을 박스 단위로 뽑아 찾으므로 (2026-10-15). 가상 박스에 안 잡힌 행은 "박스 미정" 줄(-0)
        const orderKey=o=>o.boxNo!=null?`${o.orderNumber}-${o.boxNo}`:`${o.orderNumber}-0`;
        function renderOrders(){
            const left=orders.filter(o=>!isDoneOrder(o)).length, nOrders=new Set(orders.map(o=>o.orderNumber)).size;
            $('olistSub').innerHTML=`박스 ${orders.length}개 · 발주서 ${nOrders}건 · <b>남음 ${left}</b>`;
            if(!orders.length){ $('olist').innerHTML='<div class="empty">이 입고코드에는 출고리스트(배정)가 없습니다.<br>PC 입고정리에서 [출고준비]를 먼저 하세요.</div>'; return; }
            $('olist').innerHTML=orders.map(o=>{
                const done=isDoneOrder(o), n=o.found+o.missing;
                const rowCls=done?(o.missing?'miss':'done'):'';
                const pill=done
                    ? (o.missing?`<span class="prog miss">찾음 ${o.found} · 없음 ${o.missing}</span>`:`<span class="prog ok">${ICON('i-check',15,3)}완료</span>`)
                    : `<span class="prog ${n>0?'part':''}">${n} / ${o.total}</span>`;
                // 큰 글자 = 박스 라벨에 찍힌 그대로 "발주번호-박스번호" (라벨과 같은 모양이어야 찾기 쉽다, 2026-10-15). 배지는 박스 크기
                const bx=o.boxNo!=null?`<span class="bx">📦 ${esc(o.boxSize||'')}</span>`:'<span class="bx none">박스 미정</span>';
                return `<div class="orow ${rowCls}" onclick="startOrder('${esc(orderKey(o))}')">
                    <div class="body"><div class="no">${esc(o.orderNumber)}${o.boxNo!=null?`<span class="dash">-</span>${o.boxNo}`:''}${bx}</div>
                    <div class="meta">${o.batch}회차 · ${esc(o.center)||'-'} · ${esc(md(o.shippingDate))||'-'}</div></div>${pill}</div>`;
            }).join('');
        }
        // "144287071-1" (박스 라벨) → 발주번호 + 박스번호 / "144287071" → 발주번호만(전체) / "144287071-0" → 박스 미정(가상 박스에 안 잡힌 행만)
        //   박스번호가 있으면 그 박스에 가상으로 담긴 상품 카드만 본다 (2026-10-15 — 박스 번호를 존중, 이미 찾은 분량은 찾을 필요 없음)
        //   하이픈 없이 "발주번호박스번호" 로 쳐도 된다 (예 1445426222 → 144542622-2, 2026-10-15 현장 요청):
        //     목록(orders)의 발주번호가 앞부분과 같고 뒤에 1~2자리가 남으면 그걸 박스번호로 본다. 목록에 없으면 발주번호를 9자리(쿠팡 발주번호)로 보고 자른다
        function parseOrderCode(raw){
            const s=String(raw||'').replace(/\s+/g,'');
            const m=s.match(/^(\d{5,})-(\d+)$/);
            if(m) return {no:m[1], boxNo:Number(m[2])};
            if(!/^\d{5,}$/.test(s)) return null;
            const known=[...new Set((orders||[]).map(o=>String(o.orderNumber)))];
            if(known.includes(s)) return {no:s, boxNo:null};
            const hit=known.filter(no=>s.startsWith(no) && s.length>no.length && s.length-no.length<=2).sort((a,b)=>b.length-a.length);
            if(hit.length) return {no:hit[0], boxNo:Number(s.slice(hit[0].length))};
            if(s.length>9 && s.length<=11) return {no:s.slice(0,9), boxNo:Number(s.slice(9))};
            return {no:s, boxNo:null};
        }
        function parseOrderNo(raw){ const p=parseOrderCode(raw); return p?p.no:null; }
        let curBox=null;   // 박스 라벨로 들어온 경우의 박스번호 (발주번호만이면 null = 전체 · 0 = 박스 미정)
        const boxTag=()=>curBox==null?'':curBox===0?' · 박스 미정':` · 📦${curBox}`;
        $('orderInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); startOrder($('orderInput').value); } });
        function startNextOrder(){
            const o=orders.find(x=>!isDoneOrder(x));
            if(!o){ toast('남은 박스가 없습니다.'); return; }
            startOrder(orderKey(o));
        }
        async function startOrder(raw){
            const p=parseOrderCode(raw);
            if(!p){ playWarn(); toast('발주번호 형식이 아닙니다: '+String(raw||'').trim()); return; }
            $('orderInput').value='';
            curOrder=p.no; curBox=p.boxNo;
            $('deckTitle').innerHTML=`<b>${esc(p.no)}${boxTag()}</b><small></small>`;
            $('deck').innerHTML='<div class="cardw"><div class="card"><div class="empty">불러오는 중…</div></div></div>';
            show('s3');
            await reloadDeck(true);
        }
        function backToPick(){ stopCam(); show('s2'); loadOrders(); setTimeout(()=>$('orderInput').focus(),50); }

        // ════════ 3화면: 카드 덱 ════════
        async function reloadDeck(first){
            try{
                const res=await fetch(`/api/inbound/mobile-list?shipmentCode=${encodeURIComponent(active.code)}&orderNumber=${encodeURIComponent(curOrder)}${curBox!=null?`&boxNo=${curBox}`:''}`);
                const d=await res.json(); if(!res.ok) throw new Error(d.error||'조회 실패');
                rows=d.rows||[];
                if(!rows.length){
                    playWarn();
                    if(curBox===0) toast(`발주서 ${curOrder} 에 박스 미정 상품이 없습니다. (전부 가상 박스에 잡힘)`);
                    else if(curBox!=null) toast(d.boxExists===false?`발주서 ${curOrder} 에 📦${curBox} 박스가 없습니다.`:`📦${curBox} 에 가상으로 담긴 입고코드 ${active.code} 상품이 없습니다. (이미 찾았거나 다른 입고코드)`);
                    else toast(`입고코드 ${active.code} 에 발주서 ${curOrder} 배정이 없습니다.`);
                    backToPick(); return;
                }
                const h=rows[0];
                $('deckTitle').innerHTML=`<b>${esc(curOrder)}${boxTag()}</b><small>${esc(h.센터)||''} · ${esc(md(h.출고예정일))||''}</small>`;
                renderDeck();
                // 처음 열면 첫 미처리 카드로, 새로고침이면 현재 자리 유지
                const target=first?Math.max(0,rows.findIndex(r=>!r.모바일)):Math.min(idx,rows.length);
                goTo(target<0?rows.length:target, true);
                if(first) playOk();
            }catch(e){ playWarn(); toast(e.message); }
        }
        // 꺼내는 곳(박스명, 검정) → 담는 곳(출고스캔 박스 번호 · 크기, 오른쪽). 서버가 가상으로 담긴 박스만 준다(이미 실제로 담은 분량은 제외).
        //   칩에는 박스 번호·크기만. 담을 개수는 아래 큰 숫자(출고개수)로 보여준다 — 박스가 여럿일 때(발주번호만 입력한 전체 보기)만 칩에 ×n (2026-10-15: 칩의 ×4 와 출고개수 12 가 같이 보여 헷갈림)
        //   박스가 없으면 "직접 스캔"
        function boxRow(r){
            const src=`<span class="chip src" title="중국 입고 박스 ${esc(r.중국번호||'')}">${ICON('i-box',20,2)}${esc(r.박스명)||'-'}</span>`;
            const list=(r.boxes||[]);
            const dst=list.length
                ? list.map(b=>`<span class="chip" title="박스 ${b.boxNo} ${esc(b.boxSize||'')} · 가상 ${b.virtualQty}개 (박스 안 ${b.qty}개)">${ICON('i-box',20,2)}${b.boxNo}${b.boxSize?' · '+esc(b.boxSize):''}${list.length>1?` <small style="font-size:13px;font-weight:700;color:var(--muted)">×${b.virtualQty}</small>`:''}</span>`).join('')
                : `<span class="chip none">${ICON('i-box',18,2)}박스 미정 · 직접 스캔</span>`;
            return `<div class="boxrow">${src}<span class="arrow">${ICON('i-arrow',24,2.5)}</span><div class="dst">${dst}</div></div>`;
        }
        function fmtAt(ts){ if(!ts) return ''; const d=new Date(ts); if(isNaN(d)) return ''; const p=n=>String(n).padStart(2,'0'); return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
        function cardHtml(r,i){
            const st=r.모바일||'';
            const band=st?`<div class="band ${st}"><div class="l">${ICON('i-check',22,3)}<b>${st==='found'?'찾음':'없음'}</b><small>${esc(r.모바일처리자)||''} · ${fmtAt(r.모바일시각)}</small></div><button onclick="clearMark(${i})">취소</button></div>`:'';
            const noimg=ICON('i-img',40,1.6)+'<div>상품 이미지 없음</div>';
            return `<div class="cardw" data-i="${i}"><div class="card ${st}">
                ${band}
                <div class="meta"><span class="batch">${r.회차}회차</span><span>${esc(r.출고코드)}</span><span class="sep">·</span><span>${esc(r.센터)||'-'}</span><span class="sep">·</span><span>${esc(ymd(r.출고예정일))||'-'}</span></div>
                ${boxRow(r)}
                <div class="thumb">${r.img?`<img src="${esc(r.img)}" alt="" loading="lazy" onerror="this.parentNode.innerHTML=NOIMG">`:noimg}</div>
                <div class="pname"><div class="nm">${modelBadge(r.상품명)}</div><span class="bc">${esc(r.바코드)||'-'}</span></div>
                ${qtyRow(r)}
            </div></div>`;
        }
        const NOIMG=ICON('i-img',40,1.6)+'<div>이미지 없음</div>';
        // 출고개수 = 이 카드에서 **지금 담을 개수**. 가상 박스가 잡혀 있으면 그 박스(들) 몫의 합(박스 보기면 그 박스 몫), 아니면 행의 출고개수.
        //   박스 몫이 행의 출고개수보다 작으면(나머지는 이미 실제 포장됐거나 다른 입고코드) 작게 "배정 n" 을 덧붙인다
        function qtyRow(r){
            const list=r.boxes||[], share=list.reduce((s,b)=>s+(Number(b.virtualQty)||0),0);
            const total=Number(r.출고개수)||0, show=list.length?share:total;
            return `<div class="qty"><span class="k">출고개수</span><span class="v">${show}</span><span class="u">개</span>${list.length&&show!==total?`<span class="u" style="font-weight:600">· 배정 ${total}</span>`:''}</div>`;
        }
        function endHtml(){
            const f=rows.filter(r=>r.모바일==='found').length, m=rows.filter(r=>r.모바일==='missing').length, left=rows.length-f-m;
            const miss=rows.filter(r=>r.모바일==='missing');
            return `<div class="cardw" data-i="${rows.length}"><div class="card end">
                <div class="ring ${left?'left':''}">${left?ICON('i-search',40,2.4):ICON('i-check',44,3)}</div>
                <div><h2>${left?`아직 ${left}장 남았습니다`:'이 발주서 끝'}</h2>
                <p>${left?'왼쪽으로 넘겨 남은 카드를 확인하세요.':(m?'못 찾은 상품은 사무실 입고정리 표에 없음으로 보입니다.':`${rows.length}장 모두 처리했습니다.`)}</p></div>
                <div class="tiles"><div class="tile ok"><div class="k">찾음</div><div class="v">${f}</div></div><div class="tile miss"><div class="k">없음</div><div class="v">${m}</div></div><div class="tile"><div class="k">전체</div><div class="v">${rows.length}</div></div></div>
                ${miss.length?`<div class="misslist"><div class="lab">없음으로 표시한 상품</div>${miss.map(r=>`<div class="missrow"><div class="bx">${esc(r.박스명)||'-'}</div><div class="b"><div class="n">${esc(r.상품명)}</div><div class="m"><span class="bc">${esc(r.바코드)}</span><span>${esc(r.출고개수)}개 없음</span></div></div></div>`).join('')}</div>`:''}
                <div class="end-foot">
                    ${left?`<button class="btn" onclick="goTo(firstLeft())">남은 카드로</button>`:''}
                    <button class="btn primary" onclick="backToPick()">다음 발주서 ${ICON('i-arrow',20,2.5)}</button>
                    ${left?'':`<button class="btn ghost" onclick="goTo(0)">카드 다시 보기</button>`}
                </div>
            </div></div>`;
        }
        function renderDeck(){
            $('deck').innerHTML=rows.map(cardHtml).join('')+endHtml();
            updateDots();
        }
        function firstLeft(){ const i=rows.findIndex(r=>!r.모바일); return i<0?rows.length:i; }
        function nextLeft(from){ for(let i=from+1;i<rows.length;i++) if(!rows[i].모바일) return i; return rows.length; }
        function goTo(i,instant){
            idx=Math.max(0,Math.min(rows.length,i));
            const deck=$('deck'); deck.scrollTo({left:idx*deck.clientWidth, behavior:instant?'auto':'smooth'});
            updateDots();
        }
        // 스와이프로 넘긴 뒤 현재 카드 번호 갱신
        let scrollT; $('deck').addEventListener('scroll',()=>{ clearTimeout(scrollT); scrollT=setTimeout(()=>{ const d=$('deck'); idx=Math.round(d.scrollLeft/Math.max(1,d.clientWidth)); updateDots(); },80); },{passive:true});
        function updateDots(){
            const done=rows.filter(r=>r.모바일).length, n=rows.length;
            const onEnd=idx>=n, full=n>0&&done>=n;
            $('dots').className='txt'+(full?' full':'');
            $('dots').innerHTML=full?`${n} / ${n} 완료`:(onEnd?`처리 ${done} / ${n}`:`${idx+1} / ${n} <span>· 처리 ${done}</span>`);
            const bar=$('progBar'); bar.style.width=(n?Math.round(done/n*100):0)+'%'; bar.classList.toggle('full',full);
            $('btnNone').disabled=onEnd; $('btnScan').disabled=onEnd;
            const cur=rows[idx]; const dim=!onEnd&&!!(cur&&cur.모바일);
            $('btnNone').classList.toggle('dim',dim); $('btnScan').classList.toggle('dim',dim);
        }
        // 카드 1장만 다시 그림 (덱 전체를 다시 그리면 스크롤이 튄다)
        function repaint(i){
            const old=$('deck').querySelector(`.cardw[data-i="${i}"]`);
            if(!old) return;
            const tmp=document.createElement('div'); tmp.innerHTML=cardHtml(rows[i],i); old.replaceWith(tmp.firstElementChild);
            const end=$('deck').lastElementChild; if(end){ const t2=document.createElement('div'); t2.innerHTML=endHtml(); end.replaceWith(t2.firstElementChild); }
            updateDots();
        }
        let saving=false;
        async function save(i,status){
            const r=rows[i]; if(!r||saving) return false;
            saving=true;
            const prev={모바일:r.모바일,모바일처리자:r.모바일처리자,모바일시각:r.모바일시각};
            r.모바일=status; r.모바일처리자=status?worker():null; r.모바일시각=status?new Date().toISOString():null;   // 낙관적 반영
            repaint(i);
            try{
                const res=await fetch('/api/inbound/mobile-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({allocId:r.allocId,status,worker:worker()})});
                const d=await res.json(); if(!res.ok) throw new Error(d.error||'저장 실패');
                r.모바일=d.모바일; r.모바일처리자=d.모바일처리자; r.모바일시각=d.모바일시각; repaint(i);
                return true;
            }catch(e){ Object.assign(r,prev); repaint(i); playWarn(); toast('저장 실패: '+e.message); return false; }
            finally{ saving=false; }
        }
        async function mark(status){
            if(idx>=rows.length) return;
            const i=idx;
            if(status==='found') playOk(); else playNone();
            const ok=await save(i,status);
            if(ok) goTo(nextLeft(i));   // 다음 미처리 카드 (없으면 완료 카드)
        }
        async function clearMark(i){ await save(i,null); }

        // ════════ 카메라 바코드 ════════
        //   안드로이드 크롬: 내장 BarcodeDetector (빠름). 아이폰(사파리·크롬 모두 WebKit)은 이 API 가 없어 ZXing 라이브러리를 그때 내려받아 쓴다 (2026-10-15).
        //   둘 다 HTTPS + 카메라 권한 필요. 인식한 값은 발주번호 또는 박스 라벨(발주번호-박스번호)이라 startOrder 에 그대로 넘긴다.
        let camStream=null, camTimer=null, zxReader=null, zxLoading=null;
        const CAM_FORMATS=['code_128','code_39','ean_13','qr_code','itf'];
        // 뒷카메라 + 높은 해상도 — 1D(code128) 바코드는 저해상도 프레임에서 잘 안 읽힌다 (아이폰에서 인식 안 되던 문제, 2026-10-15)
        const CAM_VIDEO={facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}};
        // 내장 BarcodeDetector 를 믿어도 되는지 — 있고, code_128 을 지원한다고 답해야 한다. (WebKit 은 API 만 있고 1D 를 못 읽는 경우가 있다)
        async function nativeDetectorOk(){
            try{
                if(!('BarcodeDetector' in window)) return false;
                const fm=await BarcodeDetector.getSupportedFormats();
                return Array.isArray(fm) && fm.includes('code_128');
            }catch(_){ return false; }
        }
        function loadZXing(){
            if(window.ZXing) return Promise.resolve();
            if(zxLoading) return zxLoading;
            zxLoading=new Promise((resolve,reject)=>{
                const sc=document.createElement('script');
                sc.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
                sc.onload=()=>resolve(); sc.onerror=()=>{ zxLoading=null; reject(new Error('바코드 인식 모듈을 내려받지 못했습니다 (인터넷 확인)')); };
                document.head.appendChild(sc);
            });
            return zxLoading;
        }
        function onCamCode(raw){
            if(!parseOrderCode(raw)) return false;          // 발주번호 형식이 아니면 계속 찾는다
            closeCam(); playOk(); startOrder(raw); return true;
        }
        async function openCam(){
            const v=$('camVideo');
            try{
                if(await nativeDetectorOk()){
                    camStream=await navigator.mediaDevices.getUserMedia({video:CAM_VIDEO,audio:false});
                    v.srcObject=camStream; $('camBack').classList.add('show'); $('camHint').textContent='발주서 바코드를 맞춰 주세요'; await v.play();
                    const det=new BarcodeDetector({formats:CAM_FORMATS});
                    let fails=0;
                    camTimer=setInterval(async()=>{
                        try{ const codes=await det.detect(v); fails=0; for(const c of codes){ if(onCamCode(c.rawValue)) return; } }
                        catch(_){ if(++fails>=5){ clearInterval(camTimer); camTimer=null; openCamZXing(v); } }   // detect 가 계속 실패 → ZXing 으로 넘어간다
                    },300);
                    return;
                }
                await openCamZXing(v);
            }catch(e){ stopCam(); toast('카메라를 열 수 없습니다: '+(e&&e.message||e)); }
        }
        // 아이폰(WebKit) 등 내장 인식기가 없거나 1D 를 못 읽는 경우: ZXing
        async function openCamZXing(v){
            try{
                if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; v.srcObject=null; }
                $('camBack').classList.add('show'); $('camHint').textContent='인식 모듈 준비 중…';
                await loadZXing();
                const Z=window.ZXing;
                const hints=new Map();
                hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.QR_CODE,Z.BarcodeFormat.ITF]);
                hints.set(Z.DecodeHintType.TRY_HARDER,true);
                zxReader=new Z.BrowserMultiFormatReader(hints, 250);
                $('camHint').textContent='바코드를 화면 가운데에 가로로 맞춰 주세요';
                await zxReader.decodeFromConstraints({video:CAM_VIDEO,audio:false}, v, (result,err)=>{
                    if(result && zxReader) onCamCode(result.getText());
                    // err 는 "이 프레임엔 바코드 없음" 이 대부분 — 무시하고 계속
                });
            }catch(e){ stopCam(); toast('카메라를 열 수 없습니다: '+(e&&e.message||e)); }
        }
        function stopCam(){
            clearInterval(camTimer); camTimer=null;
            if(zxReader){ try{ zxReader.reset(); }catch(_){} zxReader=null; }
            if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
            const v=$('camVideo'); if(v&&v.srcObject){ try{ v.srcObject.getTracks().forEach(t=>t.stop()); }catch(_){} v.srcObject=null; }
            $('camBack').classList.remove('show');
        }
        function closeCam(){ stopCam(); }

        // ── 효과음 (가상확정·출고스캔과 같은 방식) ──
        function playOk(){ try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(659.25,ac.currentTime); o.frequency.setValueAtTime(880,ac.currentTime+.12); o.connect(g); g.connect(ac.destination); g.gain.value=.4; o.start(); setTimeout(()=>o.stop(),260); }catch(e){} }
        function playNone(){ try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.type='triangle'; o.frequency.setValueAtTime(440,ac.currentTime); o.frequency.setValueAtTime(330,ac.currentTime+.12); o.connect(g); g.connect(ac.destination); g.gain.value=.4; o.start(); setTimeout(()=>o.stop(),260); }catch(e){} }
        function playWarn(){ try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.type='square'; o.frequency.value=700; o.connect(g); g.connect(ac.destination); g.gain.value=.5; o.start(); setTimeout(()=>o.stop(),350); }catch(e){} }

        // 화면 회전·주소창 변화로 폭이 바뀌면 현재 카드에 다시 맞춘다
        window.addEventListener('resize',()=>{ if($('s3').classList.contains('on')) goTo(idx,true); });
        init();
    </script>
</body>
</html>
