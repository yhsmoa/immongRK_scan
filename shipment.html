<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쿠팡 로켓 쉽먼트</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root{
            --bg:#f3f4f6; --card:#fff; --ink:#0f172a; --ink-soft:#374151; --muted:#94a3b8;
            --line:#eef2f7; --primary:#4f46e5; --primary-dark:#4338ca; --blue:#2563eb; --hover:#f8fafc;
        }
        *{box-sizing:border-box;}
        body{margin:0;font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink-soft);font-size:13.5px;-webkit-font-smoothing:antialiased;}
        .page{max-width:1720px;width:96%;margin:22px auto;}
        .card{background:var(--card);border:1px solid #edeff3;border-radius:16px;box-shadow:0 1px 3px rgba(15,23,42,.05),0 10px 30px rgba(15,23,42,.035);padding:22px 24px 18px;}
        .head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
        .title-wrap{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
        .title{font-size:20px;font-weight:700;color:var(--ink);margin:0;letter-spacing:-.3px;}
        .subtitle{font-size:13px;color:var(--muted);font-weight:500;}
        .subtitle b{color:var(--primary);font-weight:600;}
        .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
        .btn{height:38px;padding:0 15px;border:1px solid #e2e8f0;background:#fff;color:#334155;border-radius:9px;font-size:13.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s;white-space:nowrap;font-family:inherit;}
        .btn:hover{background:var(--hover);border-color:#cbd5e1;}
        .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600;box-shadow:0 1px 2px rgba(79,70,229,.25);}
        .btn.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);}
        .btn:disabled{opacity:.5;cursor:default;}
        .sep{width:1px;height:22px;background:#e2e8f0;margin:0 2px;}

        .search{position:relative;margin:0 auto 16px;width:66.67%;}
        .search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);}
        .search input{width:100%;height:44px;padding:0 16px 0 46px;border:1px solid #e5e9f0;border-radius:10px;background:#fff;font-size:14px;color:var(--ink);outline:none;transition:border-color .12s,box-shadow .12s;}
        .search input::placeholder{color:var(--muted);}
        .search input:focus{border-color:#c7d2fe;box-shadow:0 0 0 4px rgba(99,102,241,.10);}

        .table-scroll{overflow:auto;max-height:calc(100vh - 250px);}
        table.main{width:100%;border-collapse:collapse;min-width:860px;table-layout:fixed;}
        table.main thead th{position:sticky;top:0;z-index:2;background:#f1f3f6;text-align:left;font-size:12px;font-weight:600;color:#8b94a3;padding:10px 10px;border:1px solid #dfe3ea;white-space:nowrap;}
        table.main thead th.ctr{text-align:center;}
        table.main tbody td{padding:9px 10px;border:1px solid #e8ebf1;color:var(--ink-soft);font-size:12.5px;white-space:nowrap;vertical-align:middle;}
        td.ctr{text-align:center;font-variant-numeric:tabular-nums;}
        tr.order-row{cursor:pointer;}
        tr.order-row:hover td{background:var(--hover);}
        tr.order-row.checked td{background:#eef2ff;}
        td.order-no{font-weight:600;color:#1e293b;}
        .order-toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
        .order-toggle:hover{color:var(--primary);}
        .caret{display:inline-block;color:#94a3b8;transition:transform .15s;font-size:10px;}
        tr.order-row.open .caret{transform:rotate(90deg);color:var(--primary);}
        .size-chips{display:flex;flex-wrap:wrap;gap:4px;}
        .chip{display:inline-flex;align-items:center;gap:3px;background:#eef1f6;color:#475569;border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:600;}
        .chip b{color:#1e293b;}
        /* 가상스캔 분량이 있는 박스/행 — 출고스캔과 같은 연보라 */
        .chip.virtual{background:#f5f3ff;color:#6d28d9;border:1px solid #ddd6fe;}
        .chip.virtual i{font-style:normal;font-size:10px;font-weight:800;color:#7c3aed;margin-left:2px;}
        .vtag{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:#7c3aed;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:5px;padding:0 6px;vertical-align:middle;}
        /* 머리글은 `table.main thead th`(왼쪽 정렬)가 더 구체적이라 체크 칸만 다시 가운데로 */
        th.chk,td.chk,table.main thead th.chk{width:44px;text-align:center;padding-left:0 !important;padding-right:0 !important;}
        input[type="checkbox"]{width:16px;height:16px;cursor:pointer;accent-color:var(--primary);}

        /* 상세 (박스별 상품) */
        tr.detail-row{display:none;}
        tr.detail-row.show{display:table-row;}
        tr.detail-row > td{background:#f8fafc;padding:10px 14px 14px 56px !important;}
        .dtable{width:100%;border-collapse:collapse;table-layout:auto;background:#fff;border:1px solid #e8ebf1;border-radius:10px;overflow:hidden;}
        .dtable th{background:#f8fafc;color:#94a3b8;font-size:11.5px;font-weight:600;padding:8px 10px;border-bottom:1px solid #e8ebf1;text-align:left;white-space:nowrap;}
        .dtable th.ctr,.dtable td.ctr{text-align:center;}
        .dtable td{padding:8px 10px;border-bottom:1px solid #f1f5f9;font-size:12.5px;color:#374151;font-variant-numeric:tabular-nums;}
        .dtable td.pname{white-space:normal;min-width:260px;}
        .dtable tr.box-end td{border-bottom:1px solid #cbd5e1;}
        .dtable tr:last-child td{border-bottom:none;}
        .box-emoji{font-weight:600;color:#1e293b;white-space:nowrap;}
        .box-emoji .sz{color:#64748b;font-weight:500;margin-left:3px;}
        .scan-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:19px;padding:0 6px;border-radius:999px;font-size:12px;font-weight:600;background:#eef2ff;color:var(--primary);}
        .state-row td{text-align:center;padding:48px 12px !important;color:var(--muted);}
        .dash{color:#cbd5e1;}
        .table-scroll::-webkit-scrollbar{width:10px;height:10px;}
        .table-scroll::-webkit-scrollbar-thumb{background:#d7dee8;border-radius:8px;border:2px solid #fff;}

        /* 요약 — 오른쪽 슬라이드 패널 */
        .side-back{position:fixed;inset:0;background:rgba(15,23,42,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10001;}
        .side-back.show{opacity:1;pointer-events:auto;}
        .side-panel{position:fixed;top:0;right:0;height:100vh;width:760px;max-width:94vw;background:#fff;box-shadow:-8px 0 30px rgba(15,23,42,.15);transform:translateX(100%);transition:transform .25s ease;z-index:10002;display:flex;flex-direction:column;}
        .side-panel.show{transform:translateX(0);}
        .side-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #eef2f7;font-size:15px;font-weight:600;color:var(--ink);}
        .side-head .sub{font-size:12px;font-weight:500;color:#94a3b8;margin-left:8px;}
        .side-head button{border:none;background:transparent;font-size:18px;cursor:pointer;color:#94a3b8;line-height:1;}
        .side-body{overflow-y:auto;padding:12px 18px 18px;flex:1;min-height:0;}
        .stable{width:100%;border-collapse:collapse;font-size:12.5px;}
        .stable th{position:sticky;top:-12px;background:#f1f3f6;color:#8b94a3;font-size:12px;font-weight:600;padding:8px 10px;border:1px solid #dfe3ea;text-align:center;white-space:nowrap;}
        .stable td{padding:8px 10px;border:1px solid #e8ebf1;text-align:center;font-variant-numeric:tabular-nums;vertical-align:middle;}
        .stable td.l{text-align:left;}
        .stable td.date{font-weight:700;color:#1e293b;white-space:nowrap;}
        .stable td.total{font-weight:700;color:var(--primary);background:#f5f7ff;}
        .stable tr.warn td{background:#fef2f2;}
        .stable tr.warn td.total{background:#fee2e2;color:#dc2626;}
        .legend{font-size:12px;color:#94a3b8;margin:0 0 10px;}
        .legend .w{display:inline-block;width:10px;height:10px;border-radius:3px;background:#fee2e2;border:1px solid #fecaca;vertical-align:-1px;margin-right:4px;}

        /* 송장번호 입력 모달 */
        .modal-back{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:10000;}
        .modal-back.show{display:flex;}
        .modal{background:#fff;border-radius:14px;width:680px;max-width:94vw;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(15,23,42,.3);}
        .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #eef2f7;}
        .modal-head h3{margin:0;font-size:16px;color:var(--ink);}
        .modal-head button{border:none;background:transparent;font-size:18px;cursor:pointer;color:#94a3b8;line-height:1;}
        .modal-body{overflow-y:auto;padding:16px 20px;flex:1;min-height:0;}
        .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid #eef2f7;}
        .drop{border:2px dashed #dbe1ea;border-radius:12px;padding:20px;text-align:center;background:#f8fafc;cursor:pointer;transition:border-color .12s,background .12s;margin-bottom:16px;}
        .drop:hover,.drop.over{border-color:#a5b4fc;background:#f5f7ff;}
        .drop .t{font-weight:600;color:#1e293b;font-size:14px;}
        .drop .s{font-size:12px;color:#94a3b8;margin-top:4px;}
        .inv-order{border:1px solid #eceef3;border-radius:12px;padding:12px 14px 6px;margin-bottom:12px;}
        .inv-order h4{margin:0 0 10px;font-size:13.5px;color:#1f2937;padding-left:9px;border-left:3px solid #6366f1;}
        .inv-order h4 span{color:#94a3b8;font-weight:500;margin-left:6px;}
        .inv-box{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
        .inv-box label{flex:none;width:110px;font-weight:600;color:#1e293b;font-size:13px;}
        .inv-box label .sz{color:#64748b;font-weight:500;}
        .inv-box input{flex:1;height:38px;padding:0 12px;border:1px solid #e2e8f0;border-radius:9px;font-size:13.5px;outline:none;font-family:inherit;}
        .inv-box input:focus{border-color:#c7d2fe;box-shadow:0 0 0 3px rgba(99,102,241,.1);}
        .inv-box input.error{border-color:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.15);}

        /* 라벨출력 — label-service 임베드 (박스 라벨: 발주번호-박스번호 · 박스 크기) */
        .label-back{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:10000;}
        .label-back.show{display:flex;}
        .label-modal{background:#fff;border-radius:14px;width:560px;max-width:94vw;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(15,23,42,.3);}
        .label-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #eef2f7;}
        .label-head h3{margin:0;font-size:16px;color:var(--ink);}
        .label-head .sub{font-size:12.5px;color:#94a3b8;font-weight:500;margin-left:8px;}
        .label-head button{border:none;background:transparent;font-size:18px;cursor:pointer;color:#94a3b8;line-height:1;}
        .label-modal iframe{display:block;width:100%;height:480px;min-height:300px;flex:1 1 auto;border:0;background:#fff;}
        .label-status{padding:8px 18px;font-size:13px;color:#15803d;border-top:1px solid #eef2f7;}
        .label-status:empty{display:none;}

        #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:13px 20px;border-radius:10px;font-size:13.5px;line-height:1.5;box-shadow:0 8px 24px rgba(15,23,42,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10010;max-width:90vw;white-space:pre-line;text-align:center;}
        #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

        @media (max-width:760px){
            .search{width:100%;}
            tr.detail-row > td{padding-left:14px !important;}
        }
    </style>
</head>
<body>
    <div id="header-container"></div>

    <div class="page">
        <div class="card">
            <div class="head">
                <div class="title-wrap">
                    <h1 class="title">쉽먼트 관리</h1>
                    <span class="subtitle">발주서 <b id="cntOrders">0</b>건 · 박스 <b id="cntBoxes">0</b>개 · 스캔 <b id="cntQty">0</b>개</span>
                </div>
                <div class="actions">
                    <button class="btn" onclick="openSummary()">요약</button>
                    <button class="btn" id="expandBtn" onclick="toggleExpandAll()">발주서 펼쳐보기</button>
                    <span class="sep"></span>
                    <button class="btn" id="labelPrintBtn" onclick="openLabelPrint()">라벨출력</button>
                    <button class="btn" onclick="exportCJExcel()">CJ 엑셀</button>
                    <button class="btn primary" onclick="exportSelectedOrders()">쉽먼트 저장</button>
                </div>
            </div>

            <div class="search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input id="searchInput" type="text" placeholder="입고예정일 · 물류센터 · 발주번호 검색 후 Enter (콤마로 여러 개)" onkeydown="if(event.key==='Enter')applySearch()">
            </div>

            <div class="table-scroll">
                <table class="main">
                    <colgroup>
                        <col style="width:44px"><col style="width:150px"><col style="width:120px"><col style="width:90px"><col style="width:90px"><col style="width:80px"><col><col style="width:120px">
                    </colgroup>
                    <thead>
                        <tr>
                            <th class="chk"><input type="checkbox" id="checkAll" onclick="toggleAll(this)"></th>
                            <th>발주번호</th><th>물류센터</th><th class="ctr">품목개수</th><th class="ctr">스캔수량</th><th class="ctr">박스수</th><th>박스 사이즈</th><th class="ctr">입고예정일</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"><tr class="state-row"><td colspan="8">데이터를 불러오는 중…</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 요약 패널 -->
    <div class="side-back" id="sideBack" onclick="closeSummary()"></div>
    <div class="side-panel" id="sidePanel">
        <div class="side-head">
            <span>스캔 결과 요약<span class="sub" id="sumSub"></span></span>
            <button onclick="closeSummary()">✕</button>
        </div>
        <div class="side-body">
            <p class="legend"><span class="w"></span>같은 날짜·물류센터 박스가 9개 이상</p>
            <div id="sumBody"></div>
        </div>
    </div>

    <!-- 송장번호 입력 모달 -->
    <div class="modal-back" id="invBack" onclick="if(event.target.id==='invBack')closeInvoiceModal()">
        <div class="modal">
            <div class="modal-head">
                <h3>송장번호 입력</h3>
                <button onclick="closeInvoiceModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="drop" id="invDrop">
                    <div class="t">📁 CJ 운송장 엑셀 업로드</div>
                    <div class="s">클릭해서 파일 선택 또는 끌어다 놓기 — H열 운송장번호 · U열 받는분(물류센터) · Z열 "발주번호 - 박스"로 자동 입력</div>
                </div>
                <input type="file" id="invFile" accept=".xlsx,.xls" style="display:none">
                <div id="invSection"></div>
            </div>
            <div class="modal-foot">
                <button class="btn" onclick="closeInvoiceModal()">취소</button>
                <button class="btn primary" onclick="saveInvoiceNumbers()">저장 후 쉽먼트 저장</button>
            </div>
        </div>
    </div>

    <!-- 라벨출력 — 선택한 발주서의 출고 박스마다 박스 라벨 1장 (label-service 임베드 → QZ Tray) -->
    <div class="label-back" id="labelBack" onclick="if(event.target.id==='labelBack')closeLabelPrint()">
        <div class="label-modal">
            <div class="label-head">
                <h3>박스 라벨출력<span class="sub" id="labelPrintSub"></span></h3>
                <button onclick="closeLabelPrint()">✕</button>
            </div>
            <!-- allow: 임베드(다른 origin)가 이 PC 의 QZ Tray(wss://localhost)에 붙으려면 크롬 로컬 네트워크 접근(LNA) 권한을
                 부모 페이지가 위임해야 한다. src 를 넣기 전부터 이 속성이 있어야 한다 (iframe 이동 시 적용). -->
            <iframe id="labelPrintFrame" title="박스 라벨 출력"
                    allow="loopback-network; local-network; local-network-access"></iframe>
            <div class="label-status" id="labelPrintStatus"></div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        fetch('/header').then(r=>r.text()).then(h=>{document.getElementById('header-container').innerHTML=h;}).catch(()=>{});

        // 데이터: /api/shipment/orders — 출고스캔(rk_ship_boxes / rk_ship_box_items) 저장분이 있는 진행중 발주서
        //   상품정보[] = 박스별 상품행 { 상품번호, 상품바코드, 상품이름, 발주수량, 확정수량, 스캔수량, 박스정보: `${박스번호}-${크기}` }
        let allOrders=[], viewOrders=[];
        const selected=new Set();   // 체크된 발주번호
        const opened=new Set();     // 펼친 발주번호
        let invoiceNumbers={};      // { 발주번호: { 박스번호: 송장번호 } } — 모달에서 저장, 쉽먼트 저장 후 초기화

        const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const num=v=>Number(v)||0;
        // 박스정보 "12-대2" → { no:'12', size:'대2' } (크기에 '-'가 있어도 첫 '-' 기준으로 나눈다)
        function parseBox(info){
            const s=String(info||''); const i=s.indexOf('-');
            return i<0 ? {no:s, size:''} : {no:s.slice(0,i), size:s.slice(i+1)};
        }
        const boxNoCmp=(a,b)=>(parseInt(a,10)||0)-(parseInt(b,10)||0) || String(a).localeCompare(String(b));

        // 발주서 하나를 화면용으로 정리: 스캔된 상품, 박스 목록(번호순)
        function shapeOrder(o){
            const items=(o.상품정보||[]).filter(p=>num(p.스캔수량)>0 && p.박스정보 && p.박스정보!=='-')
                .map(p=>({...p, box:parseBox(p.박스정보), virtualQty:num(p.가상수량)}))
                .sort((a,b)=>boxNoCmp(a.box.no,b.box.no) || String(a.상품바코드).localeCompare(String(b.상품바코드)));
            // 박스별 크기 + 가상스캔 수량 합 (출고스캔 [가상스캔]으로 들어온 분량 → '가상' 표시)
            const boxMap=new Map();
            for(const p of items){
                if(!boxMap.has(p.box.no)) boxMap.set(p.box.no,{size:p.box.size, virtualQty:0, qty:0});
                const b=boxMap.get(p.box.no); b.virtualQty+=p.virtualQty; b.qty+=num(p.스캔수량);
            }
            const boxes=[...boxMap.entries()].map(([no,b])=>({no, size:b.size, virtualQty:b.virtualQty, qty:b.qty})).sort((a,b)=>boxNoCmp(a.no,b.no));
            return {...o, items, boxes, skuCount:new Set(items.map(p=>p.상품바코드)).size, scanQty:items.reduce((s,p)=>s+num(p.스캔수량),0)};
        }

        async function fetchOrders(){
            const res=await fetch('/api/shipment/orders');
            const data=await res.json();
            if(!res.ok) throw new Error(data.error||'목록 조회 실패');
            return data.map(shapeOrder).filter(o=>o.items.length);
        }
        async function loadOrders(){
            try{
                allOrders=await fetchOrders();
                const live=new Set(allOrders.map(o=>o.발주번호));
                for(const k of [...selected]) if(!live.has(k)) selected.delete(k);
                applySearch(true);
            }catch(e){
                document.getElementById('tbody').innerHTML=`<tr class="state-row"><td colspan="8">데이터를 불러오지 못했습니다: ${esc(e.message)}</td></tr>`;
            }
        }

        // ── 검색: 입고예정일 · 물류센터 · 발주번호 (콤마 = OR). 검색하면 걸린 발주서를 펼친다 ──
        function applySearch(keepOpen){
            const terms=document.getElementById('searchInput').value.toLowerCase().split(',').map(t=>t.trim()).filter(Boolean);
            viewOrders=terms.length
                ? allOrders.filter(o=>{ const hay=[o.입고예정일,o.물류센터,o.발주번호].map(v=>String(v||'').toLowerCase()); return terms.some(t=>hay.some(h=>h.includes(t))); })
                : allOrders.slice();
            if(terms.length && keepOpen!==true){ opened.clear(); viewOrders.forEach(o=>opened.add(o.발주번호)); }
            render();
        }

        function render(){
            const tb=document.getElementById('tbody');
            document.getElementById('cntOrders').textContent=viewOrders.length.toLocaleString();
            document.getElementById('cntBoxes').textContent=viewOrders.reduce((s,o)=>s+o.boxes.length,0).toLocaleString();
            document.getElementById('cntQty').textContent=viewOrders.reduce((s,o)=>s+o.scanQty,0).toLocaleString();
            if(!viewOrders.length){
                tb.innerHTML=`<tr class="state-row"><td colspan="8">${allOrders.length?'검색 결과가 없습니다.':'스캔된 발주서가 없습니다.'}</td></tr>`;
                syncCheckAll(); updateExpandBtn(); return;
            }
            tb.innerHTML=viewOrders.map(o=>{
                const on=esc(o.발주번호), isOpen=opened.has(o.발주번호), isSel=selected.has(o.발주번호);
                const chips=o.boxes.map(b=>`<span class="chip${b.virtualQty>0?' virtual':''}" title="${b.virtualQty>0?`가상스캔 ${b.virtualQty}개`:''}"><b>${esc(b.no)}</b>${esc(b.size)}${b.virtualQty>0?'<i>가상</i>':''}</span>`).join('');
                const rows=o.items.map((p,i)=>{
                    const boxEnd=i<o.items.length-1 && o.items[i+1].box.no!==p.box.no;
                    return `<tr class="${boxEnd?'box-end':''}">
                        <td class="box-emoji">📦 ${esc(p.box.no)}<span class="sz">${esc(p.box.size)}</span></td>
                        <td>${esc(p.상품번호)||'<span class="dash">-</span>'}</td><td>${esc(p.상품바코드)}</td>
                        <td class="pname">${esc(p.상품이름)||'<span class="dash">-</span>'}${p.virtualQty>0?`<span class="vtag" title="가상스캔 ${p.virtualQty}개">가상${p.virtualQty<num(p.스캔수량)?' '+p.virtualQty:''}</span>`:''}</td>
                        <td class="ctr">${esc(num(p.발주수량))}</td><td class="ctr">${esc(num(p.확정수량))}</td>
                        <td class="ctr"><span class="scan-badge">${esc(num(p.스캔수량))}</span></td>
                    </tr>`;
                }).join('');
                return `<tr class="order-row ${isOpen?'open':''} ${isSel?'checked':''}" data-on="${on}" onclick="onRowClick(event,this)">
                        <td class="chk"><input type="checkbox" class="rowchk" ${isSel?'checked':''} onclick="event.stopPropagation();toggleOne(this)"></td>
                        <td class="order-no"><span class="order-toggle" onclick="event.stopPropagation();toggleDetail(this.closest('tr'))"><span class="caret">▶</span>${on}</span></td>
                        <td>${esc(o.물류센터)}</td>
                        <td class="ctr">${o.skuCount}</td><td class="ctr">${o.scanQty.toLocaleString()}</td><td class="ctr">${o.boxes.length}</td>
                        <td><div class="size-chips">${chips}</div></td>
                        <td class="ctr">${esc(o.입고예정일)}</td>
                    </tr>
                    <tr class="detail-row ${isOpen?'show':''}"><td colspan="8">
                        <table class="dtable"><thead><tr><th>박스</th><th>상품번호</th><th>상품바코드</th><th>상품명</th><th class="ctr">발주수량</th><th class="ctr">확정수량</th><th class="ctr">스캔수량</th></tr></thead>
                        <tbody>${rows}</tbody></table>
                    </td></tr>`;
            }).join('');
            syncCheckAll(); updateExpandBtn();
        }

        // ── 선택 / 펼치기 ──
        function onRowClick(e,tr){ const cb=tr.querySelector('.rowchk'); cb.checked=!cb.checked; toggleOne(cb); }
        function toggleOne(cb){
            const tr=cb.closest('tr'), on=tr.dataset.on;
            if(cb.checked) selected.add(on); else selected.delete(on);
            tr.classList.toggle('checked',cb.checked);
            syncCheckAll();
        }
        function toggleAll(box){
            // 화면에 보이는(검색된) 발주서만 선택/해제
            viewOrders.forEach(o=>{ if(box.checked) selected.add(o.발주번호); else selected.delete(o.발주번호); });
            render();
        }
        function syncCheckAll(){
            const all=document.getElementById('checkAll');
            all.checked=viewOrders.length>0 && viewOrders.every(o=>selected.has(o.발주번호));
        }
        function toggleDetail(tr){
            const on=tr.dataset.on, d=tr.nextElementSibling;
            const open=!opened.has(on);
            if(open) opened.add(on); else opened.delete(on);
            tr.classList.toggle('open',open); d.classList.toggle('show',open);
            updateExpandBtn();
        }
        function toggleExpandAll(){
            const allOpen=viewOrders.length && viewOrders.every(o=>opened.has(o.발주번호));
            viewOrders.forEach(o=>{ if(allOpen) opened.delete(o.발주번호); else opened.add(o.발주번호); });
            render();
        }
        function updateExpandBtn(){
            const allOpen=viewOrders.length && viewOrders.every(o=>opened.has(o.발주번호));
            document.getElementById('expandBtn').textContent=allOpen?'발주서 접기':'발주서 펼쳐보기';
        }
        const selectedOrders=()=>allOrders.filter(o=>selected.has(o.발주번호)).map(o=>o.발주번호);

        // ── 요약: 입고예정일 → 물류센터 → 발주서별 박스 (같은 날짜·센터 9박스 이상 경고) ──
        const fmtSize=s=>({'대1':'대','중1':'중','소1':'소','극소1':'극소'}[s]||s);
        function openSummary(){
            const byDate=new Map();
            for(const o of allOrders){
                if(!o.boxes.length) continue;
                const d=o.입고예정일||'-', c=o.물류센터||'-';
                if(!byDate.has(d)) byDate.set(d,new Map());
                const byCenter=byDate.get(d);
                if(!byCenter.has(c)) byCenter.set(c,[]);
                byCenter.get(c).push(o);
            }
            let html='', totalBoxes=0;
            for(const d of [...byDate.keys()].sort()){
                const byCenter=byDate.get(d);
                const centers=[...byCenter.keys()].sort((a,b)=>a.localeCompare(b,'ko'));
                const dateSpan=centers.reduce((s,c)=>s+byCenter.get(c).length,0);
                centers.forEach((c,ci)=>{
                    const orders=byCenter.get(c).slice().sort((a,b)=>String(a.발주번호).localeCompare(String(b.발주번호)));
                    const groupBoxes=orders.reduce((s,o)=>s+o.boxes.length,0);
                    totalBoxes+=groupBoxes;
                    const warn=groupBoxes>=9;
                    orders.forEach((o,oi)=>{
                        html+=`<tr class="${warn?'warn':''}">`
                            +(ci===0&&oi===0?`<td class="date" rowspan="${dateSpan}">${esc(d)}</td>`:'')
                            +(oi===0?`<td rowspan="${orders.length}">${esc(c)}</td><td class="total" rowspan="${orders.length}">${groupBoxes}</td>`:'')
                            +`<td>${esc(o.발주번호)}</td><td>${o.boxes.length}</td>`
                            +`<td class="l">${o.boxes.map(b=>`${esc(b.no)}: ${esc(fmtSize(b.size))}`).join(', ')}</td></tr>`;
                    });
                });
            }
            document.getElementById('sumSub').textContent=allOrders.length?`발주서 ${allOrders.length}건 · 박스 ${totalBoxes}개`:'';
            document.getElementById('sumBody').innerHTML=html
                ? `<table class="stable"><thead><tr><th>입고예정일</th><th>물류센터</th><th>총 박스</th><th>발주번호</th><th>박스</th><th>박스 사이즈</th></tr></thead><tbody>${html}</tbody></table>`
                : '<p class="legend" style="text-align:center;padding:30px 0;">스캔된 데이터가 없습니다.</p>';
            document.getElementById('sideBack').classList.add('show');
            document.getElementById('sidePanel').classList.add('show');
        }
        function closeSummary(){
            document.getElementById('sideBack').classList.remove('show');
            document.getElementById('sidePanel').classList.remove('show');
        }

        // ── 송장번호 모달 ──
        let invOrders=[];   // 모달에 띄운 발주서 (최신 데이터)
        async function openInvoiceModal(){
            const sel=selectedOrders();
            if(!sel.length){ toast('송장번호를 입력할 발주서를 선택해주세요.'); return; }
            try{
                // 스캔이 그사이 바뀌었을 수 있어 최신 목록으로 다시 그린다
                allOrders=await fetchOrders();
                applySearch(true);
                invOrders=allOrders.filter(o=>sel.includes(o.발주번호));
            }catch(e){ toast('발주서 정보를 가져오지 못했습니다: '+e.message); return; }
            if(!invOrders.length){ toast('선택한 발주서에 스캔된 박스가 없습니다.'); return; }
            document.getElementById('invSection').innerHTML=invOrders.map(o=>`
                <div class="inv-order">
                    <h4>${esc(o.발주번호)}<span>${esc(o.물류센터)} · ${esc(o.입고예정일)}</span></h4>
                    ${o.boxes.map(b=>`<div class="inv-box">
                        <label>📦 ${esc(b.no)} <span class="sz">${esc(b.size)}</span></label>
                        <input type="text" placeholder="송장번호 입력" data-order="${esc(o.발주번호)}" data-box="${esc(b.no)}" data-center="${esc(o.물류센터)}"
                            value="${esc((invoiceNumbers[o.발주번호]||{})[b.no]||'')}" oninput="if(this.value.trim())this.classList.remove('error')">
                    </div>`).join('')}
                </div>`).join('');
            document.getElementById('invBack').classList.add('show');
        }
        function closeInvoiceModal(){ document.getElementById('invBack').classList.remove('show'); }
        function saveInvoiceNumbers(){
            const inputs=[...document.querySelectorAll('#invSection input')];
            let empty=0;
            inputs.forEach(i=>{ const bad=!i.value.trim(); i.classList.toggle('error',bad); if(bad) empty++; });
            if(empty){ toast(`송장번호를 모두 입력해주세요. (빈 칸 ${empty}개)`); return; }
            invoiceNumbers={};
            inputs.forEach(i=>{ (invoiceNumbers[i.dataset.order] ||= {})[i.dataset.box]=i.value.trim(); });
            closeInvoiceModal();
            exportSelectedOrders();
        }

        // CJ 운송장 결과 엑셀 → 송장번호 자동 입력
        //   H열(7)=운송장번호, U열(20)=받는분(물류센터), Z열(25)="발주번호 - 박스번호" (CJ 엑셀의 발주번호 열과 같은 형식)
        function readInvoiceFile(file){
            if(!file) return;
            if(!/\.xlsx?$/i.test(file.name)){ toast('엑셀 파일만 업로드 가능합니다.'); return; }
            const reader=new FileReader();
            reader.onload=e=>{
                try{
                    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
                    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
                    const map=new Map();   // 발주번호|박스|물류센터 → [송장번호]
                    for(let i=1;i<rows.length;i++){
                        const r=rows[i]||[]; const inv=r[7], center=r[20], ob=r[25];
                        if(!inv||!center||!ob) continue;
                        const parts=String(ob).split(' - ');
                        if(parts.length!==2) continue;
                        const key=`${parts[0].trim()}|${parts[1].trim()}|${String(center).trim()}`;
                        if(!map.has(key)) map.set(key,[]);
                        map.get(key).push(String(inv).trim());
                    }
                    let matched=0;
                    document.querySelectorAll('#invSection input').forEach(i=>{
                        const list=map.get(`${i.dataset.order}|${i.dataset.box}|${i.dataset.center}`);
                        if(list){ i.value=list.join(', '); i.classList.remove('error'); matched++; }
                    });
                    const total=document.querySelectorAll('#invSection input').length;
                    toast(`송장번호 자동 입력: ${matched} / ${total}박스`);
                }catch(err){ console.error(err); toast('엑셀 파일 처리 중 오류가 발생했습니다.'); }
            };
            reader.readAsArrayBuffer(file);
        }
        (function initDrop(){
            const drop=document.getElementById('invDrop'), input=document.getElementById('invFile');
            drop.addEventListener('click',()=>input.click());
            input.addEventListener('change',()=>{ readInvoiceFile(input.files[0]); input.value=''; });
            drop.addEventListener('dragover',e=>{ e.preventDefault(); drop.classList.add('over'); });
            drop.addEventListener('dragleave',e=>{ e.preventDefault(); drop.classList.remove('over'); });
            drop.addEventListener('drop',e=>{ e.preventDefault(); drop.classList.remove('over'); readInvoiceFile(e.dataTransfer.files[0]); });
        })();

        // ── 내보내기 ──
        async function downloadPost(url,body,fallbackName){
            const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
            if(!res.ok){ let m=''; try{ m=(await res.json()).error; }catch(_){} throw new Error(m||'다운로드 실패'); }
            const blob=await res.blob();
            const cd=res.headers.get('Content-Disposition')||'';
            const m=cd.match(/filename=(.+)$/);
            const a=document.createElement('a');
            a.href=URL.createObjectURL(blob);
            a.download=m?decodeURIComponent(m[1]):fallbackName;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(()=>URL.revokeObjectURL(a.href),1000);
        }
        // 쉽먼트 저장: 송장번호가 아직 없으면 모달부터
        async function exportSelectedOrders(){
            const sel=selectedOrders();
            if(!sel.length){ toast('내보낼 발주서를 선택해주세요.'); return; }
            if(!Object.keys(invoiceNumbers).length) return openInvoiceModal();
            try{
                await downloadPost('/api/shipment/export',{orderNumbers:sel, invoiceNumbers},'shipment.xlsx');
                invoiceNumbers={};
            }catch(e){ toast('쉽먼트 저장 실패: '+e.message); }
        }
        async function exportCJExcel(){
            const sel=selectedOrders();
            if(!sel.length){ toast('다운로드할 발주서를 선택해주세요.'); return; }
            try{ await downloadPost('/api/shipment/export-cj',{orderNumbers:sel},'CJ_shipment.xlsx'); }
            catch(e){ toast('CJ 엑셀 다운로드 실패: '+e.message); }
        }

        // ============================================================
        // 라벨출력 — 박스 라벨 (label-service 임베드)
        //   선택한 발주서의 출고스캔 박스(rk_ship_boxes)마다 1장: 발주번호-박스번호 · 물류센터 · 박스 크기 · 발주번호 바코드
        //   1) 선택 발주번호 → POST /api/label/order-boxes → items[{ data:{po_*, bx_*}, qty:1 }]
        //   2) iframe(label-service /print-embed) 이 준비되면 postMessage(labelType:'box')
        //   3) 임베드에서 템플릿·프린터 확인 후 QZ Tray 로 인쇄. 결과는 message 로 돌아온다
        //   양식은 라벨 설정(/labelSettings)의 "박스 라벨" 종류 템플릿. 상품 라벨은 발주서 관리·상품관리의 [라벨출력].
        //   템플릿별 프린터 지정값은 이 사이트가 기억한다 (localStorage — 다른 페이지 라벨출력과 같은 키라 PC 마다 한 번만 지정).
        //   ?labeldebug=1 로 이 페이지를 열면 임베드에 [인쇄 명령 저장] 버튼이 생긴다 (프린터로 갈 바이트를 파일로).
        // ============================================================
        let labelCfg=null, labelOrigin=null, labelPending=null;
        const LABEL_PRINTER_KEY='label_printer_map_v1';
        const labelDebug=new URLSearchParams(location.search).get('labeldebug')==='1';
        function loadLabelPrinterMap(){ try{ const j=JSON.parse(localStorage.getItem(LABEL_PRINTER_KEY)||'{}'); return j&&typeof j==='object'&&!Array.isArray(j)?j:{}; }catch(_){ return {}; } }
        function saveLabelPrinterMap(map){ try{ localStorage.setItem(LABEL_PRINTER_KEY, JSON.stringify(map||{})); }catch(_){ /* 저장 불가 시 무시 */ } }
        async function getLabelCfg(){
            if(labelCfg) return labelCfg;
            const res=await fetch('/api/label/config');
            const j=await res.json();
            if(!res.ok) throw new Error(j.error||'라벨 서비스 설정을 불러오지 못했습니다.');
            labelCfg=j; labelOrigin=new URL(j.url).origin;
            return j;
        }
        function sendLabelPending(){
            const frame=document.getElementById('labelPrintFrame');
            if(!labelPending||!frame.contentWindow||frame.dataset.ready!=='1') return;
            frame.contentWindow.postMessage(labelPending, labelOrigin);
            labelPending=null;
        }
        async function openLabelPrint(){
            const orderNumbers=selectedOrders();
            if(!orderNumbers.length){ toast('라벨을 출력할 발주서를 선택해주세요.'); return; }
            const btn=document.getElementById('labelPrintBtn'); btn.disabled=true;
            try{
                const cfg=await getLabelCfg();
                const res=await fetch('/api/label/order-boxes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderNumbers})});
                const j=await res.json();
                if(!res.ok) throw new Error(j.error||'박스 데이터 조회 실패');
                if(!j.items.length){ toast('선택한 발주서에 출고스캔된 박스가 없습니다.'); return; }
                if(j.noBox.length) toast(`출고스캔된 박스가 없는 발주서 ${j.noBox.length}건은 제외됩니다.\n${j.noBox.join(', ')}`);

                labelPending={
                    type:'label-print:print',
                    requestId:String(Date.now()),
                    source:cfg.source,
                    userId:cfg.userId,
                    labelType:'box',
                    autoPrint:false,
                    printerMap:loadLabelPrinterMap(),   // 이 PC 에서 기억해 둔 템플릿별 프린터
                    items:j.items
                };
                document.getElementById('labelPrintSub').textContent=`박스 ${j.items.length}개 · 발주서 ${j.orderCount}건`;
                document.getElementById('labelPrintStatus').textContent='';
                document.getElementById('labelBack').classList.add('show');

                const frame=document.getElementById('labelPrintFrame');
                if(frame.dataset.ready==='1') sendLabelPending();                                   // 이미 로드된 iframe 재사용
                else frame.src=cfg.url+'/print-embed'+(labelDebug?'?debug=1':'');                  // 로드되면 'label-print:ready' 가 온다
            }catch(e){ toast('라벨 출력 준비 실패: '+e.message); }
            finally{ btn.disabled=false; }
        }
        function closeLabelPrint(){ document.getElementById('labelBack').classList.remove('show'); labelPending=null; }
        // 임베드 → 이 창: 준비 완료 / 프린터 지정 변경 / 인쇄 결과
        window.addEventListener('message',function(e){
            if(!labelOrigin||e.origin!==labelOrigin) return;
            const d=e.data||{};
            if(d.type==='label-print:ready'){ document.getElementById('labelPrintFrame').dataset.ready='1'; sendLabelPending(); }
            else if(d.type==='label-print:printer-map'){ if(d.map&&typeof d.map==='object'&&!Array.isArray(d.map)) saveLabelPrinterMap(d.map); }
            else if(d.type==='label-print:result'){
                document.getElementById('labelPrintStatus').textContent=d.ok?`✓ 박스 라벨 ${d.printed}장 전송됨`:'✕ 박스 라벨 실패';   // 상세 사유는 임베드가 alert 로 띄운다
            }
        });

        let toastTimer;
        function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3200);}
        document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeSummary(); closeInvoiceModal(); closeLabelPrint(); } });

        loadOrders();
    </script>
</body>
</html>
