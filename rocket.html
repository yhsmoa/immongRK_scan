<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쿠팡 로켓 발주서</title>
    <style>
        :root{
            --bg:#f3f4f6; --card:#fff; --ink:#0f172a; --ink-soft:#374151; --muted:#94a3b8;
            --line:#eef2f7; --line-soft:#f1f5f9; --primary:#4f46e5; --primary-dark:#4338ca;
            --blue:#2563eb; --hover:#f8fafc;
        }
        *{box-sizing:border-box;}
        body{margin:0;font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink-soft);font-size:13.5px;-webkit-font-smoothing:antialiased;}
        .page{max-width:1720px;width:96%;margin:22px auto;}
        .card{background:var(--card);border:1px solid #edeff3;border-radius:16px;box-shadow:0 1px 3px rgba(15,23,42,.05),0 10px 30px rgba(15,23,42,.035);padding:22px 24px 10px;}
        .head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
        .title-wrap{display:flex;align-items:baseline;gap:12px;}
        .title{font-size:20px;font-weight:700;color:var(--ink);margin:0;letter-spacing:-.3px;}
        .subtitle{font-size:13px;color:var(--muted);font-weight:500;}
        .subtitle b{color:var(--primary);font-weight:600;}
        .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
        .btn{height:38px;padding:0 15px;border:1px solid #e2e8f0;background:#fff;color:#334155;border-radius:9px;font-size:13.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s;white-space:nowrap;}
        .btn:hover{background:var(--hover);border-color:#cbd5e1;}
        .btn:active{background:#f1f5f9;}
        .btn.danger:hover{color:#dc2626;border-color:#fecaca;background:#fef2f2;}
        .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600;box-shadow:0 1px 2px rgba(79,70,229,.25);}
        .btn.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);}
        .sep{width:1px;height:22px;background:#e2e8f0;margin:0 2px;}
        /* 드롭다운 (변경 / 콘솔) */
        .dd{position:relative;display:inline-flex;}
        .dd>.btn .caret{opacity:.5;}
        .dd-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:158px;background:#fff;
            border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 10px 28px -10px rgba(15,23,42,.3);
            padding:5px;display:none;z-index:60;}
        .dd-menu.show{display:block;}
        .dd-menu button{display:block;width:100%;text-align:left;padding:9px 11px;border:0;background:none;
            border-radius:7px;font-size:13.5px;font-weight:500;color:#334155;cursor:pointer;
            white-space:nowrap;font-family:inherit;}
        .dd-menu button:hover{background:var(--hover);}
        .search{position:relative;margin:0 auto 16px;width:66.67%;}
        .tabletop{display:flex;align-items:center;justify-content:flex-start;margin-bottom:8px;}
        .page-size select{height:34px;padding:0 6px;border:none;background:transparent;font-size:13px;color:#334155;cursor:pointer;outline:none;}
        .pagination{display:flex;justify-content:center;align-items:center;gap:4px;padding:16px 0 8px;flex-wrap:wrap;}
        .pagination button{min-width:34px;height:34px;padding:0 10px;border:1px solid #e2e8f0;background:#fff;color:#475569;border-radius:8px;font-size:13px;cursor:pointer;}
        .pagination button:hover:not(:disabled):not(.active){background:#f8fafc;}
        .pagination button.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600;}
        .pagination button:disabled{opacity:.4;cursor:default;}
        .pagination .ellipsis{padding:0 4px;color:#94a3b8;}
        /* 발주번호 그룹 구분선: 그룹의 마지막 행 하단에 1px 검정 (border-collapse에서 위쪽 셀 우선이라 확실히 검정으로 보임) */
        tbody tr.group-end td{border-bottom:1px solid #111827;}
        /* 오른쪽 슬라이드 패널 (전체보기) */
        .side-back{position:fixed;inset:0;background:rgba(15,23,42,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10001;}
        .side-back.show{opacity:1;pointer-events:auto;}
        .side-panel{position:fixed;top:0;right:0;height:100vh;width:540px;max-width:92vw;background:#fff;box-shadow:-8px 0 30px rgba(15,23,42,.15);transform:translateX(100%);transition:transform .25s ease;z-index:10002;display:flex;flex-direction:column;}
        .side-panel.show{transform:translateX(0);}
        .side-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #eef2f7;font-size:15px;font-weight:600;color:#0f172a;}
        .side-head .sub{font-size:12px;font-weight:500;color:#94a3b8;margin-left:8px;}
        .side-head button{border:none;background:transparent;font-size:18px;cursor:pointer;color:#94a3b8;line-height:1;}
        .side-list{overflow-y:auto;padding:4px 4px 16px;flex:1;}
        .side-date{display:inline-block;background:#2563eb;color:#fff;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:6px;margin:14px 6px 9px;cursor:pointer;user-select:none;}
        .side-date:hover{background:#1d4ed8;}
        .side-date.sel{background:#1e3a8a;box-shadow:0 0 0 2px rgba(37,99,235,.35);}
        .side-orders{display:flex;flex-wrap:wrap;gap:8px;padding:0 8px 8px;}
        .side-order{padding:8px 12px;border:1px solid #e5e9f0;border-radius:8px;cursor:pointer;}
        .side-order:hover{background:#f8fafc;}
        .side-order.sel{background:#eef2ff;border-color:#c7d2fe;}
        .so-no{font-size:13px;font-weight:600;color:#1e293b;white-space:nowrap;}
        .so-cnt{color:#94a3b8;font-weight:500;font-size:12px;}
        .so-center{font-size:12px;color:#1e293b;margin-top:2px;}
        .search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);}
        .search input{width:100%;height:44px;padding:0 16px 0 46px;border:1px solid #e5e9f0;border-radius:10px;background:#fff;font-size:14px;color:var(--ink);outline:none;transition:border-color .12s,box-shadow .12s;}
        .search input::placeholder{color:var(--muted);}
        .search input:focus{border-color:#c7d2fe;box-shadow:0 0 0 4px rgba(99,102,241,.10);}
        .table-scroll{overflow:auto;max-height:calc(100vh - 250px);}
        table{width:100%;border-collapse:collapse;min-width:1322px;table-layout:fixed;}
        thead th{position:sticky;top:0;z-index:2;background:#f1f3f6;text-align:left;font-size:12px;font-weight:600;color:#8b94a3;padding:9px 8px;border:1px solid #dfe3ea;white-space:nowrap;overflow:hidden;}
        thead th.num,thead th.ctr{text-align:center;}
        tbody td{padding:8px 8px;border:1px solid #e8ebf1;color:var(--ink-soft);font-size:12px;white-space:nowrap;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;}
        tbody tr:hover td{background:var(--hover);}
        td.num,td.ctr{text-align:center;font-variant-numeric:tabular-nums;}
        th.num,td.num,th.ctr,td.ctr{padding-left:4px;padding-right:4px;}
        .c-created{font-size:10px;}
        td.c-created,th.c-created{text-align:center;padding-left:2px;padding-right:2px;}
        td.order-no{font-weight:600;color:#1e293b;}
        td.pname{white-space:normal;min-width:280px;max-width:460px;color:#334155;cursor:text;user-select:text;}
        /* 상품명 모델코드 배지 — 클릭 시 클립보드 복사 (shortage 동일) */
        .name-badge{cursor:pointer;}
        .name-badge:hover{filter:brightness(.96);}
        .name-badge.copied{background:#dcfce7;color:#16a34a;border-color:#bbf7d0;}
        /* 발주~입고 값 셀: 클릭하면 상세 */
        td.dt{cursor:pointer;}
        td.dt:hover{background:#f1f5ff;}

        /* 스캔 상세 — 오른쪽 슬라이드 패널 (카드형) */
        .scan-back{position:fixed;inset:0;background:rgba(15,23,42,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10000;}
        .scan-back.show{opacity:1;pointer-events:auto;}
        .scan-modal{position:fixed;top:0;right:0;height:100vh;width:460px;max-width:96vw;background:#fff;box-shadow:-10px 0 40px rgba(15,23,42,.14);transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);z-index:10001;display:flex;flex-direction:column;}
        .scan-back.show .scan-modal{transform:translateX(0);}
        /* 상단 흰색 고정 (헤더 + 상품정보) */
        .scan-top{flex:none;background:#fff;border-bottom:1px solid #eef0f4;}
        .scan-head{padding:16px 20px 8px;display:flex;align-items:center;justify-content:space-between;}
        .scan-head .lbl{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:#8b93a5;letter-spacing:.06em;}
        .scan-head .lbl::before{content:'';width:7px;height:7px;border-radius:50%;background:#6366f1;}
        .scan-head button{flex:none;border:none;background:#f1f3f7;width:32px;height:32px;border-radius:10px;font-size:15px;cursor:pointer;color:#94a3b8;line-height:1;transition:background .12s,color .12s;}
        .scan-head button:hover{background:#e7eaf0;color:#475569;}
        .item-detail{display:flex;gap:14px;padding:8px 20px 18px;}
        .item-detail .thumb{flex:none;width:76px;height:76px;border-radius:13px;border:1px solid #e6e9ef;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;line-height:1.3;color:#b4bac6;background:repeating-linear-gradient(45deg,#f3f4f7,#f3f4f7 7px,#eceef3 7px,#eceef3 14px);}
        .item-detail .thumb img{width:100%;height:100%;object-fit:cover;}
        .item-detail .idinfo{min-width:0;flex:1;}
        .item-detail .iname{font-size:15px;font-weight:700;color:#111827;line-height:1.4;word-break:break-word;}
        .item-detail .ibadges{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
        .ibadge{display:inline-flex;align-items:center;gap:5px;background:#eef1f6;color:#475569;border-radius:7px;padding:3px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;}
        .ibadge.model{background:#eef2ff;color:#4f46e5;}
        .ibadge .sq{width:9px;height:9px;border-radius:2px;background:#334155;display:inline-block;}
        .item-detail .icode{margin-top:10px;font-size:12px;color:#9aa1b0;font-variant-numeric:tabular-nums;word-break:break-all;}
        /* 스크롤 영역(연회색) + 카드 */
        .scan-scroll{overflow-y:auto;overflow-x:hidden;padding:16px 18px 26px;flex:1;min-height:0;background:#f5f6f8;}
        .scard{background:#fff;border:1px solid #eceef3;border-radius:14px;padding:14px 16px 6px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.03);}
        .scard:last-child{margin-bottom:0;}
        .scard-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
        .scard-h .t{font-size:13px;font-weight:700;color:#1f2937;padding-left:9px;border-left:3px solid #6366f1;line-height:1.15;}
        .scard-h .cnt{font-size:11px;font-weight:600;color:#64748b;background:#f1f3f7;border-radius:999px;padding:3px 11px;}
        .scard-h .cnt.green{background:#e7f7ec;color:#16a34a;}
        .htable{width:100%;min-width:0;border-collapse:collapse;font-size:12.5px;table-layout:fixed;}
        .htable th{border:0;border-bottom:1px solid #eceef3;background:transparent;color:#9aa1b0;font-size:11px;font-weight:600;padding:3px 4px 9px;text-align:center;white-space:nowrap;}
        .htable td{border:0;padding:9px 4px;color:#374151;font-variant-numeric:tabular-nums;word-break:break-word;text-align:center;white-space:normal;overflow:visible;}
        .htable td.r{font-weight:700;color:#111827;}
        .htable td.qty-edit{cursor:text;border-radius:6px;}
        .htable td.qty-edit:hover{background:#f4f7ff;}
        .htable td.qty-edit:focus{outline:none;background:#fff;box-shadow:inset 0 0 0 2px #c7d2fe;}
        .htable td.qty-edit.dirty{color:#F0492F;}
        .type-pill{display:inline-block;background:#eef0f4;color:#475569;border-radius:6px;padding:2px 9px;font-size:11.5px;font-weight:600;}
        .type-pill.jaego{background:#e8f0ff;color:#2563eb;}
        .type-pill.ipgo{background:#fff1e6;color:#ea580c;}
        .box-emoji{font-weight:600;color:#374151;}
        .hempty{color:#a9b0bd;font-size:12px;padding:14px 0;text-align:center;}
        /* 하단 저장 */
        .scan-foot{flex:none;padding:12px 18px;border-top:1px solid #eef0f4;background:#fff;display:flex;justify-content:flex-end;}
        .scan-foot .savebtn{height:38px;padding:0 22px;border:1px solid #e2e8f0;background:#fff;color:#a9b0bd;border-radius:9px;font-size:13.5px;font-weight:600;cursor:default;transition:background .12s,color .12s;}
        .scan-foot .savebtn.on{background:#4f46e5;color:#fff;border-color:#4f46e5;cursor:pointer;box-shadow:0 1px 2px rgba(79,70,229,.25);}
        .name-badge{display:inline-block;background:#dbeafe;color:#2563eb;border:1px solid #bfdbfe;border-radius:6px;padding:0 6px;white-space:nowrap;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
        .scan-zero{color:#cbd5e1;}
        .scan-pos{color:#1e293b;}
        /* 스캔 열 배지: 확정==스캔 초록(연하게), 스캔>0 & 확정>스캔 주황 */
        .scan-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;font-size:12px;font-weight:500;line-height:1;}
        .scan-green{background:#dcfce7;color:#16a34a;}
        .scan-orange{background:#ffedd5;color:#ea580c;}
        .dash{color:#cbd5e1;}
        .loc-disc{color:#e11d48;font-weight:600;}
        .loc-stock{color:#111827;font-weight:600;}   /* 준비(재고) 배정 위치 */
        th.chk,td.chk{width:42px;text-align:center;padding-left:0;padding-right:0;}
        input[type="checkbox"]{width:16px;height:16px;cursor:pointer;accent-color:var(--primary);}
        .state-row td{text-align:center;padding:48px 12px;color:var(--muted);}
        .table-scroll::-webkit-scrollbar{width:10px;height:10px;}
        .table-scroll::-webkit-scrollbar-thumb{background:#d7dee8;border-radius:8px;border:2px solid #fff;}
        .table-scroll::-webkit-scrollbar-thumb:hover{background:#c2ccd9;}
        #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:13px 20px;border-radius:10px;font-size:13.5px;line-height:1.5;box-shadow:0 8px 24px rgba(15,23,42,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9999;max-width:90vw;white-space:pre-line;text-align:center;}
        #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
        .modal-back{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:10000;}
        .modal-back.show{display:flex;}
        .modal{background:#fff;border-radius:14px;padding:22px 22px 18px;width:380px;max-width:92vw;box-shadow:0 20px 50px rgba(15,23,42,.3);}
        .modal h3{margin:0 0 6px;font-size:16px;color:var(--ink);}
        .modal p{margin:0 0 14px;font-size:13px;color:var(--muted);}
        .modal input{width:100%;height:42px;padding:0 12px;border:1px solid #e2e8f0;border-radius:9px;font-size:14px;outline:none;margin-bottom:16px;}
        .modal input:focus{border-color:#c7d2fe;box-shadow:0 0 0 3px rgba(99,102,241,.1);}
        .modal-btns{display:flex;justify-content:flex-end;gap:8px;}
    </style>
</head>
<body>
    <div id="header-container"></div>

    <div class="page">
        <div class="card">
            <div class="head">
                <div class="title-wrap">
                    <h1 class="title">발주서 관리</h1>
                    <span class="subtitle">전체 <b id="rowCount">0</b>행 · <span id="selCount">0</span>개 선택</span>
                </div>
                <div class="actions">
                    <button class="btn" onclick="openOrderPanel()">요약</button>
                    <button class="btn" onclick="loadLocations()">위치</button>

                    <div class="dd">
                        <button class="btn" onclick="toggleDd(event,'ddChange')">변경
                            <svg class="caret" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                        </button>
                        <div class="dd-menu" id="ddChange">
                            <button onclick="ddRun(changeCenter)">센터변경</button>
                            <button onclick="ddRun(changeDate)">입고일 변경</button>
                        </div>
                    </div>

                    <div class="dd">
                        <button class="btn" onclick="toggleDd(event,'ddConsole')">콘솔
                            <svg class="caret" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                        </button>
                        <div class="dd-menu" id="ddConsole">
                            <button onclick="ddRun(copyOrderConsoleScript)">콘솔 복사</button>
                            <button onclick="ddRun(pickConsoleFile)">엑셀 저장</button>
                        </div>
                    </div>

                    <button class="btn" onclick="printRows()">인쇄</button>
                    <button class="btn" onclick="completeRows()">처리완료</button>
                    <span class="sep"></span>
                    <button class="btn" onclick="saveOrders()">저장</button>
                    <button class="btn primary" onclick="document.getElementById('fileInput').click()">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M5 12l7-7 7 7"/></svg>
                        Excel 업로드
                    </button>
                    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none" onchange="uploadExcel(this)">
                    <input type="file" id="consoleFileInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleConsoleUpload(this)">
                </div>
            </div>

            <div class="search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input id="searchInput" type="text" placeholder="발주번호 · 물류센터 · 상품명 · 상품바코드 · 위치 검색 후 Enter" onkeydown="if(event.key==='Enter')applySearch()">
            </div>

            <div class="tabletop">
                <div class="page-size">
                    <select id="pageSize" onchange="changePageSize()">
                        <option value="100">100개씩</option>
                        <option value="200">200개씩</option>
                        <option value="500" selected>500개씩</option>
                    </select>
                    <select id="scanFilter" onchange="applySearch()">
                        <option value="all" selected>전체</option>
                        <option value="unscanned">미스캔</option>
                    </select>
                </div>
            </div>

            <div class="table-scroll">
                <table>
                    <!-- ⚠ table-layout:fixed — col 개수와 th 개수가 반드시 같아야 한다.
                         col 이 없는 열은 남은 폭을 전부 가져가 레이아웃이 깨진다. -->
                    <colgroup>
                        <col style="width:40px">   <!-- 체크 -->
                        <col style="width:82px">   <!-- 발주번호 -->
                        <col style="width:78px">   <!-- 물류센터 -->
                        <col style="width:82px">   <!-- 상품번호 -->
                        <col style="width:120px">  <!-- 상품바코드 -->
                        <col>                      <!-- 상품명 (남은 폭) -->
                        <col style="width:46px">   <!-- 발주 -->
                        <col style="width:46px">   <!-- 확정 -->
                        <col style="width:52px">   <!-- 스캔 -->
                        <col style="width:52px">   <!-- 준비 -->
                        <col style="width:52px">   <!-- 재고 -->
                        <col style="width:50px">   <!-- 입고 -->
                        <col style="width:84px">   <!-- 위치 -->
                        <col style="width:76px">   <!-- 입고예정일 -->
                        <col style="width:99px">   <!-- created_at -->
                    </colgroup>
                    <thead>
                        <tr>
                            <th class="chk"><input type="checkbox" id="checkAll" onclick="toggleAll(this)"></th>
                            <th>발주번호</th><th>물류센터</th><th>상품번호</th><th class="c-barcode">상품바코드</th><th>상품명</th>
                            <th class="num">발주</th><th class="num">확정</th><th class="num">스캔</th><th class="ctr">준비</th><th class="ctr">재고</th><th class="ctr">입고</th><th>위치</th><th>입고예정일</th><th class="c-created">created_at</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"><tr class="state-row"><td colspan="15">데이터를 불러오는 중…</td></tr></tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <div class="side-back" id="sideBack" onclick="closeOrderPanel()"></div>
    <div class="side-panel" id="sidePanel">
        <div class="side-head">
            <span>발주서 전체 <span class="sub" id="sideCount"></span></span>
            <button onclick="closeOrderPanel()">✕</button>
        </div>
        <div class="side-list" id="sideList"></div>
    </div>

    <div id="toast"></div>
    <div class="modal-back" id="modalBack">
        <div class="modal">
            <h3 id="mTitle"></h3>
            <p id="mDesc"></p>
            <input id="mInput" type="text">
            <div class="modal-btns">
                <button class="btn" onclick="modalResolve(null)">취소</button>
                <button class="btn primary" onclick="modalConfirm()">확인</button>
            </div>
        </div>
    </div>

    <script>
        fetch('/header').then(r=>r.text()).then(h=>{document.getElementById('header-container').innerHTML=h;}).catch(()=>{});

        let allRows=[], viewRows=[];
        let pageSize=500, currentPage=1;
        const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        // 상품명: 첫 콤마 앞 단어가 영어+숫자 조합(모델코드)이면 연한 파란 배지
        function modelBadge(name){
            const s=String(name==null?'':name); const ci=s.indexOf(',');
            if(ci>0){ const prefix=s.slice(0,ci), rest=s.slice(ci); const m=prefix.match(/(\S+)(\s*)$/);
                if(m){ const t=m[1];
                    if(/^[A-Za-z0-9]+$/.test(t)&&/[A-Za-z]/.test(t)&&/\d/.test(t)){
                        const before=prefix.slice(0, prefix.length-m[0].length);
                        return esc(before)+'<span class="name-badge" data-code="'+esc(t)+'">'+esc(t)+'</span>'+esc(m[2])+esc(rest); } } }
            return esc(s);
        }
        const dashCell=v=>(v==null||v===''||v==='-')?'<span class="dash">-</span>':esc(v);
        const locCell=v=>(v==null||v===''||v==='-')?'<span class="dash">-</span>':(String(v).trim()==='단종'?'<span class="loc-disc">단종</span>':esc(v));
        // 위치 열: 준비(재고 출고예정) 배정 위치가 있으면 그 위치-수량 표시, 없으면 발주서 원본 위치
        const stockLocCell=r=>(r.재고위치&&r.재고위치.length)
            ? '<span class="loc-stock">'+r.재고위치.map(a=>esc(a.location+'-'+a.qty)).join('<br>')+'</span>'
            : locCell(r.위치);
        function fmtCreatedAt(ts){
            if(!ts) return '-';
            const d=new Date(ts); if(isNaN(d.getTime())) return '-';
            const k=new Date(d.getTime()+9*3600*1000); // KST
            const p=n=>String(n).padStart(2,'0');
            return `${p(k.getUTCFullYear()%100)}-${p(k.getUTCMonth()+1)}-${p(k.getUTCDate())} ${p(k.getUTCHours())}:${p(k.getUTCMinutes())}:${p(k.getUTCSeconds())}`;
        }

        async function loadData(){
            try{
                // 발주서 + 출고준비(rk_shipping_list) + 출고스캔개수(rk_ship_box_items) 병렬 로드
                const [res,slRes,scRes]=await Promise.all([
                    fetch('/api/orders'), // Supabase 기반, referer=/rocket → dedup
                    fetch('/api/shipping-list?status='+encodeURIComponent('출고예정')),
                    fetch('/api/ship-scan/scanned-map')
                ]);
                if(!res.ok) throw new Error('HTTP '+res.status);
                const orders=await res.json();
                // 스캔수량: rk_ship_box_items 합계(발주번호+바코드, 박스 무관)로 대체
                const scanMap=scRes.ok?await scRes.json():{};
                // 발주번호|바코드 → {재고합, 입고합, 재고위치[]} (source: 재고→재고열+위치, 입고→입고V2열)
                const slMap=new Map();
                if(slRes.ok){
                    for(const s of await slRes.json()){
                        const k=`${s.orderNumber}|${s.barcode}`;
                        if(!slMap.has(k)) slMap.set(k,{재고:0,입고:0,재고위치:[]});
                        const m=slMap.get(k);
                        if(s.source==='재고'){ m.재고+=Number(s.qty)||0; if(s.location) m.재고위치.push({location:s.location, qty:Number(s.qty)||0}); }
                        else if(s.source==='입고') m.입고+=Number(s.qty)||0;
                    }
                    // 위치 오름차순 정렬
                    for(const m of slMap.values()) m.재고위치.sort((a,b)=>String(a.location).localeCompare(String(b.location),'ko',{numeric:true}));
                }
                allRows=[];
                for(const o of orders){
                    for(const p of (o.상품정보||[])){
                        const sl=slMap.get(`${o.발주번호}|${p.상품바코드}`);
                        allRows.push({발주번호:o.발주번호,물류센터:o.물류센터,입고예정일:o.입고예정일,
                            상품번호:p.상품번호,상품바코드:p.상품바코드,상품명:p.상품이름,
                            발주수량:p.발주수량,확정수량:p.확정수량,스캔수량:scanMap[`${o.발주번호}|${p.상품바코드}`]||0,
                            준비:(p.준비==null?null:p.준비),
                            재고:(sl&&sl.재고>0)?sl.재고:null,입고V2:(sl&&sl.입고>0)?sl.입고:null,
                            재고위치:(sl&&sl.재고위치&&sl.재고위치.length)?sl.재고위치:null,
                            입고1:p.입고1,위치:p.위치,created_at:o.created_at});
                    }
                }
                applySearch();
            }catch(e){
                document.getElementById('tbody').innerHTML=`<tr class="state-row"><td colspan="15">데이터를 불러오지 못했습니다: ${esc(e.message)}</td></tr>`;
            }
        }

        function render(){
            const tb=document.getElementById('tbody');
            const totalPages=Math.max(1,Math.ceil(viewRows.length/pageSize));
            if(currentPage>totalPages)currentPage=totalPages;
            const start=(currentPage-1)*pageSize;
            const pageRows=viewRows.slice(start,start+pageSize);
            if(pageRows.length===0){
                tb.innerHTML=`<tr class="state-row"><td colspan="15">표시할 발주 상품이 없습니다.</td></tr>`;
            }else{
                tb.innerHTML=pageRows.map((r,li)=>{
                    const i=start+li;
                    const scanN=Number(r.스캔수량)||0;
                    const conf=Number(r.확정수량)||0;
                    const scanHtml = (conf===scanN) ? `<span class="scan-badge scan-green">${scanN}</span>`
                        : (scanN>0 && conf>scanN) ? `<span class="scan-badge scan-orange">${scanN}</span>`
                        : `<span class="${scanN>0?'scan-pos':'scan-zero'}">${scanN}</span>`;
                    const ge=(viewRows[i+1]&&viewRows[i+1].발주번호!==r.발주번호)?'group-end':'';
                    return `<tr data-i="${i}" data-ord="${esc(r.발주번호)}" data-bc="${esc(r.상품바코드)}" class="${ge}">
                        <td class="chk"><input type="checkbox" class="rowchk" onchange="updateSel()"></td>
                        <td class="order-no">${esc(r.발주번호)}</td><td>${esc(r.물류센터)}</td>
                        <td>${esc(r.상품번호)}</td><td class="c-barcode">${esc(r.상품바코드)}</td><td class="pname">${modelBadge(r.상품명)}</td>
                        <td class="num dt">${esc(r.발주수량)}</td><td class="num dt">${esc(r.확정수량)}</td>
                        <td class="num dt">${scanHtml}</td>
                        <td class="ctr dt">${r.준비==null?'':esc(r.준비)}</td>
                        <td class="ctr dt">${dashCell(r.재고)}</td>
                        <td class="ctr dt">${dashCell(r.입고V2)}</td><td>${stockLocCell(r)}</td><td>${esc(r.입고예정일)}</td><td class="c-created">${esc(fmtCreatedAt(r.created_at))}</td>
                    </tr>`;
                }).join('');
            }
            document.getElementById('rowCount').textContent=viewRows.length;
            document.getElementById('checkAll').checked=false;
            renderPagination(totalPages);
            updateSel();
        }

        function renderPagination(totalPages){
            const el=document.getElementById('pagination');
            if(viewRows.length===0){el.innerHTML='';return;}
            let html=`<button ${currentPage===1?'disabled':''} onclick="gotoPage(${currentPage-1})">이전</button>`;
            for(const p of pageWindow(currentPage,totalPages)){
                html+= p==='...' ? `<span class="ellipsis">…</span>` : `<button class="${p===currentPage?'active':''}" onclick="gotoPage(${p})">${p}</button>`;
            }
            html+=`<button ${currentPage===totalPages?'disabled':''} onclick="gotoPage(${currentPage+1})">다음</button>`;
            el.innerHTML=html;
        }
        function pageWindow(cur,total){
            const out=[];
            if(total<=7){for(let i=1;i<=total;i++)out.push(i);return out;}
            out.push(1);
            if(cur>3)out.push('...');
            for(let i=Math.max(2,cur-1);i<=Math.min(total-1,cur+1);i++)out.push(i);
            if(cur<total-2)out.push('...');
            out.push(total);
            return out;
        }
        function gotoPage(p){
            const total=Math.max(1,Math.ceil(viewRows.length/pageSize));
            if(p<1||p>total)return;
            currentPage=p;render();
            const ts=document.querySelector('.table-scroll'); if(ts)ts.scrollTop=0;
        }
        function changePageSize(){
            pageSize=Number(document.getElementById('pageSize').value)||100;
            currentPage=1;render();
        }

        function applySearch(){
            // 콤마로 구분된 다중 검색어 → 하나라도 일치하면 표시 (OR)
            const terms=document.getElementById('searchInput').value.toLowerCase().split(',').map(t=>t.trim()).filter(Boolean);
            if(terms.length===0){ viewRows=allRows.slice(); }
            else{
                viewRows=allRows.filter(r=>{
                    const hay=[r.발주번호,r.물류센터,r.상품명,r.상품바코드,r.위치].map(v=>String(v||'').toLowerCase());
                    return terms.some(t=>hay.some(h=>h.includes(t)));
                });
            }
            // 미스캔 필터: (재고 + 입고V2) > 스캔 그리고 (재고 + 입고V2) > 0
            if(document.getElementById('scanFilter').value==='unscanned'){
                viewRows=viewRows.filter(r=>{
                    const prep=(Number(r.재고)||0)+(Number(r.입고V2)||0);
                    return prep>0 && prep>(Number(r.스캔수량)||0);
                });
            }
            currentPage=1;
            if(document.getElementById('sidePanel').classList.contains('show')) renderOrderPanel();
            render();
        }

        function toggleAll(el){document.querySelectorAll('.rowchk').forEach(c=>c.checked=el.checked);updateSel();}
        function updateSel(){
            const checks=[...document.querySelectorAll('.rowchk')];
            const n=checks.filter(c=>c.checked).length;
            document.getElementById('selCount').textContent=n;
            const all=document.getElementById('checkAll');
            all.checked=checks.length>0&&n===checks.length;all.indeterminate=n>0&&n<checks.length;
        }
        function selectedRows(){
            const out=[];
            document.querySelectorAll('#tbody tr').forEach(tr=>{const c=tr.querySelector('.rowchk');if(c&&c.checked)out.push(viewRows[Number(tr.dataset.i)]);});
            return out;
        }
        function selectedOrderNumbers(){return [...new Set(selectedRows().map(r=>r.발주번호))];}

        // ── 전체보기 슬라이드 패널 ──
        function uniqueOrders(){
            const m=new Map();
            for(const r of allRows){
                if(!m.has(r.발주번호)) m.set(r.발주번호,{발주번호:r.발주번호,물류센터:r.물류센터,입고예정일:r.입고예정일,count:0});
                m.get(r.발주번호).count++;
            }
            return [...m.values()];
        }
        function currentSearchTerms(){
            return document.getElementById('searchInput').value.split(',').map(t=>t.trim()).filter(Boolean);
        }
        function renderOrderPanel(){
            const orders=uniqueOrders();
            const terms=currentSearchTerms();
            document.getElementById('sideCount').textContent=`${orders.length}건`;
            // 입고예정일(날짜)별 그룹 → 날짜 헤더 아래 발주서를 가로로 나열
            const byDate=new Map();
            for(const o of orders){
                const d=o.입고예정일||'(미정)';
                if(!byDate.has(d)) byDate.set(d,[]);
                byDate.get(d).push(o);
            }
            let html='';
            for(const [date,list] of byDate){
                const dateSel=list.length>0&&list.every(o=>terms.includes(o.발주번호))?'sel':'';
                html+=`<div class="side-date ${dateSel}" onclick="toggleDateInSearch('${esc(date)}')">${esc(date)}</div>`;
                // 같은 날짜 안에서 지역(물류센터)별로 줄바꿈 (각 지역 = 별도 flex 행)
                const byCenter=new Map();
                for(const o of list){
                    const c=o.물류센터||'(미정)';
                    if(!byCenter.has(c)) byCenter.set(c,[]);
                    byCenter.get(c).push(o);
                }
                for(const [,corders] of byCenter){
                    html+=`<div class="side-orders">`;
                    html+=corders.map(o=>{
                        const sel=terms.includes(o.발주번호)?'sel':'';
                        return `<div class="side-order ${sel}" onclick="toggleOrderInSearch('${esc(o.발주번호)}')">
                            <div class="so-no">${esc(o.발주번호)} <span class="so-cnt">(${o.count})</span></div>
                            <div class="so-center">${esc(o.물류센터)}</div></div>`;
                    }).join('');
                    html+=`</div>`;
                }
            }
            document.getElementById('sideList').innerHTML=html;
        }
        function openOrderPanel(){
            renderOrderPanel();
            document.getElementById('sideBack').classList.add('show');
            document.getElementById('sidePanel').classList.add('show');
        }
        function closeOrderPanel(){
            document.getElementById('sideBack').classList.remove('show');
            document.getElementById('sidePanel').classList.remove('show');
        }
        function toggleOrderInSearch(no){
            const inp=document.getElementById('searchInput');
            const terms=inp.value.split(',').map(t=>t.trim()).filter(Boolean);
            const idx=terms.indexOf(no);
            if(idx===-1) terms.push(no); else terms.splice(idx,1);
            inp.value=terms.join(', ');
            applySearch(); // renderOrderPanel() 은 applySearch 내부에서 호출됨(패널 열려있을 때)
        }
        // 날짜 클릭 → 해당 날짜의 모든 발주번호 토글 (전부 선택돼있으면 해제, 아니면 전부 추가)
        function toggleDateInSearch(date){
            const nos=uniqueOrders().filter(o=>(o.입고예정일||'(미정)')===date).map(o=>o.발주번호);
            const inp=document.getElementById('searchInput');
            let terms=inp.value.split(',').map(t=>t.trim()).filter(Boolean);
            const allSel=nos.length>0&&nos.every(n=>terms.includes(n));
            if(allSel) terms=terms.filter(t=>!nos.includes(t));
            else for(const n of nos) if(!terms.includes(n)) terms.push(n);
            inp.value=terms.join(', ');
            applySearch();
        }

        let toastTimer;
        function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800);}

        let _modalResolve=null;
        function openModal({title,desc,value='',password=false}){
            document.getElementById('mTitle').textContent=title;
            document.getElementById('mDesc').textContent=desc||'';
            const inp=document.getElementById('mInput');inp.type=password?'password':'text';inp.value=value;
            document.getElementById('modalBack').classList.add('show');
            setTimeout(()=>inp.focus(),50);
            return new Promise(res=>{_modalResolve=res;});
        }
        function modalResolve(v){document.getElementById('modalBack').classList.remove('show');if(_modalResolve){_modalResolve(v);_modalResolve=null;}}
        function modalConfirm(){modalResolve(document.getElementById('mInput').value);}
        document.getElementById('mInput').addEventListener('keydown',e=>{if(e.key==='Enter')modalConfirm();if(e.key==='Escape')modalResolve(null);});

        // ── Excel 업로드 ──
        async function uploadExcel(input){
            const file=input.files[0];if(!file)return;
            const fd=new FormData();fd.append('file',file);
            toast('업로드 중…');
            try{
                const res=await fetch('/api/upload',{method:'POST',body:fd});
                const data=await res.json();
                toast(data.message||'업로드 완료');
                await loadData();
            }catch(e){toast('업로드 실패: '+e.message);}
            input.value='';
        }

        // ── 저장(발주리스트 엑셀) ──
        async function saveOrders(){
            // 체크된 게 있으면 그 발주서, 없으면 현재 검색/필터된 결과의 발주서를 저장
            let orderNumbers=selectedOrderNumbers();
            const fromSelection=orderNumbers.length>0;
            if(!fromSelection) orderNumbers=[...new Set(viewRows.map(r=>r.발주번호))];
            if(!orderNumbers.length){toast('저장할 발주서가 없습니다.');return;}
            try{
                const res=await fetch('/api/orders/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderNumbers})});
                if(!res.ok)throw new Error('HTTP '+res.status);
                const blob=await res.blob();
                const cd=res.headers.get('Content-Disposition')||'';
                const m=cd.match(/filename\*?=(?:UTF-8'')?["']?([^"';]+)/i);
                const fname=m?decodeURIComponent(m[1]):'발주리스트.xlsx';
                const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;a.click();URL.revokeObjectURL(a.href);
                toast(`엑셀 저장 완료 (${orderNumbers.length}건${fromSelection?'':' · 검색결과'})`);
            }catch(e){toast('저장 실패: '+e.message);}
        }

        // ── 처리완료(비밀번호) : rk_orders.status = 'DONE' 로 변경 (삭제 아님) ──
        async function completeRows(){
            const orderNumbers=selectedOrderNumbers();
            if(!orderNumbers.length){toast('처리완료할 발주서를 선택해주세요.');return;}
            const password=await openModal({title:'발주서 처리완료',desc:`${orderNumbers.length}건을 처리완료로 변경합니다. 비밀번호를 입력하세요.`,password:true});
            if(password===null)return;
            if(String(password).trim()!=='cheoqkr1!'){toast('패스워드가 올바르지 않습니다.');return;}
            try{
                const res=await fetch('/api/orders/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderNumbers})});
                const data=await res.json();
                if(!res.ok||data.success===false){toast(data.message||'처리완료 실패');return;}
                toast(`처리완료 (${data.updatedCount??orderNumbers.length}건)`);
                await loadData();
            }catch(e){toast('처리완료 실패: '+e.message);}
        }

        // ── 드롭다운 (변경 / 콘솔) ──
        function toggleDd(e,id){
            e.stopPropagation();
            const m=document.getElementById(id);
            const open=m.classList.contains('show');
            closeDd();
            if(!open) m.classList.add('show');
        }
        function closeDd(){document.querySelectorAll('.dd-menu.show').forEach(x=>x.classList.remove('show'));}
        function ddRun(fn){closeDd();fn();}
        document.addEventListener('click',closeDd);

        // ── 콘솔 복사 ──
        // status=PROCESSING 발주서 중, rk_inventories 에 sku/바코드/상품명/이미지가 완비되지 않은
        // 상품이 있는 발주서만 서버에서 골라와 스크립트에 심는다(완비 발주서는 fetch 자체를 안 함).
        async function copyOrderConsoleScript(){
            try{
                toast('추출 대상 조회 중…');
                const res=await fetch('/api/orders/console-targets');
                const d=await res.json();
                if(!res.ok) throw new Error(d.error||'대상 조회 실패');

        function buildOrderConsoleScript(ids,barcodes){
            const IDS=JSON.stringify(ids);

            return `/* 쿠팡 발주서 품목 추출 → 엑셀 다운로드
   대상 발주서 ${ids.length}건 / 보완 필요 상품 ${(barcodes||[]).length}건

(async () => {
  const IDS = ${IDS};

  const BASE = 'https://supplier.coupang.com/scm/purchase/order/get/';
  const DELAY_MS = 1500;   // 요청 간 간격. 짧게 줄이면 봇 차단(Akamai)에 걸릴 수 있음
  const THUMB = '492x492ex';
  const sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  const clean = function (s) { return (s || '').replace(/\\s+/g, ' ').trim(); };
  const toOriginal = function (u) {
    if (!u) return '';
    var i = u.indexOf('/image/');
    return i === -1 ? u : 'https://img1.coupangcdn.com' + u.slice(i);
  };
  const toThumb = function (u) {
    if (!u) return '';
    var m = u.indexOf('/thumbnails/remote/');
    if (m === -1) return u;
    var rest = u.slice(m + 19), sl = rest.indexOf('/');
    return sl === -1 ? u : u.slice(0, m) + '/thumbnails/remote/' + THUMB + rest.slice(sl);
  };

  var AUTH_FAIL = false;

  async function parsePO(poId) {
    var res;
    try {
      res = await fetch(BASE + poId, { credentials: 'include' });
    } catch (e) {
      // 로그인/차단 페이지로 리다이렉트되면 교차 출처가 되어 CORS 로 fetch 자체가 실패한다.
      AUTH_FAIL = true;
      throw new Error('요청 차단 또는 세션 만료 (' + e.message + ')');
    }
    if (res.redirected && res.url.indexOf('/scm/purchase/order/') === -1) {
      AUTH_FAIL = true;
      throw new Error('로그인 페이지로 리다이렉트됨');
    }
    if (!res.ok) {
      if (res.status === 401 || res.status === 403 || res.status === 429) AUTH_FAIL = true;
      throw new Error('HTTP ' + res.status);
    }
    const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
    if (!/발주상세/.test(doc.title || '')) {
      AUTH_FAIL = true;
      throw new Error('발주상세 페이지가 아님 — 로그인 상태를 확인하세요');
    }
    const hidden = doc.querySelectorAll('input[name="skuName"]');
    const rows = [];
    doc.querySelectorAll('tr[data-sku-seq]').forEach(function (tr, i) {
      const a = tr.querySelector('a.sku-seq');
      const sku = tr.getAttribute('data-sku-seq') || clean(a ? a.textContent : '');
      const im = tr.querySelector('img[src*="coupangcdn"]');
      const rawImg = im ? im.getAttribute('src') : '';
      var barcode = '', name = '';
      tr.querySelectorAll('td ul.list-group').forEach(function (ul) {
        const li = Array.prototype.slice.call(ul.querySelectorAll('li')).map(function (x) { return clean(x.textContent); });
        if (!li.length) return;
        if (/^(직매입|위탁|특약|판매자|무한)/.test(li[0])) return;   // 매입유형/과세여부 칸
        barcode = li[0]; name = li[1] || '';
      });
      if (!name && hidden[i]) name = clean(hidden[i].value);
      if (NEED.size && barcode && !NEED.has(barcode)) return;        // 이미 완비된 상품은 건너뜀
      rows.push({ 발주서: String(poId), sku: String(sku || ''), barcode: String(barcode || ''),
                  상품명: name, 이미지: toOriginal(rawImg), 썸네일: toThumb(rawImg) });
    });
    console.log('[' + poId + '] 추출 ' + rows.length + '건');
    return rows;
  }

  // 한 번에 하나씩, 간격을 두고 순차 요청한다. 실패가 차단/세션만료면 즉시 중단하고
  // 그때까지 모은 데이터라도 파일로 저장한다(계속 두드리면 차단이 더 길어짐).
  const all = [];
  var okCount = 0;
  for (var i = 0; i < IDS.length; i++) {
    if (i > 0) await sleep(DELAY_MS);
    try {
      const rows = await parsePO(IDS[i]);
      all.push.apply(all, rows);
      okCount++;
      console.log('진행 ' + (i + 1) + '/' + IDS.length + ' · 누적 ' + all.length + '건');
    } catch (e) {
      console.error('[' + IDS[i] + '] 실패: ' + e.message);
      if (AUTH_FAIL) {
        console.warn('%c⚠ 접근 차단/세션 만료 감지 — 즉시 중단합니다 (' + okCount + '/' + IDS.length + '건 완료)',
                     'background:#c00;color:#fff;padding:3px 10px;font-weight:bold');
        console.warn('브라우저에서 supplier.coupang.com 이 정상적으로 열리는지 먼저 확인하고, 잠시 후 다시 실행하세요.');
        break;
      }
    }
  }
  if (!all.length) { console.warn('추출된 데이터가 없어 파일을 만들지 않습니다.'); return; }

  const uniq = new Map();
  all.forEach(function (r) { const k = r.barcode || r.sku; if (k && !uniq.has(k)) uniq.set(k, r); });
  const data = Array.from(uniq.values());
  console.log('%c총 ' + data.length + '건 (중복 제거 후)', 'background:#06c;color:#fff;padding:3px 10px;font-weight:bold');
  console.table(data.slice(0, 50));

  const bad = data.filter(function (r) { return !r.sku || !r.barcode || !r.상품명 || !r.이미지; });
  if (bad.length) { console.warn('필드 누락 ' + bad.length + '건 — 아래 확인'); console.table(bad.slice(0, 30)); }
  else console.log('%c✔ 모든 행에 sku/barcode/상품명/이미지 채워짐', 'color:#0a0;font-weight:bold');

  // 값은 모두 문자열로 기록 (Supabase 가 text 컬럼이라 숫자 변환 방지)
  const header = ['SKU ID', '상품명', '바코드', '이미지URL', '발주서'];
  const aoa = [header].concat(data.map(function (d) {
    return [String(d.sku || ''), String(d.상품명 || ''), String(d.barcode || ''), String(d.이미지 || ''), String(d.발주서 || '')];
  }));
  function dl(blob, name) {
    const u = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(u);
  }
  try {
    if (!window.XLSX) {
      await new Promise(function (ok, ng) {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
        s.onload = ok; s.onerror = ng; document.head.appendChild(s);
      });
    }
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '발주서추출');
    XLSX.writeFile(wb, 'console_orders.xlsx');
    console.log('%c✔ 엑셀 다운로드 완료: console_orders.xlsx', 'color:#0a0;font-weight:bold');
  } catch (e) {
    console.warn('xlsx 생성 실패 → CSV 로 대체', e);
    const esc = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
    const csv = '\\ufeff' + aoa.map(function (r) { return r.map(esc).join(','); }).join('\\r\\n');
    dl(new Blob([csv], { type: 'text/csv;charset=utf-8;' }), 'console_orders.csv');
    console.log('%c✔ CSV 다운로드 완료: console_orders.csv', 'color:#0a0;font-weight:bold');
  }
  window.PO_ROWS = data;
  console.log('%cwindow.PO_ROWS 로 원본 확인 가능', 'background:#222;color:#fff;padding:2px 6px');
})();`;
        }

            try{
                const res=await fetch('/api/rocket/scan-detail/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shippingList:shipping, boxItems:box, stocks:stock})});
                const d=await res.json();
                if(!res.ok) throw new Error(d.error||'저장 실패');
                toast(`저장 완료 (예정 ${d.shippingUpdated||0} · 박스 ${d.boxUpdated||0} · 재고 ${d.stockUpdated||0})`);
                await openScanDetail(scanCtx.orderNumber, scanCtx.barcode, scanCtx.name); // 최신값 재조회
                loadData();  // 목록 스캔수량 갱신
            }catch(e){ btn.textContent='저장'; updateScanSaveBtn(); toast('저장 실패: '+e.message); }
        }
        function renderScanDetail(d){
            const sl=d.shippingList||[], bi=d.boxItems||[], st=d.stocks||[];
            // 1) 출고예정 내역: 구분(재고/입고) · 생성일(created_at) · 회차 · 수량
            const slSorted=sl.slice().sort((a,b)=>String(a.source).localeCompare(String(b.source))||((b.batchNo||0)-(a.batchNo||0)));
            const slRows = sl.length
                ? slSorted.map(r=>`<tr>
                    <td class="c">${r.source==='재고'?'<span class="type-pill jaego">재고</span>':'<span class="type-pill ipgo">입고</span>'}</td>
                    <td class="c">${esc(dateOnly(r.createdAt))}</td>
                    <td class="c">${r.batchNo?esc(r.batchNo):'–'}</td>
                    <td class="r qty-edit" contenteditable="true" data-kind="shipping" data-id="${esc(r.id)}" data-orig="${Number(r.qty)||0}" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}" oninput="updateScanSaveBtn()" onblur="sanitizeQty(this)">${Number(r.qty)||0}</td></tr>`).join('')
                : `<tr><td colspan="4" class="hempty">출고예정 내역이 없습니다.</td></tr>`;
            // 2) 출고스캔 박스: 박스(📦N번) · 크기 · 수량(편집)
            const biRows = bi.length
                ? bi.map(r=>`<tr>
                    <td class="c"><span class="box-emoji">📦 ${esc(r.boxNo)}번</span></td>
                    <td class="c">${esc(r.boxSize||'-')}</td>
                    <td class="r">${Number(r.qty)||0}</td></tr>`).join('')
                : `<tr><td colspan="3" class="hempty">스캔된 박스가 없습니다.</td></tr>`;
            // 3) 재고 (rk_stocks): 위치 · 수량(편집)
            const stRows = st.length
                ? st.map(r=>`<tr>
                    <td>${esc(r.location)}</td>
                    <td class="r qty-edit" contenteditable="true" data-kind="stock" data-id="${esc(r.id)}" data-orig="${r.qty==null?'':Number(r.qty)}" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}" oninput="updateScanSaveBtn()" onblur="sanitizeQty(this)">${r.qty==null?'-':Number(r.qty)}</td></tr>`).join('')
                : `<tr><td colspan="2" class="hempty">재고가 없습니다.</td></tr>`;
            const stSum=st.reduce((s,r)=>s+(Number(r.qty)||0),0);
            return `
                <div class="scard">
                    <div class="scard-h"><span class="t">출고예정 내역</span><span class="cnt">${sl.length}건</span></div>
                    <table class="htable"><colgroup><col style="width:24%"><col style="width:36%"><col style="width:18%"><col style="width:22%"></colgroup>
                        <thead><tr><th class="c">구분</th><th class="c">생성일</th><th class="c">회차</th><th class="r">수량</th></tr></thead><tbody>${slRows}</tbody></table>
                </div>
                <div class="scard">
                    <div class="scard-h"><span class="t">출고스캔 박스</span><span class="cnt">박스 ${bi.length}개</span></div>
                    <table class="htable"><colgroup><col style="width:34%"><col style="width:40%"><col style="width:26%"></colgroup>
                        <thead><tr><th class="c">박스</th><th class="c">크기</th><th class="r">수량</th></tr></thead><tbody>${biRows}</tbody></table>
                </div>
                <div class="scard">
                    <div class="scard-h"><span class="t">재고 <span style="color:#9aa1b0;font-weight:600;font-size:11px;">rk_stocks</span></span><span class="cnt green">가용 ${stSum}</span></div>
                    <table class="htable"><colgroup><col style="width:70%"><col style="width:30%"></colgroup>
                        <thead><tr><th>위치</th><th class="r">수량</th></tr></thead><tbody>${stRows}</tbody></table>
                </div>`;
        }

        // ── 발주~입고 값 클릭 → 상세 / 상품명 배지 클릭 → 복사 (event delegation) ──
        (function(){
            const tb=document.getElementById('tbody');
            if(!tb) return;
            tb.addEventListener('click', e=>{
                const badge=e.target.closest('.name-badge');
                if(badge){ copyBadge(badge); return; }
                const cell=e.target.closest('td.dt');
                if(!cell) return;
                const tr=cell.closest('tr'); if(!tr) return;
                const ord=tr.getAttribute('data-ord'), bc=tr.getAttribute('data-bc');
                const pn=tr.querySelector('td.pname');
                openScanDetail(ord, bc, pn?pn.textContent.trim():'');
            });
        })();
        function copyBadge(b){
            const code=b.getAttribute('data-code')||b.textContent;
            const done=()=>{ b.classList.add('copied'); setTimeout(()=>b.classList.remove('copied'),900); };
            if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(code).then(done).catch(()=>fbCopy(code,done)); }
            else fbCopy(code,done);
        }
        function fbCopy(text,cb){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(_){} ta.remove(); cb&&cb(); }

        loadData();
    </script>

    <!-- 스캔 상세 오른쪽 슬라이드 -->
    <div class="scan-back" id="scanBack" onclick="if(event.target.id==='scanBack')closeScanDetail()">
        <div class="scan-modal">
            <div class="scan-top">
                <div class="scan-head">
                    <span class="lbl">ITEM DETAIL</span>
                    <button onclick="closeScanDetail()">✕</button>
                </div>
                <div class="item-detail">
                    <div class="thumb" id="scanThumb"></div>
                    <div class="idinfo">
                        <div class="iname" id="scanName"></div>
                        <div class="ibadges" id="scanBadges"></div>
                        <div class="icode" id="scanCode"></div>
                    </div>
                </div>
            </div>
            <div class="scan-scroll"><div id="scanBody"></div></div>
            <div class="scan-foot"><button class="savebtn" id="scanSaveBtn" onclick="saveScanEdits()" disabled>저장</button></div>
        </div>
    </div>
</body>
</html>
